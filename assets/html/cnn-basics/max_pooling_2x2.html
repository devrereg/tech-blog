<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>최대 풀링(Max Pooling) 연산 시각화</title>
<style>
  :root {
    --bg: #ffffff;
    --border: #d3d1c7;
    --accent-bg: #e6f1fb;
    --accent-border: #378add;
    --accent-text: #0c447c;
    --success-bg: #eaf3de;
    --success-border: #639922;
    --success-text: #27500a;
    --text-primary: #2c2c2a;
    --text-secondary: #5f5e5a;
  }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    margin: 0;
    padding: 24px 16px;
    background: var(--bg);
    color: var(--text-primary);
  }
  .wrap {
    max-width: 640px;
    margin: 0 auto;
  }
  h2.title {
    font-size: 16px;
    font-weight: 600;
    text-align: center;
    margin: 0 0 20px;
  }
  .boards {
    display: flex;
    flex-wrap: wrap;
    gap: 28px;
    align-items: flex-start;
    justify-content: center;
  }
  .board-label {
    font-size: 13px;
    color: var(--text-secondary);
    text-align: center;
    margin: 0 0 8px;
  }
  .arrow {
    display: flex;
    align-items: center;
    font-size: 22px;
    color: var(--text-secondary);
    padding-top: 74px;
  }
  .controls {
    display: flex;
    gap: 10px;
    justify-content: center;
    margin-top: 20px;
  }
  button {
    font-size: 14px;
    padding: 8px 16px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: #fff;
    cursor: pointer;
  }
  button:hover { background: #f5f5f3; }
  button.primary {
    background: var(--accent-text);
    color: #fff;
    border-color: var(--accent-text);
  }
  button.primary:hover { opacity: 0.9; }
  #calc-text {
    text-align: center;
    margin-top: 14px;
    font-size: 13px;
    color: var(--text-secondary);
    min-height: 18px;
  }
  svg text { font-family: inherit; }
</style>
</head>
<body>
<div class="wrap">
  <h2 class="title">최대 풀링(Max Pooling): 2×2 구역에서 최댓값만 남기기</h2>
  <div class="boards">
    <div>
      <p class="board-label">특징 맵 (4×4)</p>
      <svg id="input-svg" width="192" height="192" viewBox="0 0 192 192"></svg>
    </div>
    <div class="arrow">→</div>
    <div>
      <p class="board-label">풀링 결과 (2×2)</p>
      <svg id="output-svg" width="96" height="96" viewBox="0 0 96 96"></svg>
    </div>
  </div>
  <div class="controls">
    <button class="primary" id="step-btn" onclick="stepPool()">다음 구역 이동 →</button>
    <button onclick="resetPool()">처음으로</button>
  </div>
  <p id="calc-text"></p>
</div>

<script>
const vals = [
  [1,3,2,4],
  [5,6,1,2],
  [0,2,7,1],
  [3,1,0,8]
];
let pos = 0;
const outVals = Array(2).fill(null).map(() => Array(2).fill(null));
const cell = 48;
const ocell = 48;

function drawInput(pr, pc) {
  const svg = document.getElementById('input-svg');
  let html = '';
  for (let r = 0; r < 4; r++) {
    for (let c = 0; c < 4; c++) {
      const inWin = r >= pr*2 && r < pr*2+2 && c >= pc*2 && c < pc*2+2;
      html += `<rect x="${c*cell}" y="${r*cell}" width="${cell}" height="${cell}" fill="${inWin ? 'var(--accent-bg)' : '#f7f7f5'}" stroke="var(--border)" stroke-width="1"/>`;
      html += `<text x="${c*cell+cell/2}" y="${r*cell+cell/2}" text-anchor="middle" dominant-baseline="central" font-size="16" fill="var(--text-primary)">${vals[r][c]}</text>`;
    }
  }
  html += `<rect x="${pc*2*cell}" y="${pr*2*cell}" width="${cell*2}" height="${cell*2}" fill="none" stroke="var(--accent-border)" stroke-width="3" rx="4"/>`;
  svg.innerHTML = html;
}

function drawOutput() {
  const svg = document.getElementById('output-svg');
  let html = '';
  for (let r = 0; r < 2; r++) {
    for (let c = 0; c < 2; c++) {
      const v = outVals[r][c];
      html += `<rect x="${c*ocell}" y="${r*ocell}" width="${ocell}" height="${ocell}" fill="${v !== null ? 'var(--success-bg)' : '#f7f7f5'}" stroke="var(--border)" stroke-width="1"/>`;
      if (v !== null) {
        html += `<text x="${c*ocell+ocell/2}" y="${r*ocell+ocell/2}" text-anchor="middle" dominant-baseline="central" font-size="16" fill="var(--success-text)">${v}</text>`;
      }
    }
  }
  svg.innerHTML = html;
}

function stepPool() {
  if (pos >= 4) {
    pos = 0;
    outVals.forEach(row => row.fill(null));
  }
  const pr = Math.floor(pos / 2), pc = pos % 2;
  let vs = [];
  for (let r = 0; r < 2; r++) {
    for (let c = 0; c < 2; c++) {
      vs.push(vals[pr*2+r][pc*2+c]);
    }
  }
  const maxV = Math.max(...vs);
  outVals[pr][pc] = maxV;
  drawInput(pr, pc);
  drawOutput();
  document.getElementById('calc-text').textContent = `구역 값: [${vs.join(', ')}] 중 최댓값 = ${maxV}`;
  pos++;
}

function resetPool() {
  pos = 0;
  outVals.forEach(row => row.fill(null));
  drawInput(0, 0);
  drawOutput();
  document.getElementById('calc-text').textContent = '"다음 구역 이동" 버튼을 눌러 2×2 최대 풀링 과정을 확인해보세요.';
}

resetPool();
</script>
</body>
</html>
