<svg viewBox="0 0 950 340" xmlns="http://www.w3.org/2000/svg" font-family="'Pretendard','Malgun Gothic',sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="950" height="340" fill="#FAFAFA"/>
  <text x="475" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#1E293B">학습 속도 최적화 — 단계별로 쌓아 올리기</text>

  <!-- stage boxes -->
  <g>
    <rect x="30" y="90" width="180" height="110" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="2"/>
    <text x="120" y="120" text-anchor="middle" font-size="14" font-weight="700" fill="#334155">① 기준선</text>
    <text x="120" y="142" text-anchor="middle" font-size="11" fill="#64748B">num_workers=0</text>
    <text x="120" y="158" text-anchor="middle" font-size="11" fill="#64748B">FP32</text>
    <text x="120" y="185" text-anchor="middle" font-size="15" font-weight="700" fill="#334155">1.0×</text>
  </g>

  <line x1="215" y1="145" x2="250" y2="145" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrow4)"/>

  <g>
    <rect x="255" y="90" width="180" height="110" rx="10" fill="#DBEAFE" stroke="#3B82F6" stroke-width="2"/>
    <text x="345" y="120" text-anchor="middle" font-size="14" font-weight="700" fill="#1D4ED8">② DataLoader</text>
    <text x="345" y="142" text-anchor="middle" font-size="11" fill="#1E40AF">num_workers 튜닝</text>
    <text x="345" y="158" text-anchor="middle" font-size="11" fill="#1E40AF">pin_memory=True</text>
    <text x="345" y="185" text-anchor="middle" font-size="15" font-weight="700" fill="#1D4ED8">1.3×</text>
  </g>

  <line x1="440" y1="145" x2="475" y2="145" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrow4)"/>

  <g>
    <rect x="480" y="90" width="180" height="110" rx="10" fill="#FEF3C7" stroke="#F59E0B" stroke-width="2"/>
    <text x="570" y="120" text-anchor="middle" font-size="14" font-weight="700" fill="#B45309">③ AMP</text>
    <text x="570" y="142" text-anchor="middle" font-size="11" fill="#92400E">autocast(FP16)</text>
    <text x="570" y="158" text-anchor="middle" font-size="11" fill="#92400E">GradScaler</text>
    <text x="570" y="185" text-anchor="middle" font-size="15" font-weight="700" fill="#B45309">2.1×</text>
  </g>

  <line x1="665" y1="145" x2="700" y2="145" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrow4)"/>

  <g>
    <rect x="705" y="90" width="200" height="110" rx="10" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/>
    <text x="805" y="120" text-anchor="middle" font-size="14" font-weight="700" fill="#166534">④ torch.compile</text>
    <text x="805" y="142" text-anchor="middle" font-size="11" fill="#15803D">연산 그래프</text>
    <text x="805" y="158" text-anchor="middle" font-size="11" fill="#15803D">사전 컴파일</text>
    <text x="805" y="185" text-anchor="middle" font-size="15" font-weight="700" fill="#166534">2.6×</text>
  </g>

  <!-- side note: gradient accumulation -->
  <rect x="255" y="240" width="430" height="70" rx="10" fill="#F5F3FF" stroke="#8B5CF6" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="470" y="265" text-anchor="middle" font-size="12" font-weight="700" fill="#5B21B6">＋ Gradient Accumulation (선택적으로 병행)</text>
  <text x="470" y="285" text-anchor="middle" font-size="11" fill="#5B21B6">메모리가 부족할 때: 작은 배치 여러 번 → 큰 배치 효과</text>

  <text x="475" y="330" text-anchor="middle" font-size="12" fill="#94A3B8">※ 배속 수치는 예시이며 실제 값은 GPU·모델·데이터에 따라 다릅니다</text>

  <defs>
    <marker id="arrow4" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#94A3B8"/>
    </marker>
  </defs>
</svg>
