<svg width="1000" height="620" viewBox="0 0 1000 620" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, Arial, sans-serif">
  <rect width="1000" height="620" fill="#ffffff"/>

  <!-- Header -->
  <rect x="40" y="28" width="28" height="28" rx="8" fill="#2f6fd0"/>
  <text x="54" y="47" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">1</text>
  <text x="80" y="49" font-size="21" font-weight="700" fill="#1a1a1a">생성형 모델이란?</text>
  <line x1="40" y1="72" x2="960" y2="72" stroke="#dbe4f3" stroke-width="2"/>

  <!-- Key Question -->
  <rect x="425" y="98" width="150" height="26" rx="13" fill="#efeaff" stroke="#c7b8fb"/>
  <text x="500" y="116" text-anchor="middle" font-size="12" font-weight="700" fill="#7c5cff" letter-spacing="0.5">KEY QUESTION</text>

  <text x="500" y="164" text-anchor="middle" font-size="25" font-weight="800" fill="#1a1a1a">"AI는 <tspan fill="#7c5cff" text-decoration="underline">새로운 이미지</tspan>를</text>
  <text x="500" y="200" text-anchor="middle" font-size="25" font-weight="800" fill="#1a1a1a">만들어낼 수 있을까?"</text>

  <!-- Left card: Discriminative -->
  <rect x="40" y="240" width="430" height="180" rx="14" fill="#fbfbfc" stroke="#e2e4e9" stroke-width="1.5"/>
  <text x="440" y="272" text-anchor="end" font-size="20">🔍</text>
  <text x="64" y="274" font-size="15" font-weight="700" fill="#3a3f4a">기존 AI (Discriminative)</text>
  <text x="64" y="310" font-size="13" fill="#4b4f58"><tspan fill="#1f9e5c" font-weight="700">✓</tspan> 분류 (Classification): "이게 고양이인가?"</text>
  <text x="64" y="338" font-size="13" fill="#4b4f58"><tspan fill="#1f9e5c" font-weight="700">✓</tspan> 검출 (Detection): "고양이가 어디에 있지?"</text>
  <rect x="64" y="370" width="3" height="16" fill="#9aa5b1"/>
  <text x="76" y="382" font-size="12.5" fill="#7a7f89">이미지를 보고 <tspan font-weight="700" fill="#4b4f58">판단(Decision)</tspan>하는 것에 집중</text>

  <!-- Right card: Generative -->
  <rect x="530" y="240" width="430" height="180" rx="14" fill="#f8f6ff" stroke="#c7b8fb" stroke-width="1.5"/>
  <text x="930" y="272" text-anchor="end" font-size="20">✨</text>
  <text x="554" y="274" font-size="15" font-weight="700" fill="#5b3fd6">생성형 AI (Generative)</text>
  <text x="554" y="310" font-size="13" fill="#4b4f58"><tspan fill="#7c5cff" font-weight="700">★</tspan> 생성 (Generation): "없는 고양이를 그려라"</text>
  <text x="554" y="338" font-size="13" fill="#4b4f58"><tspan fill="#7c5cff" font-weight="700">★</tspan> 합성 (Synthesis): "사람 얼굴을 만화처럼"</text>
  <rect x="554" y="370" width="3" height="16" fill="#7c5cff"/>
  <text x="566" y="382" font-size="12.5" fill="#7a7f89">판단하지 않고 <tspan font-weight="700" fill="#5b3fd6">창조(Creation)</tspan>하는 것에 집중</text>

  <!-- Definition box -->
  <rect x="40" y="450" width="920" height="110" rx="14" fill="#1f2330"/>
  <text x="64" y="482" font-size="20" fill="#c9cdd8">"</text>
  <rect x="64" y="470" width="70" height="20" rx="10" fill="#3a3f52"/>
  <text x="99" y="484" text-anchor="middle" font-size="10" font-weight="700" fill="#dfe1ea" letter-spacing="0.5">IN SHORT</text>
  <text x="500" y="518" text-anchor="middle" font-size="14.5" font-weight="600" fill="#ffffff">"판단(Discriminative)"이 아니라 "창조(Generative)" —</text>
  <text x="500" y="542" text-anchor="middle" font-size="14.5" font-weight="600" fill="#ffffff">이 둘의 방향이 정반대라는 것부터가 생성형 모델을 이해하는 출발점입니다.</text>
</svg>
