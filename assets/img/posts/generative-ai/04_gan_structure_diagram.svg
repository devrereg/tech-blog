<svg width="1000" height="480" viewBox="0 0 1000 480" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, Arial, sans-serif">
  <defs>
    <marker id="a4" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#2b3a52"/>
    </marker>
  </defs>
  <rect width="1000" height="480" fill="#ffffff"/>

  <text x="40" y="42" font-size="15.5" font-weight="700" fill="#3a3f4a">GAN <tspan font-weight="800" fill="#1a1a1a">생성적 적대 신경망</tspan>(Generative Adversarial Network)</text>
  <text x="60" y="66" font-size="12.5" fill="#5f6470">- 2014년 처음 제안된 생성 모델이다.</text>
  <text x="60" y="88" font-size="12.5" fill="#3a3f4a"><tspan font-weight="700">생성기(Generator)</tspan>와 <tspan font-weight="700">판별기(Discriminator)</tspan>라는 두 개의 신경망이 경쟁적으로 학습</text>
  <text x="80" y="110" font-size="12" fill="#5f6470">생성기는 <tspan font-weight="700" fill="#146538">진짜처럼 보이는 가짜 데이터</tspan>를 생성하고,</text>
  <text x="80" y="130" font-size="12" fill="#5f6470">판별기는 <tspan font-weight="700" fill="#173a70">입력된 데이터가 진짜인지 가짜인지</tspan> 구별하는 역할을 한다.</text>
  <text x="60" y="154" font-size="12.5" fill="#3a3f4a">이 두 모델은 <tspan font-weight="700" fill="#5b3fd6">적대적 학습(adversarial learning)</tspan> 구조를 이루며 서로 발전한다.</text>

  <!-- Diagram -->
  <rect x="60" y="188" width="880" height="250" rx="12" fill="#fbfbfc" stroke="#e2e4e9"/>

  <rect x="90" y="290" width="70" height="46" rx="6" fill="#fff7e6" stroke="#f0c866"/>
  <text x="125" y="303" text-anchor="middle" font-size="9.5" fill="#8a6d1f">입력 노이즈</text>
  <text x="125" y="317" text-anchor="middle" font-size="9.5" fill="#8a6d1f">벡터 z</text>

  <line x1="160" y1="313" x2="200" y2="313" stroke="#2b3a52" stroke-width="1.6" marker-end="url(#a4)"/>

  <rect x="202" y="285" width="90" height="56" rx="6" fill="#d7f0e2" stroke="#1f9e5c"/>
  <text x="247" y="317" text-anchor="middle" font-size="12" font-weight="700" fill="#146538">생성기</text>

  <line x1="292" y1="313" x2="332" y2="313" stroke="#2b3a52" stroke-width="1.6" marker-end="url(#a4)"/>

  <rect x="334" y="285" width="110" height="56" rx="6" fill="#eef2fa" stroke="#9db8e0"/>
  <text x="389" y="308" text-anchor="middle" font-size="10" fill="#3a3f4a">생성된(가짜)</text>
  <text x="389" y="322" text-anchor="middle" font-size="10" fill="#3a3f4a">이미지</text>

  <line x1="444" y1="313" x2="484" y2="313" stroke="#2b3a52" stroke-width="1.6" marker-end="url(#a4)"/>

  <rect x="486" y="270" width="100" height="86" rx="6" fill="#eef2fa" stroke="#2f6fd0" stroke-width="1.5"/>
  <text x="536" y="317" text-anchor="middle" font-size="13" font-weight="700" fill="#173a70">판별기</text>

  <rect x="486" y="130" width="100" height="46" rx="6" fill="#fdeef0" stroke="#eab6bd"/>
  <text x="536" y="149" text-anchor="middle" font-size="9.5" fill="#8a231a">실제 이미지</text>
  <text x="536" y="163" text-anchor="middle" font-size="9.5" fill="#8a231a">(Real Data)</text>
  <line x1="536" y1="176" x2="536" y2="268" stroke="#2b3a52" stroke-width="1.6" marker-end="url(#a4)"/>

  <line x1="586" y1="313" x2="626" y2="313" stroke="#2b3a52" stroke-width="1.6" marker-end="url(#a4)"/>

  <rect x="628" y="290" width="110" height="46" rx="6" fill="#ffffff" stroke="#d7dae0"/>
  <text x="683" y="308" text-anchor="middle" font-size="10" font-weight="700" fill="#3a3f4a">진짜 / 가짜</text>
  <text x="683" y="323" text-anchor="middle" font-size="9.5" fill="#7a7f89">판별 결과</text>

  <!-- Feedback loops -->
  <path d="M 683 340 C 683 400 536 400 536 356" fill="none" stroke="#e2493b" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#a4)"/>
  <ellipse cx="600" cy="400" rx="55" ry="20" fill="#fdeef0" stroke="#eab6bd"/>
  <text x="600" y="405" text-anchor="middle" font-size="10" fill="#8a231a">판별기 손실</text>

  <path d="M 536 356 C 400 410 247 410 247 343" fill="none" stroke="#146538" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#a4)"/>
  <ellipse cx="380" cy="400" rx="55" ry="20" fill="#d7f0e2" stroke="#1f9e5c"/>
  <text x="380" y="405" text-anchor="middle" font-size="10" fill="#146538">생성기 손실</text>

  <text x="500" y="450" text-anchor="middle" font-size="12" fill="#9aa5b1">그림 3.4 GAN 구조 — 판별기의 손실은 판별기를, 판별기를 속인 정도는 생성기를 갱신하는 신호로 되먹임된다</text>
</svg>
