<svg width="1000" height="400" viewBox="0 0 1000 400" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, Arial, sans-serif">
  <defs>
    <marker id="a9" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#5f6470"/>
    </marker>
  </defs>
  <rect width="1000" height="400" fill="#ffffff"/>
  <text x="500" y="32" text-anchor="middle" font-size="14" font-weight="700" fill="#3a3f4a" letter-spacing="1">DISCRIMINATOR (PatchGAN)</text>

  <!-- Two stacked inputs (concat) -->
  <rect x="60" y="70" width="90" height="90" rx="4" fill="url(#rgb9)" stroke="#7a7f89" transform="translate(10,-10)"/>
  <rect x="60" y="70" width="90" height="90" rx="4" fill="#eaeef5" stroke="#9aa5b1"/>
  <defs>
    <linearGradient id="rgb9" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e2493b"/><stop offset="100%" stop-color="#4b7bec"/>
    </linearGradient>
  </defs>
  <text x="105" y="60" text-anchor="middle" font-size="9" fill="#7a7f89">REAL IMAGE</text>
  <text x="115" y="182" text-anchor="middle" font-size="9" fill="#7a7f89">TRANSLATED IMAGE</text>

  <text x="205" y="120" text-anchor="middle" font-size="10" fill="#9aa5b1">concat</text>
  <line x1="170" y1="120" x2="230" y2="120" stroke="#5f6470" stroke-width="1.3" marker-end="url(#a9)"/>

  <rect x="232" y="80" width="56" height="80" rx="4" fill="#eaf0fb" stroke="#9db8e0"/>
  <text x="260" y="70" text-anchor="middle" font-size="9.5" fill="#5f6470">16</text>
  <text x="260" y="176" text-anchor="middle" font-size="9" fill="#7a7f89">conv 1</text>

  <line x1="288" y1="120" x2="316" y2="120" stroke="#5f6470" stroke-width="1.3" marker-end="url(#a9)"/>

  <rect x="318" y="86" width="72" height="68" rx="4" fill="#e6ecf7" stroke="#9db8e0"/>
  <text x="354" y="76" text-anchor="middle" font-size="9.5" fill="#5f6470">64</text>
  <text x="354" y="170" text-anchor="middle" font-size="9" fill="#7a7f89">conv 2</text>

  <line x1="390" y1="120" x2="418" y2="120" stroke="#5f6470" stroke-width="1.3" marker-end="url(#a9)"/>

  <rect x="420" y="92" width="90" height="56" rx="4" fill="#e0e9f8" stroke="#9db8e0"/>
  <text x="465" y="82" text-anchor="middle" font-size="9.5" fill="#5f6470">128</text>
  <text x="465" y="164" text-anchor="middle" font-size="9" fill="#7a7f89">conv 3</text>

  <line x1="510" y1="120" x2="538" y2="120" stroke="#5f6470" stroke-width="1.3" marker-end="url(#a9)"/>

  <rect x="540" y="98" width="120" height="44" rx="4" fill="#dae4f6" stroke="#9db8e0"/>
  <text x="600" y="88" text-anchor="middle" font-size="9.5" fill="#5f6470">256</text>
  <text x="600" y="158" text-anchor="middle" font-size="9" fill="#7a7f89">conv 4</text>

  <line x1="660" y1="120" x2="700" y2="120" stroke="#5f6470" stroke-width="1.3" marker-end="url(#a9)"/>
  <text x="680" y="110" text-anchor="middle" font-size="8" fill="#7a7f89">flatten</text>

  <rect x="702" y="80" width="20" height="80" rx="4" fill="#ffffff" stroke="#9aa5b1"/>
  <text x="712" y="176" text-anchor="middle" font-size="9" fill="#7a7f89">512</text>

  <line x1="722" y1="120" x2="760" y2="120" stroke="#5f6470" stroke-width="1.3" marker-end="url(#a9)"/>

  <rect x="762" y="98" width="150" height="44" rx="8" fill="#fdeef0" stroke="#eab6bd"/>
  <text x="837" y="116" text-anchor="middle" font-size="9.5" font-weight="700" fill="#8a231a">Probability of Image</text>
  <text x="837" y="132" text-anchor="middle" font-size="9.5" font-weight="700" fill="#8a231a">Pair being Genuine / Fake</text>

  <text x="60" y="230" font-size="11" fill="#5f6470">conv layer 1~4: in_channels=6,16,64,128 / out_channels=16,64,128,256 / kernel_size=4, stride=2, padding=ON</text>
  <text x="60" y="252" font-size="11" fill="#5f6470">일반 판별기는 이미지 전체를 보고 하나의 숫자로 판별하지만, PatchGAN은 70×70 패치 단위로 국소적 진짜/가짜를 판별해 평균 냄</text>

  <rect x="60" y="290" width="880" height="70" rx="10" fill="#f8f6ff" stroke="#c7b8fb"/>
  <text x="80" y="316" font-size="11.5" font-weight="700" fill="#5b3fd6">왜 패치 단위인가?</text>
  <text x="80" y="338" font-size="11" fill="#4b4f58">전체 형태보다 <tspan font-weight="700">세밀한 질감(realistic texture)</tspan>을 더 예민하게 잡아내기 위함</text>

  <text x="500" y="392" text-anchor="middle" font-size="12.5" fill="#9aa5b1">그림 5.2 PatchGAN 판별기 — 실제/생성 이미지를 이어붙여 패치 단위로 진짜·가짜를 판별한다</text>
</svg>
