<svg width="1000" height="480" viewBox="0 0 1000 480" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, Arial, sans-serif">
  <defs>
    <marker id="a8" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#5f6470"/>
    </marker>
  </defs>
  <rect width="1000" height="480" fill="#ffffff"/>
  <text x="500" y="32" text-anchor="middle" font-size="14" font-weight="700" fill="#3a3f4a" letter-spacing="1">GENERATOR (U-Net)</text>

  <text x="60" y="60" font-size="11" fill="#5f6470">Encoder: 합성곱 → 정규화 → LeakyReLU 순서로 단계적 압축</text>
  <text x="60" y="78" font-size="11" fill="#5f6470">Decoder: 업샘플링 → 정규화 → ReLU 순서로 복원 (마지막 층은 Tanh)</text>
  <text x="60" y="96" font-size="11" fill="#5f6470">Skip Connection: 인코더-디코더의 같은 단계를 점선으로 이어붙여(concat) 디테일 보존</text>

  <!-- Input -->
  <g>
    <rect x="60" y="150" width="80" height="80" fill="#eaeef5" stroke="#9aa5b1" transform="skewY(0)"/>
  </g>
  <text x="100" y="140" text-anchor="middle" font-size="10" fill="#7a7f89">INPUT (Real Image)</text>

  <!-- Encoder shrinking stack -->
  <rect x="180" y="160" width="60" height="60" fill="#e3e7ef" stroke="#9aa5b1"/>
  <rect x="270" y="172" width="42" height="42" fill="#dde3ee" stroke="#9aa5b1"/>
  <rect x="342" y="182" width="24" height="26" fill="#d6dde9" stroke="#9aa5b1"/>
  <rect x="396" y="188" width="14" height="16" fill="#cfd7e4" stroke="#9aa5b1"/>

  <line x1="140" y1="190" x2="178" y2="190" stroke="#5f6470" stroke-width="1.3" marker-end="url(#a8)"/>
  <line x1="240" y1="190" x2="268" y2="190" stroke="#5f6470" stroke-width="1.3" marker-end="url(#a8)"/>
  <line x1="312" y1="193" x2="340" y2="193" stroke="#5f6470" stroke-width="1.3" marker-end="url(#a8)"/>
  <line x1="366" y1="195" x2="394" y2="195" stroke="#5f6470" stroke-width="1.3" marker-end="url(#a8)"/>

  <!-- latent bottom -->
  <rect x="440" y="192" width="10" height="12" fill="#c7ccd6" stroke="#9aa5b1"/>
  <text x="445" y="230" text-anchor="middle" font-size="9" fill="#9aa5b1">latent</text>

  <!-- Decoder growing stack -->
  <rect x="490" y="188" width="14" height="16" fill="#dfe8f5" stroke="#9db8e0"/>
  <rect x="540" y="182" width="24" height="26" fill="#e3eaf8" stroke="#9db8e0"/>
  <rect x="610" y="172" width="42" height="42" fill="#e7edfa" stroke="#9db8e0"/>
  <rect x="700" y="160" width="60" height="60" fill="#eaf0fb" stroke="#9db8e0"/>
  <rect x="800" y="150" width="80" height="80" fill="#edf2fc" stroke="#9db8e0"/>

  <line x1="450" y1="198" x2="488" y2="198" stroke="#5f6470" stroke-width="1.3" marker-end="url(#a8)"/>
  <line x1="504" y1="195" x2="538" y2="195" stroke="#5f6470" stroke-width="1.3" marker-end="url(#a8)"/>
  <line x1="564" y1="193" x2="608" y2="193" stroke="#5f6470" stroke-width="1.3" marker-end="url(#a8)"/>
  <line x1="652" y1="190" x2="698" y2="190" stroke="#5f6470" stroke-width="1.3" marker-end="url(#a8)"/>
  <line x1="760" y1="190" x2="798" y2="190" stroke="#5f6470" stroke-width="1.3" marker-end="url(#a8)"/>

  <text x="840" y="140" text-anchor="middle" font-size="10" fill="#7a7f89">OUTPUT (Translated Image)</text>

  <!-- skip connections -->
  <line x1="140" y1="230" x2="800" y2="230" stroke="#c7ccd6" stroke-width="1" stroke-dasharray="3 3"/>
  <path d="M 210 220 C 300 300 700 300 830 220" fill="none" stroke="#7c5cff" stroke-width="1.3" stroke-dasharray="4 3"/>
  <path d="M 291 214 C 340 270 660 270 731 214" fill="none" stroke="#7c5cff" stroke-width="1.3" stroke-dasharray="4 3"/>
  <path d="M 354 208 C 380 240 590 240 622 208" fill="none" stroke="#7c5cff" stroke-width="1.3" stroke-dasharray="4 3"/>
  <text x="500" y="320" text-anchor="middle" font-size="10.5" fill="#5b3fd6">Skip Connections (concat) — 압축 과정에서 잃은 선·경계·질감 디테일을 복원부에 직접 전달</text>

  <rect x="60" y="360" width="880" height="1" fill="#e2e4e9"/>
  <text x="60" y="392" font-size="11" fill="#5f6470">다운 합성곱 계층: 2차원 합성곱 계층 · 정규화 · LeakyReLU 활성화 계층 순으로 구성</text>
  <text x="60" y="412" font-size="11" fill="#5f6470">업 합성곱 계층: 2차원 전치 합성곱 계층 · 정규화 · LeakyReLU 활성화 계층 순으로 구성</text>
  <text x="60" y="432" font-size="11" fill="#5f6470">업샘플링 · 합성곱 계층: 최근접 이웃 기반 업샘플링 계층 · 합성곱 계층 · tanh 활성화 계층 순으로 구성</text>

  <text x="500" y="464" text-anchor="middle" font-size="12.5" fill="#9aa5b1">그림 5.1 Pix2Pix U-Net 생성기 — 압축(Encoder)했다가 다시 복원(Decoder)하는 U자 구조</text>
</svg>
