<svg width="900" height="420" viewBox="0 0 900 420" xmlns="http://www.w3.org/2000/svg">
  <rect width="900" height="420" fill="#ffffff"/>
  <text x="450" y="40" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="600" fill="#1a1a1a">VGG-19-BN 파인 튜닝 결과: 정확도 변화</text>

  <!-- axis -->
  <line x1="100" y1="340" x2="800" y2="340" stroke="#888780" stroke-width="1"/>
  <line x1="100" y1="80" x2="100" y2="340" stroke="#888780" stroke-width="1"/>
  <text x="70" y="90" text-anchor="end" font-family="sans-serif" font-size="11" fill="#5f5e5a">100%</text>
  <text x="70" y="215" text-anchor="end" font-family="sans-serif" font-size="11" fill="#5f5e5a">50%</text>
  <text x="70" y="345" text-anchor="end" font-family="sans-serif" font-size="11" fill="#5f5e5a">0%</text>
  <line x1="100" y1="86" x2="800" y2="86" stroke="#eee" stroke-width="1"/>
  <line x1="100" y1="213" x2="800" y2="213" stroke="#eee" stroke-width="1"/>

  <!-- bar: initial accuracy -->
  <rect x="220" y="99.5" width="140" height="240.5" fill="#B5D4F4"/>
  <text x="290" y="90" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="600" fill="#0C447C">93.67%</text>
  <text x="290" y="365" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#2C2C2A">초기 정확도</text>
  <text x="290" y="385" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#5f5e5a">사전 학습 모델 자체 성능</text>

  <!-- bar: final accuracy -->
  <rect x="440" y="87" width="140" height="253" fill="#1D9E75"/>
  <text x="510" y="77" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="600" fill="#085041">95.76%</text>
  <text x="510" y="365" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#2C2C2A">최종 정확도</text>
  <text x="510" y="385" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#5f5e5a">5 에폭 파인 튜닝 후</text>

  <!-- improvement callout -->
  <path d="M360 100 C 400 60, 420 60, 440 87" fill="none" stroke="#D85A30" stroke-width="1.5" stroke-dasharray="3 3"/>
  <text x="400" y="55" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="600" fill="#993C1D">+2.09%p 향상</text>
</svg>
