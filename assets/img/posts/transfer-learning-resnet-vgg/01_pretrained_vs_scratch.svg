<svg width="900" height="420" viewBox="0 0 900 420" xmlns="http://www.w3.org/2000/svg">
  <rect width="900" height="420" fill="#ffffff"/>
  <text x="450" y="40" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="600" fill="#1a1a1a">사전 학습 모델 vs 처음부터 학습</text>

  <!-- Left: from scratch -->
  <rect x="60" y="80" width="340" height="290" rx="14" fill="#FAECE7" stroke="#D85A30" stroke-width="1"/>
  <text x="230" y="115" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="600" fill="#712B13">처음부터 학습 (From Scratch)</text>

  <circle cx="130" cy="170" r="22" fill="#F0997B"/>
  <text x="130" y="176" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4A1B0C">?</text>
  <text x="130" y="215" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4A1B0C">아는 것 없음</text>

  <line x1="160" y1="170" x2="300" y2="170" stroke="#993C1D" stroke-width="1.5" marker-end="url(#arrow1)"/>

  <circle cx="330" cy="170" r="22" fill="#F0997B"/>
  <text x="330" y="176" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#4A1B0C">학습</text>

  <text x="230" y="255" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4A1B0C">- 수백만 장 데이터 필요</text>
  <text x="230" y="280" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4A1B0C">- 학습 시간 매우 김</text>
  <text x="230" y="305" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4A1B0C">- 초기 성능 낮음</text>
  <text x="230" y="330" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4A1B0C">- 데이터 적으면 과적합 위험</text>

  <!-- Right: pretrained -->
  <rect x="500" y="80" width="340" height="290" rx="14" fill="#E1F5EE" stroke="#1D9E75" stroke-width="1"/>
  <text x="670" y="115" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="600" fill="#085041">사전 학습 모델 활용 (Transfer)</text>

  <circle cx="570" cy="170" r="22" fill="#5DCAA5"/>
  <text x="570" y="176" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#04342C">지식</text>
  <text x="570" y="215" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#04342C">이미 아는 것 많음</text>

  <line x1="600" y1="170" x2="740" y2="170" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#arrow2)"/>

  <circle cx="770" cy="170" r="22" fill="#5DCAA5"/>
  <text x="770" y="176" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#04342C">미세조정</text>

  <text x="670" y="255" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#04342C">- 적은 데이터로도 가능</text>
  <text x="670" y="280" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#04342C">- 학습 시간 짧음</text>
  <text x="670" y="305" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#04342C">- 초기 성능부터 높음</text>
  <text x="670" y="330" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#04342C">- 적은 데이터에도 안정적</text>

  <defs>
    <marker id="arrow1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#993C1D" stroke-width="1.5"/>
    </marker>
    <marker id="arrow2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#0F6E56" stroke-width="1.5"/>
    </marker>
  </defs>
</svg>
