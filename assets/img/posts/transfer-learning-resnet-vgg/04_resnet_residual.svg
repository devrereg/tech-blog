<svg width="900" height="460" viewBox="0 0 900 460" xmlns="http://www.w3.org/2000/svg">
  <rect width="900" height="460" fill="#ffffff"/>
  <text x="450" y="40" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="600" fill="#1a1a1a">일반 신경망 vs ResNet의 잔차 연결(Residual Connection)</text>

  <!-- Top: plain network -->
  <text x="150" y="85" font-family="sans-serif" font-size="15" font-weight="600" fill="#444441">일반 신경망 (AlexNet, VGG)</text>
  <rect x="120" y="105" width="90" height="46" rx="6" fill="#D3D1C7" stroke="#888780" stroke-width="0.5"/>
  <text x="165" y="132" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#2C2C2A">층1</text>
  <line x1="210" y1="128" x2="250" y2="128" stroke="#5f5e5a" stroke-width="1.5" marker-end="url(#b1)"/>
  <rect x="250" y="105" width="90" height="46" rx="6" fill="#D3D1C7" stroke="#888780" stroke-width="0.5"/>
  <text x="295" y="132" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#2C2C2A">층2</text>
  <line x1="340" y1="128" x2="380" y2="128" stroke="#5f5e5a" stroke-width="1.5" marker-end="url(#b1)"/>
  <rect x="380" y="105" width="90" height="46" rx="6" fill="#D3D1C7" stroke="#888780" stroke-width="0.5"/>
  <text x="425" y="132" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#2C2C2A">층3</text>
  <text x="600" y="135" font-family="sans-serif" font-size="13" fill="#A32D2D">층이 깊어질수록 신호가 약해짐 → 기울기 소실 위험</text>

  <!-- arrows fading -->
  <line x1="470" y1="128" x2="550" y2="128" stroke="#F09595" stroke-width="3" opacity="0.5" marker-end="url(#b2)"/>

  <!-- Divider -->
  <line x1="60" y1="200" x2="840" y2="200" stroke="#e5e3da" stroke-width="1"/>

  <!-- Bottom: ResNet -->
  <text x="150" y="235" font-family="sans-serif" font-size="15" font-weight="600" fill="#085041">ResNet (잔차 연결)</text>
  <rect x="120" y="255" width="90" height="46" rx="6" fill="#9FE1CB" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="165" y="282" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#04342C">층1</text>
  <line x1="210" y1="278" x2="250" y2="278" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#b3)"/>
  <rect x="250" y="255" width="90" height="46" rx="6" fill="#9FE1CB" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="295" y="282" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#04342C">층2</text>
  <line x1="340" y1="278" x2="380" y2="278" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#b3)"/>
  <rect x="380" y="255" width="90" height="46" rx="6" fill="#9FE1CB" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="425" y="282" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#04342C">층3</text>

  <!-- skip connection -->
  <path d="M90 278 L90 350 L470 350 L470 301" fill="none" stroke="#0F6E56" stroke-width="1.8" marker-end="url(#b3)"/>
  <text x="280" y="375" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0F6E56">스킵 커넥션: 입력을 그대로 더해줌</text>

  <line x1="470" y1="278" x2="550" y2="278" stroke="#5DCAA5" stroke-width="3" opacity="0.9" marker-end="url(#b3)"/>
  <text x="600" y="285" font-family="sans-serif" font-size="13" fill="#085041">깊어져도 기울기가 안정적으로 전달됨</text>

  <text x="450" y="430" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#5f5e5a">→ 이 구조 덕분에 ResNet은 152층까지 깊어져도 안정적으로 학습이 가능합니다.</text>

  <defs>
    <marker id="b1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5f5e5a" stroke-width="1.5"/></marker>
    <marker id="b2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#F09595" stroke-width="1.5"/></marker>
    <marker id="b3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#0F6E56" stroke-width="1.5"/></marker>
  </defs>
</svg>
