<svg width="900" height="420" viewBox="0 0 900 420" xmlns="http://www.w3.org/2000/svg">
  <rect width="900" height="420" fill="#ffffff"/>
  <text x="450" y="40" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="600" fill="#1a1a1a">파인 튜닝 vs 전이 학습: 어디까지 다시 학습할까</text>

  <!-- Fine-tuning row -->
  <text x="70" y="100" font-family="sans-serif" font-size="15" font-weight="600" fill="#1a1a1a">파인 튜닝 (Fine-Tuning)</text>
  <text x="70" y="122" font-family="sans-serif" font-size="12" fill="#5f5e5a">모든 레이어를 재학습</text>
  <rect x="70" y="140" width="120" height="46" rx="6" fill="#D4537E"/>
  <rect x="200" y="140" width="120" height="46" rx="6" fill="#D4537E"/>
  <rect x="330" y="140" width="120" height="46" rx="6" fill="#D4537E"/>
  <rect x="460" y="140" width="120" height="46" rx="6" fill="#D4537E"/>
  <rect x="590" y="140" width="120" height="46" rx="6" fill="#D4537E"/>
  <text x="130" y="167" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#ffffff">층1</text>
  <text x="260" y="167" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#ffffff">층2</text>
  <text x="390" y="167" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#ffffff">…</text>
  <text x="520" y="167" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#ffffff">층N-1</text>
  <text x="650" y="167" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#ffffff">출력층</text>
  <text x="750" y="167" font-family="sans-serif" font-size="12" fill="#993556">← 전부 학습됨</text>

  <!-- Divider -->
  <line x1="60" y1="220" x2="840" y2="220" stroke="#e5e3da" stroke-width="1"/>

  <!-- Transfer learning row -->
  <text x="70" y="255" font-family="sans-serif" font-size="15" font-weight="600" fill="#1a1a1a">전이 학습 (Transfer Learning)</text>
  <text x="70" y="277" font-family="sans-serif" font-size="12" fill="#5f5e5a">대부분 동결(고정), 출력층만 재학습</text>
  <rect x="70" y="295" width="120" height="46" rx="6" fill="#B4B2A9"/>
  <rect x="200" y="295" width="120" height="46" rx="6" fill="#B4B2A9"/>
  <rect x="330" y="295" width="120" height="46" rx="6" fill="#B4B2A9"/>
  <rect x="460" y="295" width="120" height="46" rx="6" fill="#B4B2A9"/>
  <rect x="590" y="295" width="120" height="46" rx="6" fill="#D4537E"/>
  <text x="130" y="322" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#2C2C2A">층1 🔒</text>
  <text x="260" y="322" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#2C2C2A">층2 🔒</text>
  <text x="390" y="322" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#2C2C2A">… 🔒</text>
  <text x="520" y="322" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#2C2C2A">층N-1 🔒</text>
  <text x="650" y="322" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#ffffff">출력층</text>
  <text x="750" y="322" font-family="sans-serif" font-size="12" fill="#993556">← 여기만 학습</text>

  <text x="450" y="390" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#5f5e5a">분홍 = 학습되는 레이어, 회색(🔒) = 가중치가 고정(동결)된 레이어</text>
</svg>
