<svg viewBox="0 0 900 380" xmlns="http://www.w3.org/2000/svg" font-family="'Pretendard','Malgun Gothic',sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="900" height="380" fill="#FAFAFA"/>
  <text x="450" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#1E293B">VGG13 — 미세조정 없이 그대로 추론하기</text>

  <rect x="40" y="130" width="100" height="90" rx="8" fill="#E2E8F0" stroke="#94A3B8"/>
  <text x="90" y="180" text-anchor="middle" font-size="13" fill="#334155">개미/벌</text>
  <text x="90" y="196" text-anchor="middle" font-size="11" fill="#64748B">사진</text>

  <line x1="145" y1="175" x2="185" y2="175" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrow2)"/>

  <rect x="190" y="90" width="340" height="170" rx="10" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/>
  <text x="360" y="118" text-anchor="middle" font-size="15" font-weight="700" fill="#5B21B6">VGG13 (수정 없음)</text>
  <text x="360" y="138" text-anchor="middle" font-size="12" fill="#5B21B6">ImageNet 1000개 클래스 그대로 유지</text>
  <rect x="220" y="155" width="270" height="30" rx="6" fill="#C4B5FD"/>
  <text x="355" y="175" text-anchor="middle" font-size="11" fill="#4C1D95">features (Conv 10층)</text>
  <rect x="220" y="195" width="270" height="30" rx="6" fill="#C4B5FD"/>
  <text x="355" y="215" text-anchor="middle" font-size="11" fill="#4C1D95">classifier → 출력 1000개 (그대로!)</text>

  <line x1="535" y1="175" x2="575" y2="175" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrow2)"/>

  <rect x="580" y="90" width="280" height="170" rx="10" fill="#FEE2E2" stroke="#DC2626" stroke-width="2"/>
  <text x="720" y="118" text-anchor="middle" font-size="14" font-weight="700" fill="#991B1B">예측 결과 (1000개 중 하나)</text>
  <text x="720" y="150" text-anchor="middle" font-size="13" fill="#7F1D1D">"grasshopper" 68%</text>
  <text x="720" y="172" text-anchor="middle" font-size="13" fill="#7F1D1D">"mosquito" 15%</text>
  <text x="720" y="194" text-anchor="middle" font-size="13" fill="#7F1D1D">"dragonfly" 9%</text>
  <text x="720" y="222" text-anchor="middle" font-size="11" fill="#991B1B">※ "ant"/"bee" 자체가 정답 후보에 없을 수도!</text>

  <rect x="190" y="290" width="670" height="60" rx="8" fill="#FFF7ED" stroke="#F59E0B"/>
  <text x="525" y="315" text-anchor="middle" font-size="13" font-weight="600" fill="#9A3412">이 실습의 목적: 정확도 측정이 아니라</text>
  <text x="525" y="334" text-anchor="middle" font-size="13" font-weight="600" fill="#9A3412">"학습 안 시킨 모델이 우리 사진을 보고 뭐라고 착각하는지" 관찰하기</text>

  <defs>
    <marker id="arrow2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#94A3B8"/>
    </marker>
  </defs>
</svg>
