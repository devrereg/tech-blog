<svg width="940" height="300" viewBox="0 0 940 300" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, Arial, sans-serif">
  <rect width="940" height="300" fill="#ffffff"/>
  <text x="470" y="36" text-anchor="middle" font-size="18" font-weight="600" fill="#1a1a1a">감성분류를 위한 Bi-LSTM 모델 구조</text>

  <g>
    <rect x="15" y="82" width="158" height="120" rx="10" fill="#eef1f4" stroke="#b7bec6" stroke-width="1.2"/>
    <text x="94" y="120" text-anchor="middle" font-size="13" font-weight="600" fill="#3a3a3a">입력 문장</text>
    <text x="94" y="150" text-anchor="middle" font-size="11" fill="#5f5e5a">"I loved</text>
    <text x="94" y="166" text-anchor="middle" font-size="11" fill="#5f5e5a">the movie!"</text>
  </g>
  <g>
    <rect x="203" y="82" width="158" height="120" rx="10" fill="#e6f1fb" stroke="#378add" stroke-width="1.2"/>
    <text x="282" y="120" text-anchor="middle" font-size="13" font-weight="600" fill="#0c447c">임베딩 레이어</text>
    <text x="282" y="150" text-anchor="middle" font-size="11" fill="#5f5e5a">단어 → 128차원</text>
    <text x="282" y="166" text-anchor="middle" font-size="11" fill="#5f5e5a">밀집 벡터</text>
  </g>
  <g>
    <rect x="391" y="82" width="158" height="120" rx="10" fill="#2f6fc8" stroke="#2f6fc8" stroke-width="1.2"/>
    <text x="470" y="120" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">LSTM 레이어</text>
    <text x="470" y="150" text-anchor="middle" font-size="11" fill="#dce9f8">시퀀스 맥락 포착</text>
    <text x="470" y="166" text-anchor="middle" font-size="11" fill="#dce9f8">(입력·망각·출력 게이트)</text>
  </g>
  <g>
    <rect x="579" y="82" width="158" height="120" rx="10" fill="#e6f1fb" stroke="#378add" stroke-width="1.2"/>
    <text x="658" y="120" text-anchor="middle" font-size="13" font-weight="600" fill="#0c447c">선형 레이어</text>
    <text x="658" y="150" text-anchor="middle" font-size="11" fill="#5f5e5a">클래스 개수에</text>
    <text x="658" y="166" text-anchor="middle" font-size="11" fill="#5f5e5a">맞게 변환</text>
  </g>
  <g>
    <rect x="767" y="82" width="158" height="120" rx="10" fill="#eaf3de" stroke="#639922" stroke-width="1.2"/>
    <text x="846" y="120" text-anchor="middle" font-size="13" font-weight="600" fill="#27500a">소프트맥스</text>
    <text x="846" y="150" text-anchor="middle" font-size="11" fill="#3b6d11">긍정 / 부정</text>
    <text x="846" y="166" text-anchor="middle" font-size="11" fill="#3b6d11">확률 출력</text>
  </g>

  <g stroke="#888780" stroke-width="1.8" marker-end="url(#arrow3)">
    <line x1="176" y1="142" x2="200" y2="142"/>
    <line x1="364" y1="142" x2="388" y2="142"/>
    <line x1="552" y1="142" x2="576" y2="142"/>
    <line x1="740" y1="142" x2="764" y2="142"/>
  </g>

  <text x="846" y="238" text-anchor="middle" font-size="12" font-weight="600" fill="#27500a">긍정(1): 87%   부정(0): 13%</text>

  <defs>
    <marker id="arrow3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
</svg>
