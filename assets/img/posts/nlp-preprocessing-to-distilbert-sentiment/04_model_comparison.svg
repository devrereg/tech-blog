<svg width="940" height="340" viewBox="0 0 940 340" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, Arial, sans-serif">
  <rect width="940" height="340" fill="#ffffff"/>
  <text x="470" y="30" text-anchor="middle" font-size="18" font-weight="600" fill="#1a1a1a">Bi-LSTM vs DistilBERT vs BERT-base 성능 비교</text>
  <text x="470" y="50" text-anchor="middle" font-size="11" fill="#8a8a8a">(학습 예시 데이터 기준 · 실제 환경에 따라 달라질 수 있음)</text>

  <!-- Panel 1: parameters -->
  <text x="163" y="82" text-anchor="middle" font-size="13" font-weight="600" fill="#3a3a3a">파라미터 수</text>
  <line x1="55" y1="280" x2="270" y2="280" stroke="#c7c5bb" stroke-width="1"/>
  <rect x="70" y="274" width="46" height="6" fill="#6ea8e0"/>
  <rect x="140" y="190" width="46" height="90" fill="#2f6fc8"/>
  <rect x="210" y="130" width="46" height="150" fill="#1b2333"/>
  <text x="93" y="264" text-anchor="middle" font-size="11" font-weight="600" fill="#2c2c2a">2M</text>
  <text x="163" y="182" text-anchor="middle" font-size="11" font-weight="600" fill="#2c2c2a">66M</text>
  <text x="233" y="122" text-anchor="middle" font-size="11" font-weight="600" fill="#2c2c2a">110M</text>
  <text x="93" y="298" text-anchor="middle" font-size="10" fill="#5f5e5a">Bi-LSTM</text>
  <text x="163" y="298" text-anchor="middle" font-size="10" fill="#5f5e5a">DistilBERT</text>
  <text x="233" y="298" text-anchor="middle" font-size="10" fill="#5f5e5a">BERT-base</text>

  <!-- Panel 2: training time -->
  <text x="478" y="82" text-anchor="middle" font-size="13" font-weight="600" fill="#3a3a3a">학습 시간</text>
  <line x1="370" y1="280" x2="585" y2="280" stroke="#c7c5bb" stroke-width="1"/>
  <rect x="385" y="247" width="46" height="33" fill="#6ea8e0"/>
  <rect x="455" y="205" width="46" height="75" fill="#2f6fc8"/>
  <rect x="525" y="130" width="46" height="150" fill="#1b2333"/>
  <text x="408" y="239" text-anchor="middle" font-size="11" font-weight="600" fill="#2c2c2a">20분</text>
  <text x="478" y="197" text-anchor="middle" font-size="11" font-weight="600" fill="#2c2c2a">45분</text>
  <text x="548" y="122" text-anchor="middle" font-size="11" font-weight="600" fill="#2c2c2a">90분</text>
  <text x="408" y="298" text-anchor="middle" font-size="10" fill="#5f5e5a">Bi-LSTM</text>
  <text x="478" y="298" text-anchor="middle" font-size="10" fill="#5f5e5a">DistilBERT</text>
  <text x="548" y="298" text-anchor="middle" font-size="10" fill="#5f5e5a">BERT-base</text>

  <!-- Panel 3: accuracy -->
  <text x="793" y="82" text-anchor="middle" font-size="13" font-weight="600" fill="#3a3a3a">정확도</text>
  <line x1="685" y1="280" x2="900" y2="280" stroke="#c7c5bb" stroke-width="1"/>
  <rect x="700" y="175" width="46" height="105" fill="#6ea8e0"/>
  <rect x="770" y="130" width="46" height="150" fill="#2f6fc8"/>
  <rect x="840" y="115" width="46" height="165" fill="#1b2333"/>
  <g stroke="#ffffff" stroke-width="2" fill="none">
    <path d="M700 268 q11 -6 23 0 t23 0"/>
    <path d="M770 268 q11 -6 23 0 t23 0"/>
    <path d="M840 268 q11 -6 23 0 t23 0"/>
  </g>
  <text x="723" y="167" text-anchor="middle" font-size="11" font-weight="600" fill="#2c2c2a">87%</text>
  <text x="793" y="122" text-anchor="middle" font-size="11" font-weight="600" fill="#2c2c2a">93%</text>
  <text x="863" y="107" text-anchor="middle" font-size="11" font-weight="600" fill="#2c2c2a">95%</text>
  <text x="723" y="298" text-anchor="middle" font-size="10" fill="#5f5e5a">Bi-LSTM</text>
  <text x="793" y="298" text-anchor="middle" font-size="10" fill="#5f5e5a">DistilBERT</text>
  <text x="863" y="298" text-anchor="middle" font-size="10" fill="#5f5e5a">BERT-base</text>

  <text x="470" y="326" text-anchor="middle" font-size="10" fill="#8a8a8a">정확도는 차이를 강조하기 위해 y축 하단을 생략(≈)했다</text>
</svg>
