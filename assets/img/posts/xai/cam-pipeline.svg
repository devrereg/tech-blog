<svg width="720" height="360" viewBox="0 0 720 360" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', 'Apple SD Gothic Neo', sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="720" height="360" fill="#ffffff"/>
  <defs>
    <marker id="arrow-cam" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Step 1 -->
  <g>
    <rect x="20" y="150" width="130" height="70" rx="10" fill="#f1f5f9" stroke="#94a3b8"/>
    <text x="85" y="178" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">입력 이미지</text>
    <text x="85" y="198" text-anchor="middle" font-size="11" fill="#64748b">CNN에 투입</text>
  </g>
  <line x1="150" y1="185" x2="190" y2="185" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow-cam)"/>

  <!-- Step 2 -->
  <g>
    <rect x="190" y="140" width="150" height="90" rx="10" fill="#dbeafe" stroke="#3b82f6"/>
    <text x="265" y="168" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">특징맵 A^k</text>
    <text x="265" y="188" text-anchor="middle" font-size="11" fill="#334155">512장, 각 7×7</text>
    <text x="265" y="206" text-anchor="middle" font-size="11" fill="#334155">(마지막 합성곱층)</text>
  </g>
  <line x1="340" y1="185" x2="380" y2="185" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow-cam)"/>

  <!-- Step 3 -->
  <g>
    <rect x="380" y="140" width="150" height="90" rx="10" fill="#ede9fe" stroke="#8b5cf6"/>
    <text x="455" y="163" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">가중치 곱 &amp; 합산</text>
    <text x="455" y="183" text-anchor="middle" font-size="11" fill="#334155">GAP 학습 가중치 W_k</text>
    <text x="455" y="200" text-anchor="middle" font-size="11" fill="#334155">Σ (W_k × A^k) → 7×7</text>
  </g>
  <line x1="530" y1="185" x2="570" y2="185" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow-cam)"/>

  <!-- Step 4 -->
  <g>
    <rect x="570" y="140" width="130" height="90" rx="10" fill="#ffe4e6" stroke="#fb7185"/>
    <text x="635" y="168" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">보간 &amp; 히트맵</text>
    <text x="635" y="188" text-anchor="middle" font-size="11" fill="#334155">7×7 → 원본 크기</text>
    <text x="635" y="206" text-anchor="middle" font-size="11" fill="#334155">양선형 보간</text>
  </g>

  <line x1="20" y1="270" x2="700" y2="270" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="360" y="300" text-anchor="middle" font-size="13" fill="#475569">핵심: GAP 레이어가 반드시 있어야 학습된 가중치 W_k를 얻을 수 있음</text>
  <text x="360" y="322" text-anchor="middle" font-size="12" fill="#94a3b8">CAM (Class Activation Mapping)</text>
</svg>
