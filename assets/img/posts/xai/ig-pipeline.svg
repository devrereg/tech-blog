<svg width="760" height="560" viewBox="0 0 760 560" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', 'Apple SD Gothic Neo', sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="760" height="560" fill="#ffffff"/>
  <defs>
    <marker id="arrow-ig" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <text x="380" y="24" text-anchor="middle" font-size="13" font-weight="700" fill="#1e293b">1. Baseline ~ 원본 사이 중간 이미지 여러 장 준비 (α = 0 → 1)</text>

  <g><rect x="40" y="40" width="120" height="60" rx="8" fill="#f1f5f9" stroke="#94a3b8"/>
    <text x="100" y="64" text-anchor="middle" font-size="13" font-weight="700" fill="#1e293b">α = 0</text>
    <text x="100" y="82" text-anchor="middle" font-size="11" fill="#64748b">Baseline(검정)</text></g>

  <g><rect x="175" y="40" width="120" height="60" rx="8" fill="#f1f5f9" stroke="#94a3b8"/>
    <text x="235" y="64" text-anchor="middle" font-size="13" font-weight="700" fill="#1e293b">α = 0.25</text>
    <text x="235" y="82" text-anchor="middle" font-size="11" fill="#64748b">25%만 보임</text></g>

  <g><rect x="310" y="40" width="120" height="60" rx="8" fill="#f1f5f9" stroke="#94a3b8"/>
    <text x="370" y="64" text-anchor="middle" font-size="13" font-weight="700" fill="#1e293b">α = 0.5</text>
    <text x="370" y="82" text-anchor="middle" font-size="11" fill="#64748b">50%만 보임</text></g>

  <g><rect x="445" y="40" width="120" height="60" rx="8" fill="#f1f5f9" stroke="#94a3b8"/>
    <text x="505" y="64" text-anchor="middle" font-size="13" font-weight="700" fill="#1e293b">α = 0.75</text>
    <text x="505" y="82" text-anchor="middle" font-size="11" fill="#64748b">75%만 보임</text></g>

  <g><rect x="580" y="40" width="140" height="60" rx="8" fill="#f1f5f9" stroke="#94a3b8"/>
    <text x="650" y="64" text-anchor="middle" font-size="13" font-weight="700" fill="#1e293b">α = 1</text>
    <text x="650" y="82" text-anchor="middle" font-size="11" fill="#64748b">원본 이미지</text></g>

  <line x1="100" y1="100" x2="100" y2="136" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow-ig)"/>
  <line x1="235" y1="100" x2="235" y2="136" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow-ig)"/>
  <line x1="370" y1="100" x2="370" y2="136" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow-ig)"/>
  <line x1="505" y1="100" x2="505" y2="136" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow-ig)"/>
  <line x1="650" y1="100" x2="650" y2="136" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow-ig)"/>

  <text x="380" y="124" text-anchor="middle" font-size="13" font-weight="700" fill="#1e293b">2. 각 이미지마다 Saliency Map 계산 (순전파+역전파 1회씩)</text>

  <g><rect x="40" y="136" width="120" height="50" rx="8" fill="#dbeafe" stroke="#3b82f6"/>
    <text x="100" y="166" text-anchor="middle" font-size="11" fill="#1e293b">기울기 지도 1</text></g>
  <g><rect x="175" y="136" width="120" height="50" rx="8" fill="#dbeafe" stroke="#3b82f6"/>
    <text x="235" y="166" text-anchor="middle" font-size="11" fill="#1e293b">기울기 지도 2</text></g>
  <g><rect x="310" y="136" width="120" height="50" rx="8" fill="#dbeafe" stroke="#3b82f6"/>
    <text x="370" y="166" text-anchor="middle" font-size="11" fill="#1e293b">기울기 지도 3</text></g>
  <g><rect x="445" y="136" width="120" height="50" rx="8" fill="#dbeafe" stroke="#3b82f6"/>
    <text x="505" y="166" text-anchor="middle" font-size="11" fill="#1e293b">기울기 지도 4</text></g>
  <g><rect x="580" y="136" width="140" height="50" rx="8" fill="#dbeafe" stroke="#3b82f6"/>
    <text x="650" y="166" text-anchor="middle" font-size="11" fill="#1e293b">기울기 지도 5</text></g>

  <path d="M100 186 Q100 226 380 226" fill="none" stroke="#cbd5e1" stroke-width="1.5"/>
  <path d="M235 186 Q235 226 380 226" fill="none" stroke="#cbd5e1" stroke-width="1.5"/>
  <path d="M370 186 L370 226" fill="none" stroke="#cbd5e1" stroke-width="1.5"/>
  <path d="M505 186 Q505 226 380 226" fill="none" stroke="#cbd5e1" stroke-width="1.5"/>
  <path d="M650 186 Q650 226 380 226" fill="none" stroke="#cbd5e1" stroke-width="1.5"/>
  <line x1="380" y1="226" x2="380" y2="256" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow-ig)"/>

  <g><rect x="230" y="256" width="300" height="60" rx="10" fill="#ccfbf1" stroke="#14b8a6"/>
    <text x="380" y="280" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">3. 기울기 지도 평균</text>
    <text x="380" y="300" text-anchor="middle" font-size="11" fill="#334155">위치별로 평균 내서 지도 1장</text></g>
  <line x1="380" y1="316" x2="380" y2="350" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow-ig)"/>

  <g><rect x="180" y="350" width="400" height="60" rx="10" fill="#fef3c7" stroke="#f59e0b"/>
    <text x="380" y="374" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">4. (원본 − Baseline) 곱하기</text>
    <text x="380" y="394" text-anchor="middle" font-size="11" fill="#334155">픽셀이 실제로 얼마나 변했는지 반영</text></g>
  <line x1="380" y1="410" x2="380" y2="444" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow-ig)"/>

  <g><rect x="180" y="444" width="400" height="60" rx="10" fill="#ffe4e6" stroke="#fb7185"/>
    <text x="380" y="468" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">최종 히트맵</text>
    <text x="380" y="488" text-anchor="middle" font-size="11" fill="#334155">완전성(Completeness) 보장, 노이즈 적음</text></g>

  <text x="380" y="536" text-anchor="middle" font-size="12" fill="#94a3b8">핵심: Saliency Map을 경로 단계 수만큼 반복 후 결합</text>
</svg>
