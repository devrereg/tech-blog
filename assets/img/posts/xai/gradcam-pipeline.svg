<svg width="720" height="620" viewBox="0 0 720 620" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', 'Apple SD Gothic Neo', sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="720" height="620" fill="#ffffff"/>
  <defs>
    <marker id="arrow-gc" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <g>
    <rect x="120" y="20" width="480" height="66" rx="10" fill="#f1f5f9" stroke="#94a3b8"/>
    <text x="360" y="46" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">특징맵 A^k (512장, 각 7×7)</text>
    <text x="360" y="66" text-anchor="middle" font-size="11" fill="#64748b">이미지를 CNN에 통과시킨 결과</text>
  </g>
  <line x1="360" y1="86" x2="360" y2="120" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow-gc)"/>

  <g>
    <rect x="120" y="120" width="480" height="66" rx="10" fill="#dbeafe" stroke="#3b82f6"/>
    <text x="360" y="146" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">역전파로 기울기 계산 (∂yc/∂A^k)</text>
    <text x="360" y="166" text-anchor="middle" font-size="11" fill="#334155">각 A^k마다 7×7 기울기 지도 생성 (학습 아님, 값만 읽음)</text>
  </g>
  <line x1="360" y1="186" x2="360" y2="220" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow-gc)"/>

  <g>
    <rect x="120" y="220" width="480" height="66" rx="10" fill="#ccfbf1" stroke="#14b8a6"/>
    <text x="360" y="246" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">공간 평균 → α^k</text>
    <text x="360" y="266" text-anchor="middle" font-size="11" fill="#334155">7×7 기울기 49칸을 평균 → 레이어별 숫자 1개 (총 512개)</text>
  </g>
  <line x1="360" y1="286" x2="360" y2="320" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow-gc)"/>

  <g>
    <rect x="120" y="320" width="480" height="66" rx="10" fill="#ede9fe" stroke="#8b5cf6"/>
    <text x="360" y="346" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">α^k × A^k 가중합</text>
    <text x="360" y="366" text-anchor="middle" font-size="11" fill="#334155">512개를 위치별로 더해 7×7 결과 1장 생성</text>
  </g>
  <line x1="360" y1="386" x2="360" y2="420" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow-gc)"/>

  <g>
    <rect x="120" y="420" width="480" height="66" rx="10" fill="#fef3c7" stroke="#f59e0b"/>
    <text x="360" y="446" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">ReLU 적용</text>
    <text x="360" y="466" text-anchor="middle" font-size="11" fill="#334155">음수(방해 요소) 제거, 양수(긍정 근거)만 남김</text>
  </g>
  <line x1="360" y1="486" x2="360" y2="520" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow-gc)"/>

  <g>
    <rect x="120" y="520" width="480" height="66" rx="10" fill="#ffe4e6" stroke="#fb7185"/>
    <text x="360" y="546" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">보간법으로 원본 크기 확대</text>
    <text x="360" y="566" text-anchor="middle" font-size="11" fill="#334155">7×7 → 224×224 등, 부드러운 히트맵 완성</text>
  </g>

  <text x="360" y="608" text-anchor="middle" font-size="12" fill="#94a3b8">Grad-CAM: GAP 없이도 모든 CNN 구조에 적용 가능</text>
</svg>
