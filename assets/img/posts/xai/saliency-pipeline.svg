<svg width="720" height="440" viewBox="0 0 720 440" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', 'Apple SD Gothic Neo', sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="720" height="440" fill="#ffffff"/>
  <defs>
    <marker id="arrow-sm" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <g>
    <rect x="120" y="20" width="480" height="66" rx="10" fill="#f1f5f9" stroke="#94a3b8"/>
    <text x="360" y="46" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">원본 이미지 1장 입력</text>
    <text x="360" y="66" text-anchor="middle" font-size="11" fill="#64748b">Baseline 없음, 딱 이 사진 하나만 사용</text>
  </g>
  <line x1="360" y1="86" x2="360" y2="120" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow-sm)"/>

  <g>
    <rect x="120" y="120" width="480" height="66" rx="10" fill="#dbeafe" stroke="#3b82f6"/>
    <text x="360" y="146" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">모델 통과 (순전파)</text>
    <text x="360" y="166" text-anchor="middle" font-size="11" fill="#334155">관심 클래스 점수 yc 획득 (예: 고양이 점수)</text>
  </g>
  <line x1="360" y1="186" x2="360" y2="220" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow-sm)"/>

  <g>
    <rect x="120" y="220" width="480" height="66" rx="10" fill="#ede9fe" stroke="#8b5cf6"/>
    <text x="360" y="246" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">역전파 1회 (yc.backward())</text>
    <text x="360" y="266" text-anchor="middle" font-size="11" fill="#334155">입력층(픽셀)까지 기울기 계산</text>
  </g>
  <line x1="360" y1="286" x2="360" y2="320" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow-sm)"/>

  <g>
    <rect x="120" y="320" width="480" height="66" rx="10" fill="#ffe4e6" stroke="#fb7185"/>
    <text x="360" y="346" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">픽셀별 기울기 = 히트맵</text>
    <text x="360" y="366" text-anchor="middle" font-size="11" fill="#334155">곱하기 · 평균 · Baseline 전혀 없음</text>
  </g>

  <text x="360" y="416" text-anchor="middle" font-size="12" fill="#94a3b8">Saliency Map: 이미지 1장 → 순전파 1번 → 역전파 1번 → 끝</text>
</svg>
