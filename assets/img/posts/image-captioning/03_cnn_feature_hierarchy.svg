<svg width="680" height="300" viewBox="0 0 680 300" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', 'Apple SD Gothic Neo', sans-serif">
  <rect width="680" height="300" fill="#ffffff"/>
  <defs>
    <marker id="arrow-hier" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- input image -->
  <rect x="10" y="90" width="90" height="90" rx="10" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="55" y="130" text-anchor="middle" font-size="12" font-weight="700" fill="#1e293b">입력</text>
  <text x="55" y="148" text-anchor="middle" font-size="12" font-weight="700" fill="#1e293b">이미지</text>
  <line x1="100" y1="135" x2="130" y2="135" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow-hier)"/>

  <!-- Early layer -->
  <rect x="130" y="70" width="150" height="130" rx="10" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="205" y="98" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">얕은 층 (Early)</text>
  <line x1="150" y1="115" x2="260" y2="115" stroke="#3b82f6" stroke-width="2"/>
  <line x1="150" y1="130" x2="230" y2="145" stroke="#3b82f6" stroke-width="2"/>
  <line x1="160" y1="160" x2="260" y2="160" stroke="#3b82f6" stroke-width="2"/>
  <text x="205" y="185" text-anchor="middle" font-size="10" fill="#1d4ed8">선 · 모서리 · 색상</text>
  <line x1="280" y1="135" x2="310" y2="135" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow-hier)"/>

  <!-- Middle layer -->
  <rect x="310" y="70" width="150" height="130" rx="10" fill="#ede9fe" stroke="#8b5cf6"/>
  <text x="385" y="98" text-anchor="middle" font-size="13" font-weight="700" fill="#4c1d95">중간 층 (Middle)</text>
  <circle cx="355" cy="130" r="12" fill="none" stroke="#8b5cf6" stroke-width="2"/>
  <path d="M395 118 L415 118 L405 140 Z" fill="none" stroke="#8b5cf6" stroke-width="2"/>
  <rect x="350" y="150" width="30" height="20" fill="none" stroke="#8b5cf6" stroke-width="2"/>
  <text x="385" y="185" text-anchor="middle" font-size="10" fill="#6d28d9">질감 · 패턴 · 부분 형태</text>
  <line x1="460" y1="135" x2="490" y2="135" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow-hier)"/>

  <!-- Deep layer -->
  <rect x="490" y="70" width="180" height="130" rx="10" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="580" y="98" text-anchor="middle" font-size="13" font-weight="700" fill="#78350f">깊은 층 (Deep)</text>
  <text x="580" y="135" text-anchor="middle" font-size="24">🐕</text>
  <text x="580" y="185" text-anchor="middle" font-size="10" fill="#b45309">사물 전체 형태 · 의미</text>

  <line x1="10" y1="235" x2="670" y2="235" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="340" y="262" text-anchor="middle" font-size="12" fill="#475569">층이 깊어질수록 픽셀 → 질감 → 사물로, 점점 더 추상적인 패턴을 학습한다</text>
</svg>
