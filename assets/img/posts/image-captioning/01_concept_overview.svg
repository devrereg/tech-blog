<svg width="680" height="240" viewBox="0 0 680 240" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', 'Apple SD Gothic Neo', sans-serif">
  <rect width="680" height="240" fill="#ffffff"/>
  <defs>
    <marker id="arrow-concept" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Image box -->
  <rect x="20" y="70" width="160" height="100" rx="10" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="100" y="105" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">이미지</text>
  <rect x="40" y="118" width="120" height="36" rx="6" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="100" y="140" text-anchor="middle" font-size="10" fill="#1d4ed8">🐕 🌿 ⚽</text>
  <text x="100" y="165" text-anchor="middle" font-size="10" fill="#1d4ed8">픽셀 값의 배열</text>

  <line x1="180" y1="120" x2="235" y2="120" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow-concept)"/>

  <!-- Model box -->
  <rect x="235" y="55" width="210" height="130" rx="12" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <text x="340" y="85" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">이미지 캡셔닝 모델</text>
  <rect x="255" y="100" width="80" height="60" rx="8" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="295" y="124" text-anchor="middle" font-size="11" font-weight="700" fill="#1e3a8a">CNN</text>
  <text x="295" y="140" text-anchor="middle" font-size="9" fill="#1d4ed8">눈 (보기)</text>
  <rect x="345" y="100" width="80" height="60" rx="8" fill="#ede9fe" stroke="#8b5cf6"/>
  <text x="385" y="124" text-anchor="middle" font-size="11" font-weight="700" fill="#4c1d95">LSTM</text>
  <text x="385" y="140" text-anchor="middle" font-size="9" fill="#6d28d9">입 (말하기)</text>
  <line x1="335" y1="130" x2="345" y2="130" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow-concept)"/>

  <line x1="445" y1="120" x2="500" y2="120" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow-concept)"/>

  <!-- Sentence box -->
  <rect x="500" y="70" width="160" height="100" rx="10" fill="#dcfce7" stroke="#22c55e"/>
  <text x="580" y="105" text-anchor="middle" font-size="13" font-weight="700" fill="#14532d">문장</text>
  <text x="580" y="130" text-anchor="middle" font-size="10" fill="#15803d">"A dog is running</text>
  <text x="580" y="145" text-anchor="middle" font-size="10" fill="#15803d">with a ball on</text>
  <text x="580" y="160" text-anchor="middle" font-size="10" fill="#15803d">the grass."</text>

  <text x="340" y="215" text-anchor="middle" font-size="11" fill="#64748b">CV(보는 능력) + NLP(말하는 능력)가 결합된 멀티모달 AI</text>
</svg>
