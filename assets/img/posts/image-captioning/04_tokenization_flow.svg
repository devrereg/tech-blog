<svg width="620" height="300" viewBox="0 0 620 300" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', 'Apple SD Gothic Neo', sans-serif">
  <rect width="620" height="300" fill="#ffffff"/>
  <defs>
    <marker id="arrow-tok" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Row 1: raw sentence -->
  <rect x="160" y="15" width="300" height="46" rx="8" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="310" y="43" text-anchor="middle" font-size="13" font-family="monospace" fill="#1e293b">"A dog is running."</text>

  <line x1="310" y1="61" x2="310" y2="90" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow-tok)"/>
  <text x="330" y="80" font-size="10" fill="#64748b">토큰 분리 + 특수 토큰 부착</text>

  <!-- Row 2: tokens -->
  <rect x="90" y="90" width="440" height="46" rx="8" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="310" y="118" text-anchor="middle" font-size="12" font-family="monospace" fill="#1e3a8a">&lt;start&gt; a dog is running . &lt;end&gt;</text>

  <line x1="310" y1="136" x2="310" y2="165" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow-tok)"/>
  <text x="330" y="155" font-size="10" fill="#64748b">사전(Vocabulary)에서 인덱스 조회</text>

  <!-- Row 3: indices -->
  <rect x="130" y="165" width="360" height="46" rx="8" fill="#ede9fe" stroke="#8b5cf6"/>
  <text x="310" y="193" text-anchor="middle" font-size="13" font-family="monospace" fill="#4c1d95">[1, 15, 234, 8, 892, 7, 2]</text>

  <line x1="10" y1="240" x2="610" y2="240" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="310" y="265" text-anchor="middle" font-size="11" fill="#475569">&lt;start&gt;·&lt;end&gt;·&lt;pad&gt;·&lt;unk&gt; 특수 토큰으로 문장을 정수 시퀀스로 변환</text>
</svg>
