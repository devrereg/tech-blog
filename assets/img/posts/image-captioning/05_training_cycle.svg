<svg width="720" height="280" viewBox="0 0 720 280" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', 'Apple SD Gothic Neo', sans-serif">
  <rect width="720" height="280" fill="#ffffff"/>
  <defs>
    <marker id="arrow-cyc" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Step 1 -->
  <rect x="10" y="60" width="120" height="80" rx="10" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="70" y="90" text-anchor="middle" font-size="12" font-weight="700" fill="#1e293b">입력(t-1)</text>
  <text x="70" y="110" text-anchor="middle" font-size="9" fill="#64748b">이미지 특징 +</text>
  <text x="70" y="124" text-anchor="middle" font-size="9" fill="#64748b">정답 단어</text>
  <line x1="130" y1="100" x2="150" y2="100" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow-cyc)"/>

  <!-- Step 2 -->
  <rect x="150" y="60" width="120" height="80" rx="10" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="210" y="90" text-anchor="middle" font-size="12" font-weight="700" fill="#1e3a8a">모델 예측(t)</text>
  <text x="210" y="112" text-anchor="middle" font-size="9" fill="#1d4ed8">다음 단어 확률</text>
  <line x1="270" y1="100" x2="290" y2="100" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow-cyc)"/>

  <!-- Step 3 -->
  <rect x="290" y="60" width="120" height="80" rx="10" fill="#ede9fe" stroke="#8b5cf6"/>
  <text x="350" y="90" text-anchor="middle" font-size="12" font-weight="700" fill="#4c1d95">정답과 비교</text>
  <text x="350" y="112" text-anchor="middle" font-size="9" fill="#6d28d9">예측 vs 실제 단어</text>
  <line x1="410" y1="100" x2="430" y2="100" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow-cyc)"/>

  <!-- Step 4 -->
  <rect x="430" y="60" width="120" height="80" rx="10" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="490" y="90" text-anchor="middle" font-size="12" font-weight="700" fill="#78350f">Loss 계산</text>
  <text x="490" y="112" text-anchor="middle" font-size="9" fill="#b45309">Cross-Entropy</text>
  <line x1="550" y1="100" x2="570" y2="100" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow-cyc)"/>

  <!-- Step 5 -->
  <rect x="570" y="60" width="140" height="80" rx="10" fill="#dcfce7" stroke="#22c55e"/>
  <text x="640" y="90" text-anchor="middle" font-size="12" font-weight="700" fill="#14532d">가중치 업데이트</text>
  <text x="640" y="112" text-anchor="middle" font-size="9" fill="#15803d">Backprop</text>

  <!-- loop back dashed -->
  <path d="M640 140 C 640 210, 70 210, 70 140" fill="none" stroke="#22c55e" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#arrow-cyc)"/>
  <text x="360" y="230" text-anchor="middle" font-size="11" fill="#3b6d11">다음 배치 · 다음 에폭으로 반복</text>

  <text x="360" y="258" text-anchor="middle" font-size="11" fill="#64748b">Teacher Forcing: 항상 "실제 정답"을 다음 스텝 입력(t-1)으로 사용</text>
</svg>
