<svg width="680" height="320" viewBox="0 0 680 320" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', 'Apple SD Gothic Neo', sans-serif">
  <rect width="680" height="320" fill="#ffffff"/>
  <defs>
    <marker id="arrow-att" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <text x="340" y="26" text-anchor="middle" font-size="13" fill="#475569">단어를 생성할 때마다 이미지의 다른 영역에 집중한다</text>

  <!-- three mini grids, each 4x4 cells of 20px -->
  <!-- Grid 1: 강아지 (top-left focus) -->
  <g transform="translate(60,55)">
    <rect x="0" y="0" width="160" height="120" fill="#f8fafc" stroke="#cbd5e1"/>
    <rect x="0" y="0" width="40" height="30" fill="#fecdd3"/>
    <rect x="40" y="0" width="40" height="30" fill="#ffe4e6"/>
    <rect x="0" y="30" width="40" height="30" fill="#ffe4e6"/>
    <g stroke="#cbd5e1" stroke-width="1">
      <line x1="40" y1="0" x2="40" y2="120"/><line x1="80" y1="0" x2="80" y2="120"/><line x1="120" y1="0" x2="120" y2="120"/>
      <line x1="0" y1="30" x2="160" y2="30"/><line x1="0" y1="60" x2="160" y2="60"/><line x1="0" y1="90" x2="160" y2="90"/>
    </g>
    <rect x="0" y="0" width="160" height="120" fill="none" stroke="#94a3b8"/>
  </g>
  <line x1="140" y1="192" x2="140" y2="215" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow-att)"/>
  <rect x="90" y="215" width="100" height="34" rx="8" fill="#fecdd3" stroke="#fb7185"/>
  <text x="140" y="237" text-anchor="middle" font-size="12" font-weight="700" fill="#9f1239">"dog"</text>

  <!-- Grid 2: 공 (mid-right focus) -->
  <g transform="translate(260,55)">
    <rect x="0" y="0" width="160" height="120" fill="#f8fafc" stroke="#cbd5e1"/>
    <rect x="80" y="45" width="40" height="30" fill="#fecdd3"/>
    <rect x="120" y="45" width="40" height="30" fill="#ffe4e6"/>
    <rect x="80" y="75" width="40" height="30" fill="#ffe4e6"/>
    <g stroke="#cbd5e1" stroke-width="1">
      <line x1="40" y1="0" x2="40" y2="120"/><line x1="80" y1="0" x2="80" y2="120"/><line x1="120" y1="0" x2="120" y2="120"/>
      <line x1="0" y1="30" x2="160" y2="30"/><line x1="0" y1="60" x2="160" y2="60"/><line x1="0" y1="90" x2="160" y2="90"/>
    </g>
    <rect x="0" y="0" width="160" height="120" fill="none" stroke="#94a3b8"/>
  </g>
  <line x1="340" y1="192" x2="340" y2="215" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow-att)"/>
  <rect x="300" y="215" width="80" height="34" rx="8" fill="#fecdd3" stroke="#fb7185"/>
  <text x="340" y="237" text-anchor="middle" font-size="12" font-weight="700" fill="#9f1239">"ball"</text>

  <!-- Grid 3: 잔디 (bottom focus) -->
  <g transform="translate(460,55)">
    <rect x="0" y="0" width="160" height="120" fill="#f8fafc" stroke="#cbd5e1"/>
    <rect x="0" y="90" width="40" height="30" fill="#ffe4e6"/>
    <rect x="40" y="90" width="80" height="30" fill="#fecdd3"/>
    <rect x="120" y="90" width="40" height="30" fill="#ffe4e6"/>
    <g stroke="#cbd5e1" stroke-width="1">
      <line x1="40" y1="0" x2="40" y2="120"/><line x1="80" y1="0" x2="80" y2="120"/><line x1="120" y1="0" x2="120" y2="120"/>
      <line x1="0" y1="30" x2="160" y2="30"/><line x1="0" y1="60" x2="160" y2="60"/><line x1="0" y1="90" x2="160" y2="90"/>
    </g>
    <rect x="0" y="0" width="160" height="120" fill="none" stroke="#94a3b8"/>
  </g>
  <line x1="540" y1="192" x2="540" y2="215" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow-att)"/>
  <rect x="490" y="215" width="100" height="34" rx="8" fill="#fecdd3" stroke="#fb7185"/>
  <text x="540" y="237" text-anchor="middle" font-size="12" font-weight="700" fill="#9f1239">"bites"</text>

  <line x1="10" y1="272" x2="670" y2="272" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="340" y="298" text-anchor="middle" font-size="11" fill="#475569">진한 분홍 = 해당 단어를 생성할 때 가중치가 높은(주목하는) 이미지 영역</text>
</svg>
