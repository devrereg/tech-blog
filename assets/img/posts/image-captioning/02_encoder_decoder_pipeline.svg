<svg width="720" height="260" viewBox="0 0 720 260" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', 'Apple SD Gothic Neo', sans-serif">
  <rect width="720" height="260" fill="#ffffff"/>
  <defs>
    <marker id="arrow-pipe" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- 1. Image -->
  <rect x="10" y="90" width="110" height="70" rx="10" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="65" y="118" text-anchor="middle" font-size="13" font-weight="700" fill="#1e293b">이미지</text>
  <text x="65" y="136" text-anchor="middle" font-size="9" fill="#64748b">(B,3,224,224)</text>
  <line x1="120" y1="125" x2="150" y2="125" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow-pipe)"/>

  <!-- 2. Encoder CNN -->
  <rect x="150" y="80" width="130" height="90" rx="10" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="215" y="108" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">Encoder</text>
  <text x="215" y="126" text-anchor="middle" font-size="11" fill="#1d4ed8">CNN (ResNet)</text>
  <text x="215" y="146" text-anchor="middle" font-size="9" fill="#1d4ed8">사전학습 · 고정</text>
  <line x1="280" y1="125" x2="310" y2="125" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow-pipe)"/>

  <!-- 3. Feature vector -->
  <rect x="310" y="90" width="120" height="70" rx="10" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="370" y="115" text-anchor="middle" font-size="12" font-weight="700" fill="#78350f">특징 벡터</text>
  <text x="370" y="133" text-anchor="middle" font-size="9" fill="#b45309">(B, embed_size)</text>
  <text x="370" y="148" text-anchor="middle" font-size="9" fill="#b45309">이미지 요약본</text>
  <line x1="430" y1="125" x2="460" y2="125" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow-pipe)"/>

  <!-- 4. Decoder LSTM -->
  <rect x="460" y="80" width="130" height="90" rx="10" fill="#ede9fe" stroke="#8b5cf6"/>
  <text x="525" y="108" text-anchor="middle" font-size="13" font-weight="700" fill="#4c1d95">Decoder</text>
  <text x="525" y="126" text-anchor="middle" font-size="11" fill="#6d28d9">LSTM</text>
  <text x="525" y="146" text-anchor="middle" font-size="9" fill="#6d28d9">한 단어씩 순차 생성</text>
  <line x1="590" y1="125" x2="620" y2="125" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow-pipe)"/>

  <!-- 5. Sentence -->
  <rect x="620" y="90" width="90" height="70" rx="10" fill="#dcfce7" stroke="#22c55e"/>
  <text x="665" y="118" text-anchor="middle" font-size="13" font-weight="700" fill="#14532d">문장</text>
  <text x="665" y="136" text-anchor="middle" font-size="9" fill="#15803d">단어 시퀀스</text>

  <line x1="10" y1="200" x2="710" y2="200" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="360" y="228" text-anchor="middle" font-size="12" fill="#475569">인코더가 "무엇이 보이는지"를 압축하면, 디코더가 그것을 문장으로 풀어낸다</text>
</svg>
