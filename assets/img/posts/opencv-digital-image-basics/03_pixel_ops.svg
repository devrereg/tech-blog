<svg width="960" height="420" viewBox="0 0 960 420" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, Arial, sans-serif">
  <rect width="960" height="420" fill="#ffffff"/>
  <text x="480" y="34" text-anchor="middle" font-size="18" font-weight="600" fill="#1a1a1a">OpenCV 픽셀 연산: 0~255 범위를 벗어나지 않도록 자동 고정</text>

  <!-- LEFT: cv2.add saturation -->
  <text x="250" y="66" text-anchor="middle" font-size="13" font-weight="600" fill="#333">덧셈 cv2.add — 포화(Saturation)</text>
  <line x1="90" y1="330" x2="430" y2="330" stroke="#9aa3b2" stroke-width="1.5"/>
  <line x1="90" y1="330" x2="90" y2="90" stroke="#9aa3b2" stroke-width="1.5"/>
  <text x="86" y="104" text-anchor="end" font-size="10" fill="#8a90a0">결과값</text>
  <text x="430" y="348" text-anchor="middle" font-size="10" fill="#8a90a0">입력 픽셀값 + 100</text>
  <!-- 255 guide -->
  <line x1="90" y1="150" x2="430" y2="150" stroke="#e8551f" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="424" y="144" text-anchor="end" font-size="10" fill="#e8551f">255 (흰색)</text>
  <!-- naive sum -->
  <line x1="90" y1="330" x2="410" y2="70" stroke="#b8bec9" stroke-width="2" stroke-dasharray="5 5"/>
  <text x="360" y="86" font-size="10" fill="#8a90a0">단순 합 (255 초과 가능)</text>
  <!-- cv2.add: diagonal then clamp -->
  <path d="M90 330 L280 150 L430 150" fill="none" stroke="#3a6df0" stroke-width="3" stroke-linejoin="round"/>

  <!-- RIGHT: cv2.subtract clamping -->
  <text x="710" y="66" text-anchor="middle" font-size="13" font-weight="600" fill="#333">뺄셈 cv2.subtract — 클램핑(Clamping)</text>
  <line x1="550" y1="270" x2="900" y2="270" stroke="#9aa3b2" stroke-width="1.5"/>
  <line x1="620" y1="90" x2="620" y2="360" stroke="#9aa3b2" stroke-width="1.5"/>
  <text x="616" y="104" text-anchor="end" font-size="10" fill="#8a90a0">결과값</text>
  <text x="900" y="288" text-anchor="middle" font-size="10" fill="#8a90a0">입력 픽셀값 − 100</text>
  <!-- 0 guide -->
  <text x="628" y="266" font-size="10" fill="#2f6fd0">0 (검정)</text>
  <!-- naive diff (can go negative) -->
  <line x1="550" y1="330" x2="890" y2="110" stroke="#b8bec9" stroke-width="2" stroke-dasharray="5 5"/>
  <text x="556" y="346" font-size="10" fill="#8a90a0">단순 차 (음수 가능)</text>
  <!-- cv2.subtract: clamp at 0 then diagonal -->
  <path d="M550 270 L690 270 L890 120" fill="none" stroke="#e8551f" stroke-width="3" stroke-linejoin="round"/>
</svg>
