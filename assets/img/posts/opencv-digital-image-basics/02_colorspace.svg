<svg width="960" height="420" viewBox="0 0 960 420" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, Arial, sans-serif">
  <rect width="960" height="420" fill="#ffffff"/>
  <text x="480" y="36" text-anchor="middle" font-size="18" font-weight="600" fill="#1a1a1a">색공간(Color Space) 비교: RGB vs HSL vs HSV</text>

  <!-- RGB -->
  <circle cx="160" cy="120" r="56" fill="#e23b2e"/>
  <text x="160" y="127" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">RGB</text>
  <text x="160" y="205" text-anchor="middle" font-size="12" fill="#5f6470">Red · Green · Blue</text>
  <text x="160" y="250" text-anchor="middle" font-size="12" fill="#333">· 빛의 삼원색을 가산 혼합</text>
  <text x="160" y="278" text-anchor="middle" font-size="12" fill="#333">· 모니터·카메라 등 장치 표준</text>
  <text x="160" y="306" text-anchor="middle" font-size="12" fill="#333">· 조명 변화에 민감</text>

  <!-- HSL -->
  <circle cx="480" cy="120" r="56" fill="#2e9e46"/>
  <text x="480" y="127" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">HSL</text>
  <text x="480" y="205" text-anchor="middle" font-size="12" fill="#5f6470">Hue · Saturation · Lightness</text>
  <text x="480" y="250" text-anchor="middle" font-size="12" fill="#333">· 색상 · 채도 · 밝기로 구성</text>
  <text x="480" y="278" text-anchor="middle" font-size="12" fill="#333">· 인간의 색 인지와 유사</text>
  <text x="480" y="306" text-anchor="middle" font-size="12" fill="#333">· 직관적인 색 표현</text>

  <!-- HSV -->
  <circle cx="800" cy="120" r="56" fill="#2f6fd0"/>
  <text x="800" y="127" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">HSV</text>
  <text x="800" y="205" text-anchor="middle" font-size="12" fill="#5f6470">Hue · Saturation · Value</text>
  <text x="800" y="250" text-anchor="middle" font-size="12" fill="#333">· 색상 · 채도 · 명도로 구성</text>
  <text x="800" y="278" text-anchor="middle" font-size="12" fill="#333">· 색 정보와 밝기가 분리됨</text>
  <text x="800" y="306" text-anchor="middle" font-size="12" fill="#333">· 조명 변화에 강해 CV에 유리</text>

  <line x1="80" y1="345" x2="880" y2="345" stroke="#e2e5eb" stroke-width="1"/>
  <text x="480" y="374" text-anchor="middle" font-size="12" fill="#5f6470">같은 픽셀 행렬을 "어떻게 해석할 것인가"에 따라 색공간이 달라진다</text>
</svg>
