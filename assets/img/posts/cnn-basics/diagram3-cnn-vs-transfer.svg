<svg viewBox="0 0 900 420" xmlns="http://www.w3.org/2000/svg" font-family="'Pretendard','Malgun Gothic',sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="900" height="420" fill="#FAFAFA"/>
  <text x="450" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#1E293B">밑바닥 CNN vs 전이학습(ResNet-18) — 정확도 비교</text>

  <!-- axis -->
  <line x1="80" y1="350" x2="850" y2="350" stroke="#334155" stroke-width="2"/>
  <line x1="80" y1="350" x2="80" y2="80" stroke="#334155" stroke-width="2"/>
  <text x="45" y="90" font-size="11" fill="#64748B">1.0</text>
  <text x="45" y="220" font-size="11" fill="#64748B">0.5</text>
  <text x="45" y="350" font-size="11" fill="#64748B">0.0</text>
  <line x1="80" y1="220" x2="850" y2="220" stroke="#E2E8F0" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- bars -->
  <g>
    <rect x="110" y="255" width="70" height="95" fill="#94A3B8" rx="4"/>
    <text x="145" y="245" text-anchor="middle" font-size="12" font-weight="700" fill="#334155">0.35</text>
    <text x="145" y="368" text-anchor="middle" font-size="11" fill="#475569">① 기본 CNN</text>
    <text x="145" y="382" text-anchor="middle" font-size="11" fill="#475569">(conv 2층)</text>
  </g>
  <g>
    <rect x="200" y="235" width="70" height="115" fill="#94A3B8" rx="4"/>
    <text x="235" y="225" text-anchor="middle" font-size="12" font-weight="700" fill="#334155">0.42</text>
    <text x="235" y="368" text-anchor="middle" font-size="11" fill="#475569">② conv 3층</text>
  </g>
  <g>
    <rect x="290" y="210" width="70" height="140" fill="#94A3B8" rx="4"/>
    <text x="325" y="200" text-anchor="middle" font-size="12" font-weight="700" fill="#334155">0.50</text>
    <text x="325" y="368" text-anchor="middle" font-size="11" fill="#475569">③④⑤</text>
    <text x="325" y="382" text-anchor="middle" font-size="11" fill="#475569">FNN/BN/Dropout</text>
  </g>
  <g>
    <rect x="380" y="190" width="70" height="160" fill="#94A3B8" rx="4"/>
    <text x="415" y="180" text-anchor="middle" font-size="12" font-weight="700" fill="#334155">0.57</text>
    <text x="415" y="368" text-anchor="middle" font-size="11" fill="#475569">⑥ 내 CNN</text>
    <text x="415" y="382" text-anchor="middle" font-size="11" fill="#475569">(최선을 다한 결과)</text>
  </g>

  <!-- transfer learning bars in teal -->
  <g>
    <rect x="500" y="130" width="70" height="220" fill="#0D9488" rx="4"/>
    <text x="535" y="120" text-anchor="middle" font-size="12" font-weight="700" fill="#0D9488">0.78</text>
    <text x="535" y="368" text-anchor="middle" font-size="11" fill="#0F766E">⑦ 전이:특징추출</text>
  </g>
  <g>
    <rect x="590" y="100" width="70" height="250" fill="#0D9488" rx="4"/>
    <text x="625" y="90" text-anchor="middle" font-size="12" font-weight="700" fill="#0D9488">0.85</text>
    <text x="625" y="368" text-anchor="middle" font-size="11" fill="#0F766E">⑧ 전이:미세조정</text>
  </g>
  <g>
    <rect x="680" y="95" width="70" height="255" fill="#0D9488" rx="4"/>
    <text x="715" y="85" text-anchor="middle" font-size="12" font-weight="700" fill="#0D9488">0.86</text>
    <text x="715" y="368" text-anchor="middle" font-size="11" fill="#0F766E">⑨ +증강</text>
  </g>

  <text x="500" y="405" text-anchor="middle" font-size="12" fill="#94A3B8">※ 위 수치는 개념 설명용 예시값이며, 실제 실행 결과는 데이터·환경에 따라 달라질 수 있습니다.</text>

  <rect x="30" y="55" width="14" height="14" fill="#94A3B8"/>
  <text x="50" y="66" font-size="11" fill="#475569">밑바닥 CNN (직접 쌓은 구조)</text>
  <rect x="230" y="55" width="14" height="14" fill="#0D9488"/>
  <text x="250" y="66" font-size="11" fill="#0F766E">전이학습 (ResNet-18, ImageNet 사전학습)</text>
</svg>
