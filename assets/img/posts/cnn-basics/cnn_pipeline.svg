<svg width="680" height="230" viewBox="0 0 680 230" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, Arial, sans-serif">
  <rect x="0" y="0" width="680" height="230" fill="#ffffff"/>

  <!-- Stage boxes -->
  <g>
    <rect x="20" y="70" width="120" height="60" rx="8" fill="#f1efe8" stroke="#b4b2a9" stroke-width="1"/>
    <text x="80" y="95" text-anchor="middle" font-size="13" font-weight="600" fill="#2c2c2a">입력 이미지</text>
    <text x="80" y="112" text-anchor="middle" font-size="11" fill="#5f5e5a">3, 32, 32</text>
  </g>

  <line x1="140" y1="100" x2="168" y2="100" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

  <g>
    <rect x="170" y="70" width="120" height="60" rx="8" fill="#e6f1fb" stroke="#378add" stroke-width="1"/>
    <text x="230" y="90" text-anchor="middle" font-size="13" font-weight="600" fill="#0c447c">합성곱</text>
    <text x="230" y="106" text-anchor="middle" font-size="11" fill="#185fa5">Convolution</text>
    <text x="230" y="120" text-anchor="middle" font-size="10" fill="#185fa5">특징 추출</text>
  </g>

  <line x1="290" y1="100" x2="318" y2="100" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

  <g>
    <rect x="320" y="70" width="120" height="60" rx="8" fill="#eaf3de" stroke="#639922" stroke-width="1"/>
    <text x="380" y="90" text-anchor="middle" font-size="13" font-weight="600" fill="#27500a">풀링</text>
    <text x="380" y="106" text-anchor="middle" font-size="11" fill="#3b6d11">Pooling</text>
    <text x="380" y="120" text-anchor="middle" font-size="10" fill="#3b6d11">정보 압축</text>
  </g>

  <line x1="440" y1="100" x2="468" y2="100" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

  <g>
    <rect x="470" y="70" width="90" height="60" rx="8" fill="#faeeda" stroke="#ba7517" stroke-width="1"/>
    <text x="515" y="95" text-anchor="middle" font-size="13" font-weight="600" fill="#633806">Flatten</text>
    <text x="515" y="112" text-anchor="middle" font-size="10" fill="#854f0b">1차원 변환</text>
  </g>

  <line x1="560" y1="100" x2="588" y2="100" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

  <g>
    <rect x="590" y="60" width="70" height="80" rx="8" fill="#eeedfe" stroke="#7f77dd" stroke-width="1"/>
    <text x="625" y="90" text-anchor="middle" font-size="13" font-weight="600" fill="#26215c">분류</text>
    <text x="625" y="106" text-anchor="middle" font-size="10" fill="#3c3489">Classifier</text>
    <text x="625" y="122" text-anchor="middle" font-size="10" fill="#3c3489">Linear</text>
  </g>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Feature extraction bracket -->
  <path d="M170 150 L440 150" stroke="#888780" stroke-width="1" fill="none"/>
  <path d="M170 150 L170 145" stroke="#888780" stroke-width="1"/>
  <path d="M440 150 L440 145" stroke="#888780" stroke-width="1"/>
  <text x="305" y="170" text-anchor="middle" font-size="12" fill="#5f5e5a">특징 추출부 (Features)</text>

  <path d="M470 190 L660 190" stroke="#888780" stroke-width="1" fill="none"/>
  <path d="M470 190 L470 185" stroke="#888780" stroke-width="1"/>
  <path d="M660 190 L660 185" stroke="#888780" stroke-width="1"/>
  <text x="565" y="210" text-anchor="middle" font-size="12" fill="#5f5e5a">분류부 (Classifier)</text>
</svg>
