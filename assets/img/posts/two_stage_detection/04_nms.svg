<svg width="720" height="380" viewBox="0 0 720 380" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', 'Apple SD Gothic Neo', sans-serif">
  <rect width="720" height="380" fill="#ffffff"/>

  <!-- Before panel -->
  <rect x="30" y="30" width="300" height="280" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="180" y="56" text-anchor="middle" font-size="13" font-weight="700" fill="#1e293b">Before — 중복 박스 다수</text>

  <rect x="90" y="100" width="150" height="150" fill="none" stroke="#fb7185" stroke-width="2"/>
  <text x="245" y="108" font-size="10.5" fill="#e11d48">0.61</text>

  <rect x="75" y="90" width="150" height="150" fill="none" stroke="#f59e0b" stroke-width="2"/>
  <text x="230" y="98" font-size="10.5" fill="#b45309">0.74</text>

  <rect x="100" y="110" width="150" height="150" fill="none" stroke="#a855f7" stroke-width="2"/>
  <text x="255" y="118" font-size="10.5" fill="#7e22ce">0.58</text>

  <rect x="85" y="85" width="150" height="150" fill="none" stroke="#3b82f6" stroke-width="3"/>
  <text x="90" y="80" font-size="11" font-weight="700" fill="#1e3a8a">0.93 ★ 최고</text>
  <text x="160" y="165" text-anchor="middle" font-size="22">🐶</text>

  <text x="180" y="284" text-anchor="middle" font-size="11" fill="#64748b">같은 객체 주변에 IoU 높은 박스가 여러 개</text>

  <!-- Arrow -->
  <line x1="345" y1="170" x2="385" y2="170" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrn)"/>
  <text x="365" y="150" text-anchor="middle" font-size="10.5" fill="#64748b">NMS</text>
  <defs>
    <marker id="arrn" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#94a3b8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- After panel -->
  <rect x="400" y="30" width="290" height="280" rx="10" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="545" y="56" text-anchor="middle" font-size="13" font-weight="700" fill="#166534">After — 박스 1개만 생존</text>

  <rect x="465" y="85" width="150" height="150" fill="none" stroke="#22c55e" stroke-width="3"/>
  <text x="470" y="80" font-size="11" font-weight="700" fill="#166534">0.93 ★ 최고</text>
  <text x="540" y="165" text-anchor="middle" font-size="22">🐶</text>

  <text x="545" y="284" text-anchor="middle" font-size="11" fill="#166534">confidence 최고 박스만 남고 IoU≥0.4 나머지는 제거</text>

  <text x="360" y="345" text-anchor="middle" font-size="12" fill="#475569">겹치지 않는(=다른 객체일) 박스는 그룹이 달라 독립적으로 살아남는다</text>
</svg>
