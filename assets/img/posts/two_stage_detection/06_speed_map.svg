<svg width="720" height="420" viewBox="0 0 720 420" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', 'Apple SD Gothic Neo', sans-serif">
  <rect width="720" height="420" fill="#ffffff"/>

  <!-- ===== Left: processing time (log scale) ===== -->
  <text x="180" y="26" text-anchor="middle" font-size="13" font-weight="700" fill="#1e293b">처리 시간 / 이미지 (로그 스케일, 초)</text>

  <g stroke="#e2e8f0" stroke-width="1">
    <line x1="70" y1="300" x2="300" y2="300"/>
    <line x1="70" y1="220" x2="300" y2="220"/>
    <line x1="70" y1="140" x2="300" y2="140"/>
    <line x1="70" y1="60" x2="300" y2="60"/>
  </g>
  <text x="60" y="304" text-anchor="end" font-size="10" fill="#94a3b8">0.1s</text>
  <text x="60" y="224" text-anchor="end" font-size="10" fill="#94a3b8">1s</text>
  <text x="60" y="144" text-anchor="end" font-size="10" fill="#94a3b8">10s</text>
  <text x="60" y="64" text-anchor="end" font-size="10" fill="#94a3b8">100s</text>
  <line x1="70" y1="60" x2="70" y2="300" stroke="#334155" stroke-width="1.5"/>
  <line x1="70" y1="300" x2="300" y2="300" stroke="#334155" stroke-width="1.5"/>

  <!-- R-CNN 47s -->
  <rect x="95" y="86" width="46" height="214" rx="4" fill="#fb7185"/>
  <text x="118" y="78" text-anchor="middle" font-size="11" font-weight="700" fill="#e11d48">47초</text>

  <!-- Fast R-CNN 2.3s -->
  <rect x="167" y="191" width="46" height="109" rx="4" fill="#3b82f6"/>
  <text x="190" y="183" text-anchor="middle" font-size="11" font-weight="700" fill="#1d4ed8">2.3초</text>

  <!-- Faster R-CNN 0.2s -->
  <rect x="239" y="276" width="46" height="24" rx="4" fill="#22c55e"/>
  <text x="262" y="268" text-anchor="middle" font-size="11" font-weight="700" fill="#15803d">0.2초</text>

  <text x="118" y="316" text-anchor="middle" font-size="9.5" fill="#475569">R-CNN</text>
  <text x="190" y="316" text-anchor="middle" font-size="9.5" fill="#475569">Fast R-CNN</text>
  <text x="262" y="316" text-anchor="middle" font-size="9.5" fill="#475569">Faster R-CNN</text>

  <!-- ===== Right: mAP (linear) ===== -->
  <text x="530" y="26" text-anchor="middle" font-size="13" font-weight="700" fill="#1e293b">mAP (%, PASCAL VOC)</text>

  <g stroke="#e2e8f0" stroke-width="1">
    <line x1="420" y1="300" x2="650" y2="300"/>
    <line x1="420" y1="240" x2="650" y2="240"/>
    <line x1="420" y1="180" x2="650" y2="180"/>
    <line x1="420" y1="120" x2="650" y2="120"/>
    <line x1="420" y1="60" x2="650" y2="60"/>
  </g>
  <text x="410" y="304" text-anchor="end" font-size="10" fill="#94a3b8">0</text>
  <text x="410" y="184" text-anchor="end" font-size="10" fill="#94a3b8">50</text>
  <text x="410" y="64" text-anchor="end" font-size="10" fill="#94a3b8">100</text>
  <line x1="420" y1="60" x2="420" y2="300" stroke="#334155" stroke-width="1.5"/>
  <line x1="420" y1="300" x2="650" y2="300" stroke="#334155" stroke-width="1.5"/>

  <rect x="445" y="142" width="46" height="158" rx="4" fill="#fb7185"/>
  <text x="468" y="134" text-anchor="middle" font-size="11" font-weight="700" fill="#e11d48">66.0%</text>

  <rect x="517" y="139" width="46" height="161" rx="4" fill="#3b82f6"/>
  <text x="540" y="131" text-anchor="middle" font-size="11" font-weight="700" fill="#1d4ed8">66.9%</text>

  <rect x="589" y="139" width="46" height="161" rx="4" fill="#22c55e"/>
  <text x="612" y="131" text-anchor="middle" font-size="11" font-weight="700" fill="#15803d">66.9%</text>

  <text x="468" y="316" text-anchor="middle" font-size="9.5" fill="#475569">R-CNN</text>
  <text x="540" y="316" text-anchor="middle" font-size="9.5" fill="#475569">Fast R-CNN</text>
  <text x="612" y="316" text-anchor="middle" font-size="9.5" fill="#475569">Faster R-CNN</text>

  <text x="360" y="360" text-anchor="middle" font-size="12" fill="#475569">속도는 로그 스케일로 약 235배 개선되는 동안, 정확도(mAP)는 거의 그대로 유지된다</text>
  <text x="360" y="382" text-anchor="middle" font-size="11" fill="#94a3b8">R-CNN 계열 속도 · 정확도 비교</text>
</svg>
