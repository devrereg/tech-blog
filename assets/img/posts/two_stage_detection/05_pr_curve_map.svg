<svg width="680" height="420" viewBox="0 0 680 420" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', 'Apple SD Gothic Neo', sans-serif">
  <rect width="680" height="420" fill="#ffffff"/>

  <text x="340" y="26" text-anchor="middle" font-size="13" font-weight="700" fill="#1e293b">Precision-Recall Curve → AP → mAP</text>

  <!-- gridlines (25% steps) -->
  <g stroke="#e2e8f0" stroke-width="1">
    <line x1="80" y1="265" x2="560" y2="265"/>
    <line x1="80" y1="190" x2="560" y2="190"/>
    <line x1="80" y1="115" x2="560" y2="115"/>
    <line x1="200" y1="40" x2="200" y2="340"/>
    <line x1="320" y1="40" x2="320" y2="340"/>
    <line x1="440" y1="40" x2="440" y2="340"/>
  </g>

  <!-- axes -->
  <line x1="80" y1="40" x2="80" y2="340" stroke="#334155" stroke-width="1.5"/>
  <line x1="80" y1="340" x2="560" y2="340" stroke="#334155" stroke-width="1.5"/>

  <!-- axis ticks -->
  <text x="80" y="355" text-anchor="middle" font-size="10.5" fill="#64748b">0.0</text>
  <text x="200" y="355" text-anchor="middle" font-size="10.5" fill="#64748b">0.25</text>
  <text x="320" y="355" text-anchor="middle" font-size="10.5" fill="#64748b">0.5</text>
  <text x="440" y="355" text-anchor="middle" font-size="10.5" fill="#64748b">0.75</text>
  <text x="560" y="355" text-anchor="middle" font-size="10.5" fill="#64748b">1.0</text>
  <text x="340" y="380" text-anchor="middle" font-size="12" fill="#334155">Recall</text>

  <text x="68" y="344" text-anchor="end" font-size="10.5" fill="#64748b">0.0</text>
  <text x="68" y="269" text-anchor="end" font-size="10.5" fill="#64748b">0.25</text>
  <text x="68" y="194" text-anchor="end" font-size="10.5" fill="#64748b">0.5</text>
  <text x="68" y="119" text-anchor="end" font-size="10.5" fill="#64748b">0.75</text>
  <text x="68" y="46" text-anchor="end" font-size="10.5" fill="#64748b">1.0</text>
  <text x="30" y="190" text-anchor="middle" font-size="12" fill="#334155" transform="rotate(-90 30 190)">Precision</text>

  <!-- shaded area under curve (AP) -->
  <polygon points="80,40 128,46 176,55 224,70 272,85 320,106 368,136 416,175 464,214 512,256 560,295 560,340 80,340"
           fill="#3b82f6" fill-opacity="0.15"/>

  <!-- PR curve line -->
  <polyline points="80,40 128,46 176,55 224,70 272,85 320,106 368,136 416,175 464,214 512,256 560,295"
            fill="none" stroke="#3b82f6" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>

  <circle cx="80" cy="40" r="3.5" fill="#3b82f6"/>
  <circle cx="560" cy="295" r="3.5" fill="#3b82f6"/>

  <text x="330" y="118" font-size="11" fill="#1d4ed8" font-weight="700">AP = 곡선 아래 면적</text>

  <rect x="410" y="45" width="150" height="46" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="485" y="63" text-anchor="middle" font-size="10.5" fill="#1e3a8a" font-weight="700">1개 클래스 = AP</text>
  <text x="485" y="79" text-anchor="middle" font-size="10" fill="#3b5bab">모든 클래스 AP 평균 = mAP</text>

  <text x="340" y="405" text-anchor="middle" font-size="11.5" fill="#64748b">threshold를 낮출수록 오른쪽 아래로 이동 (Recall↑, Precision↓)</text>
</svg>
