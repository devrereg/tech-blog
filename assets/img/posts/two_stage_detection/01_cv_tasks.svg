<svg width="760" height="330" viewBox="0 0 760 330" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', 'Apple SD Gothic Neo', sans-serif">
  <rect width="760" height="330" fill="#ffffff"/>

  <!-- shared card template positions -->
  <!-- Card 1: Classification -->
  <g>
    <rect x="20" y="20" width="170" height="230" rx="12" fill="#f1f5f9" stroke="#94a3b8"/>
    <rect x="40" y="40" width="130" height="110" rx="6" fill="#e2e8f0" stroke="#cbd5e1"/>
    <circle cx="105" cy="95" r="30" fill="#cbd5e1"/>
    <text x="105" y="101" text-anchor="middle" font-size="20">🐶</text>
    <text x="105" y="172" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">Classification</text>
    <text x="105" y="192" text-anchor="middle" font-size="11" fill="#64748b">뭐가 있는가?</text>
    <rect x="55" y="206" width="100" height="22" rx="11" fill="#e2e8f0"/>
    <text x="105" y="221" text-anchor="middle" font-size="10.5" fill="#334155">Dog</text>
    <text x="105" y="242" text-anchor="middle" font-size="10" fill="#94a3b8">출력: 라벨 1개</text>
  </g>

  <!-- Card 2: Localization -->
  <g>
    <rect x="205" y="20" width="170" height="230" rx="12" fill="#f1f5f9" stroke="#3b82f6"/>
    <rect x="225" y="40" width="130" height="110" rx="6" fill="#e2e8f0" stroke="#cbd5e1"/>
    <rect x="248" y="58" width="80" height="78" rx="4" fill="none" stroke="#3b82f6" stroke-width="2.5"/>
    <text x="288" y="103" text-anchor="middle" font-size="20">🐶</text>
    <text x="290" y="172" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">Localization</text>
    <text x="290" y="192" text-anchor="middle" font-size="11" fill="#64748b">어디 있는가? (객체 1개)</text>
    <rect x="230" y="206" width="130" height="22" rx="11" fill="#dbeafe"/>
    <text x="295" y="221" text-anchor="middle" font-size="10.5" fill="#1e3a8a">Dog + box(x,y,w,h)</text>
    <text x="290" y="242" text-anchor="middle" font-size="10" fill="#94a3b8">출력: 라벨 + box 1개</text>
  </g>

  <!-- Card 3: Object Detection -->
  <g>
    <rect x="390" y="20" width="170" height="230" rx="12" fill="#f1f5f9" stroke="#8b5cf6"/>
    <rect x="410" y="40" width="130" height="110" rx="6" fill="#e2e8f0" stroke="#cbd5e1"/>
    <rect x="418" y="55" width="55" height="55" rx="4" fill="none" stroke="#8b5cf6" stroke-width="2.5"/>
    <text x="445" y="88" text-anchor="middle" font-size="16">🐶</text>
    <rect x="478" y="80" width="52" height="62" rx="4" fill="none" stroke="#8b5cf6" stroke-width="2.5"/>
    <text x="504" y="118" text-anchor="middle" font-size="16">🐱</text>
    <text x="475" y="172" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">Object Detection</text>
    <text x="475" y="192" text-anchor="middle" font-size="11" fill="#64748b">여러 개가 각각 어디에?</text>
    <rect x="415" y="206" width="120" height="22" rx="11" fill="#ede9fe"/>
    <text x="475" y="221" text-anchor="middle" font-size="10.5" fill="#4c1d95">여러 개의 (라벨+box)</text>
    <text x="475" y="242" text-anchor="middle" font-size="10" fill="#94a3b8">Classification + Localization ×N</text>
  </g>

  <!-- Card 4: Instance Segmentation -->
  <g>
    <rect x="575" y="20" width="165" height="230" rx="12" fill="#f1f5f9" stroke="#fb7185"/>
    <rect x="595" y="40" width="130" height="110" rx="6" fill="#e2e8f0" stroke="#cbd5e1"/>
    <path d="M625 60 C610 75 610 110 630 125 C650 138 685 130 690 105 C694 82 670 58 645 58 Z" fill="#fecdd3" stroke="#fb7185" stroke-width="2"/>
    <text x="655" y="103" text-anchor="middle" font-size="18">🐶</text>
    <text x="660" y="172" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">Instance Seg.</text>
    <text x="660" y="192" text-anchor="middle" font-size="11" fill="#64748b">픽셀 단위로 정확히 어디?</text>
    <rect x="600" y="206" width="120" height="22" rx="11" fill="#ffe4e6"/>
    <text x="660" y="221" text-anchor="middle" font-size="10.5" fill="#881337">픽셀 단위 마스크</text>
    <text x="660" y="242" text-anchor="middle" font-size="10" fill="#94a3b8">출력: 마스크</text>
  </g>

  <text x="380" y="295" text-anchor="middle" font-size="12" fill="#475569">난이도가 오른쪽으로 갈수록 높아진다 — Object Detection은 "N개 객체에 대한 분류 + 위치 예측"의 동시 수행</text>
  <text x="380" y="315" text-anchor="middle" font-size="11" fill="#94a3b8">컴퓨터 비전 4대 Task</text>
</svg>
