<svg width="900" height="420" viewBox="0 0 900 420" xmlns="http://www.w3.org/2000/svg">
  <rect width="900" height="420" fill="#ffffff"/>
  <text x="450" y="38" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="600" fill="#1a1a1a">데이터셋 크기 × 증강 강도별 검증 정확도</text>

  <!-- column headers -->
  <text x="395" y="76" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="600" fill="#2C2C2A">Weak</text>
  <text x="593" y="76" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="600" fill="#2C2C2A">Medium</text>
  <text x="791" y="76" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="600" fill="#2C2C2A">Strong</text>

  <!-- row labels -->
  <text x="270" y="140" text-anchor="end" font-family="sans-serif" font-size="13" fill="#2C2C2A">500 samples</text>
  <text x="270" y="238" text-anchor="end" font-family="sans-serif" font-size="13" fill="#2C2C2A">2,000 samples</text>
  <text x="270" y="336" text-anchor="end" font-family="sans-serif" font-size="13" fill="#2C2C2A">10,000 samples</text>

  <!-- Row 1: 500 samples -->
  <rect x="300" y="90" width="190" height="90" fill="#EAF3FC"/>
  <text x="395" y="140" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#0C447C">78.3%</text>
  <rect x="498" y="90" width="190" height="90" fill="#D3E7F9" stroke="#1D9E75" stroke-width="3"/>
  <text x="593" y="140" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#0C447C">82.1%</text>
  <rect x="696" y="90" width="190" height="90" fill="#E4F0FB"/>
  <text x="791" y="140" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#0C447C">79.8%</text>

  <!-- Row 2: 2,000 samples -->
  <rect x="300" y="188" width="190" height="90" fill="#B5D4F4"/>
  <text x="395" y="238" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#042C53">85.7%</text>
  <rect x="498" y="188" width="190" height="90" fill="#8FBEE9"/>
  <text x="593" y="238" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#042C53">88.9%</text>
  <rect x="696" y="188" width="190" height="90" fill="#86BAE7" stroke="#1D9E75" stroke-width="3"/>
  <text x="791" y="238" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#042C53">89.5%</text>

  <!-- Row 3: 10,000 samples -->
  <rect x="300" y="286" width="190" height="90" fill="#5C9FDA"/>
  <text x="395" y="336" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#ffffff">91.2%</text>
  <rect x="498" y="286" width="190" height="90" fill="#3F8AD0"/>
  <text x="593" y="336" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#ffffff">92.8%</text>
  <rect x="696" y="286" width="190" height="90" fill="#1F5FA8" stroke="#1D9E75" stroke-width="3"/>
  <text x="791" y="336" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#ffffff">94.3%</text>

  <!-- legend -->
  <rect x="300" y="392" width="18" height="18" fill="none" stroke="#1D9E75" stroke-width="3"/>
  <text x="326" y="406" font-family="sans-serif" font-size="12" fill="#2C2C2A">행별 최고 성능 (같은 데이터 크기 내 최적 증강 강도)</text>
</svg>
