<svg width="900" height="440" viewBox="0 0 900 440" xmlns="http://www.w3.org/2000/svg">
  <rect width="900" height="440" fill="#ffffff"/>
  <text x="450" y="38" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="600" fill="#1a1a1a">단일 학습률 vs 차등 학습률 비교</text>

  <!-- axes -->
  <line x1="120" y1="370" x2="850" y2="370" stroke="#888780" stroke-width="1"/>
  <line x1="120" y1="90" x2="120" y2="370" stroke="#888780" stroke-width="1"/>
  <text x="105" y="374" text-anchor="end" font-family="sans-serif" font-size="11" fill="#5f5e5a">70%</text>
  <text x="105" y="262" text-anchor="end" font-family="sans-serif" font-size="11" fill="#5f5e5a">82.5%</text>
  <text x="105" y="94" text-anchor="end" font-family="sans-serif" font-size="11" fill="#5f5e5a">95%</text>
  <line x1="120" y1="258" x2="850" y2="258" stroke="#eee" stroke-width="1"/>
  <text x="180" y="392" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5f5e5a">Epoch 10</text>
  <text x="500" y="392" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5f5e5a">Epoch 20</text>
  <text x="820" y="392" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5f5e5a">Epoch 30</text>

  <!-- convergence markers -->
  <line x1="436" y1="90" x2="436" y2="370" stroke="#378ADD" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="436" y="80" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#0C447C">Differential 수렴 (Epoch 18)</text>
  <line x1="660" y1="90" x2="660" y2="370" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="660" y="70" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#8A8878">Uniform 수렴 (Epoch 25)</text>

  <!-- Uniform line: gray -->
  <polyline points="180,311.76 500,223.28 820,187.44" fill="none" stroke="#B4B2A9" stroke-width="2.5"/>
  <circle cx="180" cy="311.76" r="5" fill="#B4B2A9"/>
  <circle cx="500" cy="223.28" r="5" fill="#B4B2A9"/>
  <circle cx="820" cy="187.44" r="5" fill="#B4B2A9"/>
  <text x="180" y="330" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#8A8878">75.2%</text>
  <text x="500" y="242" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#8A8878">83.1%</text>
  <text x="820" y="206" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="600" fill="#6b6a63">86.3%</text>

  <!-- Differential line: blue -->
  <polyline points="180,241.2 500,160.56 820,132.56" fill="none" stroke="#378ADD" stroke-width="3"/>
  <circle cx="180" cy="241.2" r="5.5" fill="#378ADD"/>
  <circle cx="500" cy="160.56" r="5.5" fill="#378ADD"/>
  <circle cx="820" cy="132.56" r="5.5" fill="#378ADD"/>
  <text x="180" y="223" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="600" fill="#0C447C">81.5%</text>
  <text x="500" y="142" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="600" fill="#0C447C">88.7%</text>
  <text x="820" y="114" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#0C447C">91.2%</text>

  <!-- legend -->
  <circle cx="330" cy="415" r="5" fill="#B4B2A9"/>
  <text x="342" y="419" font-family="sans-serif" font-size="12" fill="#2C2C2A">Uniform LR (모든 층 동일)</text>
  <circle cx="560" cy="415" r="5.5" fill="#378ADD"/>
  <text x="572" y="419" font-family="sans-serif" font-size="12" fill="#2C2C2A">Differential LR (층별 차등)</text>
</svg>
