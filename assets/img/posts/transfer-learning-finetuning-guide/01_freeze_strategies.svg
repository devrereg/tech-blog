<svg width="900" height="470" viewBox="0 0 900 470" xmlns="http://www.w3.org/2000/svg">
  <rect width="900" height="470" fill="#ffffff"/>
  <text x="450" y="38" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="600" fill="#1a1a1a">층별 동결 전략 3가지 비교</text>

  <!-- Column headers -->
  <text x="185" y="80" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="600" fill="#1a1a1a">1. Full Freeze</text>
  <text x="450" y="72" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="600" fill="#1a1a1a">2. Partial Fine-tuning</text>
  <text x="450" y="90" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5f5e5a">(Last 2 Blocks)</text>
  <text x="715" y="80" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="600" fill="#1a1a1a">3. Full Fine-tuning</text>

  <!-- Column 1: Full Freeze -->
  <g font-family="sans-serif" font-size="12">
    <rect x="70" y="110" width="230" height="34" rx="6" fill="#E5E3DA"/>
    <text x="185" y="132" text-anchor="middle" fill="#6b6a63">layer1</text>
    <rect x="70" y="150" width="230" height="34" rx="6" fill="#E5E3DA"/>
    <text x="185" y="172" text-anchor="middle" fill="#6b6a63">layer2</text>
    <rect x="70" y="190" width="230" height="34" rx="6" fill="#E5E3DA"/>
    <text x="185" y="212" text-anchor="middle" fill="#6b6a63">layer3</text>
    <rect x="70" y="230" width="230" height="34" rx="6" fill="#E5E3DA"/>
    <text x="185" y="252" text-anchor="middle" fill="#6b6a63">layer4</text>
    <rect x="70" y="270" width="230" height="34" rx="6" fill="#378ADD"/>
    <text x="185" y="292" text-anchor="middle" font-weight="600" fill="#ffffff">fc (Head)</text>
  </g>
  <text x="185" y="330" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#8A8878">학습: 1개 / 고정: 4개</text>

  <!-- Column 2: Partial (last 2) -->
  <g font-family="sans-serif" font-size="12">
    <rect x="335" y="110" width="230" height="34" rx="6" fill="#E5E3DA"/>
    <text x="450" y="132" text-anchor="middle" fill="#6b6a63">layer1</text>
    <rect x="335" y="150" width="230" height="34" rx="6" fill="#E5E3DA"/>
    <text x="450" y="172" text-anchor="middle" fill="#6b6a63">layer2</text>
    <rect x="335" y="190" width="230" height="34" rx="6" fill="#378ADD"/>
    <text x="450" y="212" text-anchor="middle" font-weight="600" fill="#ffffff">layer3</text>
    <rect x="335" y="230" width="230" height="34" rx="6" fill="#378ADD"/>
    <text x="450" y="252" text-anchor="middle" font-weight="600" fill="#ffffff">layer4</text>
    <rect x="335" y="270" width="230" height="34" rx="6" fill="#378ADD"/>
    <text x="450" y="292" text-anchor="middle" font-weight="600" fill="#ffffff">fc (Head)</text>
  </g>
  <text x="450" y="330" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0C447C">학습: 3개 / 고정: 2개</text>

  <!-- Column 3: Full FT -->
  <g font-family="sans-serif" font-size="12">
    <rect x="600" y="110" width="230" height="34" rx="6" fill="#378ADD"/>
    <text x="715" y="132" text-anchor="middle" font-weight="600" fill="#ffffff">layer1</text>
    <rect x="600" y="150" width="230" height="34" rx="6" fill="#378ADD"/>
    <text x="715" y="172" text-anchor="middle" font-weight="600" fill="#ffffff">layer2</text>
    <rect x="600" y="190" width="230" height="34" rx="6" fill="#378ADD"/>
    <text x="715" y="212" text-anchor="middle" font-weight="600" fill="#ffffff">layer3</text>
    <rect x="600" y="230" width="230" height="34" rx="6" fill="#378ADD"/>
    <text x="715" y="252" text-anchor="middle" font-weight="600" fill="#ffffff">layer4</text>
    <rect x="600" y="270" width="230" height="34" rx="6" fill="#378ADD"/>
    <text x="715" y="292" text-anchor="middle" font-weight="600" fill="#ffffff">fc (Head)</text>
  </g>
  <text x="715" y="330" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0C447C">학습: 5개 / 고정: 0개</text>

  <!-- Legend -->
  <rect x="270" y="410" width="18" height="18" rx="3" fill="#378ADD"/>
  <text x="296" y="424" font-family="sans-serif" font-size="12" fill="#2C2C2A">학습됨 (requires_grad=True)</text>
  <rect x="540" y="410" width="18" height="18" rx="3" fill="#E5E3DA"/>
  <text x="566" y="424" font-family="sans-serif" font-size="12" fill="#2C2C2A">동결됨 (requires_grad=False)</text>
</svg>
