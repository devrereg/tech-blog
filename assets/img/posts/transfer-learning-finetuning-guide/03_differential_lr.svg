<svg width="900" height="440" viewBox="0 0 900 440" xmlns="http://www.w3.org/2000/svg">
  <rect width="900" height="440" fill="#ffffff"/>
  <text x="450" y="38" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="600" fill="#1a1a1a">차등 학습률 (Differential Learning Rate)</text>

  <defs>
    <marker id="dnarrow" viewBox="0 0 10 10" refX="5" refY="8" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M1 1L5 9L9 1" fill="none" stroke="#5f5e5a" stroke-width="1.5"/>
    </marker>
  </defs>

  <rect x="230" y="70" width="440" height="60" rx="10" fill="#DCEAFB"/>
  <text x="450" y="95" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="600" fill="#0C447C">Early Backbone</text>
  <text x="450" y="118" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#0C447C">lr × 0.1 (또는 freeze)</text>

  <line x1="450" y1="130" x2="450" y2="158" stroke="#5f5e5a" stroke-width="1.5" marker-end="url(#dnarrow)"/>

  <rect x="230" y="160" width="440" height="60" rx="10" fill="#AED2F5"/>
  <text x="450" y="185" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="600" fill="#042C53">Mid Backbone</text>
  <text x="450" y="208" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#042C53">lr × 1</text>

  <line x1="450" y1="220" x2="450" y2="248" stroke="#5f5e5a" stroke-width="1.5" marker-end="url(#dnarrow)"/>

  <rect x="230" y="250" width="440" height="60" rx="10" fill="#6FA8E0"/>
  <text x="450" y="275" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="600" fill="#ffffff">Late Backbone</text>
  <text x="450" y="298" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#ffffff">lr × 3</text>

  <line x1="450" y1="310" x2="450" y2="338" stroke="#5f5e5a" stroke-width="1.5" marker-end="url(#dnarrow)"/>

  <rect x="230" y="340" width="440" height="60" rx="10" fill="#1F5FA8"/>
  <text x="450" y="365" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="600" fill="#ffffff">Classifier Head</text>
  <text x="450" y="388" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#ffffff">lr × 10</text>

  <text x="450" y="425" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#5f5e5a">→ 뒤로 갈수록(출력에 가까울수록) 학습률을 크게</text>
</svg>
