<svg viewBox="0 0 900 420" xmlns="http://www.w3.org/2000/svg" font-family="'Pretendard','Malgun Gothic',sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="900" height="420" fill="#FAFAFA"/>
  <text x="450" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#1E293B">AlexNet 전이학습(Transfer Learning) 구조</text>

  <!-- Input image -->
  <rect x="30" y="150" width="90" height="90" rx="8" fill="#E2E8F0" stroke="#94A3B8"/>
  <text x="75" y="200" text-anchor="middle" font-size="13" fill="#334155">입력 이미지</text>
  <text x="75" y="216" text-anchor="middle" font-size="11" fill="#64748B">(개미/벌)</text>

  <!-- Arrow -->
  <line x1="125" y1="195" x2="165" y2="195" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Feature extractor (frozen-ish, pretrained) -->
  <rect x="170" y="90" width="280" height="210" rx="10" fill="#DBEAFE" stroke="#3B82F6" stroke-width="2"/>
  <text x="310" y="115" text-anchor="middle" font-size="15" font-weight="700" fill="#1D4ED8">features</text>
  <text x="310" y="133" text-anchor="middle" font-size="12" fill="#1D4ED8">(Conv 레이어 5개 + Pooling)</text>

  <rect x="190" y="150" width="60" height="120" rx="6" fill="#93C5FD"/>
  <rect x="260" y="160" width="60" height="100" rx="6" fill="#93C5FD"/>
  <rect x="330" y="170" width="60" height="80" rx="6" fill="#93C5FD"/>
  <text x="220" y="215" text-anchor="middle" font-size="10" fill="#1E3A8A">Conv</text>
  <text x="290" y="215" text-anchor="middle" font-size="10" fill="#1E3A8A">Conv</text>
  <text x="360" y="215" text-anchor="middle" font-size="10" fill="#1E3A8A">Conv</text>

  <text x="310" y="282" text-anchor="middle" font-size="12" font-weight="600" fill="#1D4ED8">✔ ImageNet 사전학습 가중치 그대로 재활용</text>

  <!-- Arrow -->
  <line x1="455" y1="195" x2="495" y2="195" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Classifier -->
  <rect x="500" y="90" width="280" height="210" rx="10" fill="#FEF3C7" stroke="#F59E0B" stroke-width="2"/>
  <text x="640" y="115" text-anchor="middle" font-size="15" font-weight="700" fill="#B45309">classifier</text>
  <text x="640" y="133" text-anchor="middle" font-size="12" fill="#B45309">(FC 레이어 3개)</text>

  <rect x="520" y="150" width="50" height="90" rx="6" fill="#FDE68A"/>
  <text x="545" y="200" text-anchor="middle" font-size="9" fill="#78350F">FC</text>
  <text x="545" y="212" text-anchor="middle" font-size="8" fill="#78350F">9216→4096</text>

  <rect x="585" y="150" width="50" height="90" rx="6" fill="#FDE68A"/>
  <text x="610" y="200" text-anchor="middle" font-size="9" fill="#78350F">FC</text>
  <text x="610" y="212" text-anchor="middle" font-size="8" fill="#78350F">4096→4096</text>

  <rect x="650" y="150" width="60" height="90" rx="6" fill="#FCA5A5" stroke="#DC2626" stroke-width="2"/>
  <text x="680" y="195" text-anchor="middle" font-size="9" font-weight="700" fill="#7F1D1D">FC[6]</text>
  <text x="680" y="208" text-anchor="middle" font-size="8" font-weight="700" fill="#7F1D1D">4096→2</text>
  <text x="680" y="220" text-anchor="middle" font-size="7" fill="#7F1D1D">(새로 교체!)</text>

  <text x="640" y="270" text-anchor="middle" font-size="12" font-weight="700" fill="#B45309">✂ 마지막 레이어만 교체</text>
  <text x="640" y="286" text-anchor="middle" font-size="11" fill="#B45309">1000개 클래스 → 2개 클래스</text>

  <!-- Arrow -->
  <line x1="785" y1="195" x2="825" y2="195" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Output -->
  <rect x="800" y="160" width="90" height="70" rx="8" fill="#DCFCE7" stroke="#16A34A"/>
  <text x="845" y="190" text-anchor="middle" font-size="12" font-weight="700" fill="#166534">ant</text>
  <text x="845" y="208" text-anchor="middle" font-size="12" font-weight="700" fill="#166534">or bee</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#94A3B8"/>
    </marker>
  </defs>

  <text x="450" y="360" text-anchor="middle" font-size="13" fill="#475569">파란 블록(features)은 그대로 얼려두거나 낮은 학습률로 살살 조정 · 노란/빨간 블록(classifier)만 새 데이터에 맞게 교체·학습</text>
  <text x="450" y="385" text-anchor="middle" font-size="12" fill="#94A3B8">→ 적은 데이터로도 빠르고 정확하게 학습 가능</text>
</svg>
