<svg width="1000" height="380" viewBox="0 0 1000 380" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, Arial, sans-serif">
  <defs>
    <marker id="a6" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#2b3a52"/>
    </marker>
  </defs>
  <rect width="1000" height="380" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="17" font-weight="700" fill="#1a1a1a">VAE 구조 흐름</text>

  <!-- input -->
  <rect x="40" y="150" width="110" height="90" rx="10" fill="#eef2fa" stroke="#9db8e0" stroke-width="1.5"/>
  <text x="95" y="190" text-anchor="middle" font-size="12" fill="#5f6470">Input</text>
  <text x="95" y="210" text-anchor="middle" font-size="12" fill="#5f6470">Image</text>

  <!-- Encoder -->
  <path d="M 190 150 L 300 175 L 300 215 L 190 240 Z" fill="#dce6f7" stroke="#2f6fd0" stroke-width="2"/>
  <text x="240" y="200" text-anchor="middle" font-size="12.5" font-weight="700" fill="#173a70">Encoder</text>

  <!-- mu / sigma -->
  <rect x="340" y="140" width="90" height="50" rx="8" fill="#e9def7" stroke="#7c4fd6" stroke-width="2"/>
  <text x="385" y="171" text-anchor="middle" font-size="14" font-weight="600" fill="#4a2c8a">μ</text>
  <rect x="340" y="200" width="90" height="50" rx="8" fill="#e9def7" stroke="#7c4fd6" stroke-width="2"/>
  <text x="385" y="231" text-anchor="middle" font-size="14" font-weight="600" fill="#4a2c8a">σ</text>
  <text x="385" y="128" text-anchor="middle" font-size="11" fill="#8a7fa6">Latent 분포</text>

  <!-- epsilon -->
  <rect x="430" y="285" width="130" height="46" rx="8" fill="#f3f4f6" stroke="#b9bec8" stroke-width="1.5"/>
  <text x="495" y="313" text-anchor="middle" font-size="11.5" fill="#5f6470">ε ~ N(0, 1)</text>

  <!-- sampling -->
  <rect x="480" y="160" width="150" height="70" rx="10" fill="#fbe8cc" stroke="#e08a1f" stroke-width="2"/>
  <text x="555" y="188" text-anchor="middle" font-size="11.5" fill="#8a520c">Sampling</text>
  <text x="555" y="210" text-anchor="middle" font-size="12.5" font-weight="600" fill="#8a520c">z = μ + σ·ε</text>

  <!-- Decoder -->
  <path d="M 680 175 L 790 150 L 790 240 L 680 215 Z" fill="#d7f0e2" stroke="#1f9e5c" stroke-width="2"/>
  <text x="740" y="200" text-anchor="middle" font-size="12.5" font-weight="700" fill="#146538">Decoder</text>

  <!-- output -->
  <rect x="840" y="150" width="120" height="90" rx="10" fill="#fdeef0" stroke="#eab6bd" stroke-width="1.5"/>
  <text x="900" y="185" text-anchor="middle" font-size="12" fill="#5f6470">Reconstructed</text>
  <text x="900" y="205" text-anchor="middle" font-size="12" fill="#5f6470">(New) Image</text>

  <!-- arrows -->
  <g stroke="#2b3a52" stroke-width="2.5" marker-end="url(#a6)" fill="none">
    <line x1="150" y1="195" x2="188" y2="195"/>
    <line x1="300" y1="195" x2="338" y2="195"/>
    <line x1="430" y1="165" x2="478" y2="180"/>
    <line x1="430" y1="225" x2="478" y2="210"/>
    <line x1="495" y1="285" x2="520" y2="232"/>
    <line x1="630" y1="195" x2="678" y2="195"/>
    <line x1="790" y1="195" x2="838" y2="195"/>
  </g>

  <text x="500" y="360" text-anchor="middle" font-size="12.5" font-style="italic" fill="#5f6470">Encoder는 이미지를 점이 아니라 (μ, σ) 분포로 인코딩하고, 그 분포에서 뽑은 z를 Decoder가 이미지로 되돌린다</text>
</svg>
