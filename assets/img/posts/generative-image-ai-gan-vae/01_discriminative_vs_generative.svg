<svg width="1000" height="360" viewBox="0 0 1000 360" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, Arial, sans-serif">
  <defs>
    <marker id="a1" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#2b3a52"/>
    </marker>
  </defs>
  <rect width="1000" height="360" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="17" font-weight="700" fill="#1a1a1a">판별형 AI vs 생성형 AI</text>

  <line x1="500" y1="60" x2="500" y2="330" stroke="#e2e4e9" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- Left: Discriminative -->
  <text x="250" y="80" text-anchor="middle" font-size="13.5" font-weight="600" fill="#2f6fd0">판별형 (Discriminative)</text>

  <rect x="55" y="110" width="130" height="110" rx="10" fill="#eef2fa" stroke="#9db8e0" stroke-width="1.5"/>
  <text x="120" y="150" text-anchor="middle" font-size="12" fill="#5f6470">입력 이미지</text>
  <text x="120" y="172" text-anchor="middle" font-size="26">🐱</text>
  <text x="120" y="200" text-anchor="middle" font-size="12" fill="#5f6470">(고양이 사진)</text>

  <rect x="215" y="128" width="110" height="74" rx="10" fill="#dce6f7" stroke="#2f6fd0" stroke-width="2"/>
  <text x="270" y="170" text-anchor="middle" font-size="13" font-weight="600" fill="#173a70">모델</text>

  <rect x="355" y="128" width="120" height="74" rx="10" fill="#d7f0e2" stroke="#1f9e5c" stroke-width="2"/>
  <text x="415" y="160" text-anchor="middle" font-size="13" font-weight="600" fill="#146538">고양이</text>
  <text x="415" y="182" text-anchor="middle" font-size="13" font-weight="600" fill="#146538">92%</text>

  <line x1="185" y1="165" x2="213" y2="165" stroke="#2b3a52" stroke-width="2.5" marker-end="url(#a1)"/>
  <line x1="325" y1="165" x2="353" y2="165" stroke="#2b3a52" stroke-width="2.5" marker-end="url(#a1)"/>

  <text x="250" y="270" text-anchor="middle" font-size="12.5" fill="#5f6470">입력 x → 레이블 y</text>
  <text x="250" y="292" text-anchor="middle" font-size="13" font-style="italic" fill="#2f6fd0">p(y | x) 를 학습</text>

  <!-- Right: Generative -->
  <text x="750" y="80" text-anchor="middle" font-size="13.5" font-weight="600" fill="#e2493b">생성형 (Generative)</text>

  <rect x="530" y="128" width="120" height="74" rx="10" fill="#f3f4f6" stroke="#b9bec8" stroke-width="1.5"/>
  <text x="590" y="158" text-anchor="middle" font-size="12" fill="#5f6470">무작위 노이즈</text>
  <text x="590" y="182" text-anchor="middle" font-size="13" font-weight="600" fill="#3a3f4a">z ~ N(0, I)</text>

  <rect x="680" y="128" width="110" height="74" rx="10" fill="#fbdada" stroke="#e2493b" stroke-width="2"/>
  <text x="735" y="170" text-anchor="middle" font-size="13" font-weight="600" fill="#8a231a">모델</text>

  <rect x="820" y="110" width="130" height="110" rx="10" fill="#fdeef0" stroke="#eab6bd" stroke-width="1.5"/>
  <text x="885" y="150" text-anchor="middle" font-size="12" fill="#5f6470">새 이미지</text>
  <text x="885" y="172" text-anchor="middle" font-size="26">🐱</text>
  <text x="885" y="200" text-anchor="middle" font-size="12" fill="#5f6470">(존재하지 않던)</text>

  <line x1="650" y1="165" x2="678" y2="165" stroke="#2b3a52" stroke-width="2.5" marker-end="url(#a1)"/>
  <line x1="790" y1="165" x2="818" y2="165" stroke="#2b3a52" stroke-width="2.5" marker-end="url(#a1)"/>

  <text x="750" y="270" text-anchor="middle" font-size="12.5" fill="#5f6470">노이즈 → 데이터 x</text>
  <text x="750" y="292" text-anchor="middle" font-size="13" font-style="italic" fill="#e2493b">p(x) 를 학습</text>

  <text x="500" y="338" text-anchor="middle" font-size="12.5" fill="#5f6470">"이 이미지가 무엇인가"를 답하는 AI  vs  "이런 이미지는 어떻게 생겼는가"를 배워 그려내는 AI</text>
</svg>
