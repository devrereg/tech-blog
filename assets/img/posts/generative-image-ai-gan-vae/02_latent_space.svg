<svg width="1000" height="440" viewBox="0 0 1000 440" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, Arial, sans-serif">
  <defs>
    <marker id="a2" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#7c4fd6"/>
    </marker>
  </defs>
  <rect width="1000" height="440" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="17" font-weight="700" fill="#1a1a1a">잠재 공간(Latent Space)과 샘플링</text>

  <!-- latent space plane -->
  <rect x="120" y="70" width="500" height="320" rx="14" fill="#f7f4fc" stroke="#c9b6ec" stroke-width="1.5"/>
  <text x="370" y="94" text-anchor="middle" font-size="12.5" fill="#7c4fd6">2차원 잠재 공간</text>

  <!-- axes -->
  <line x1="150" y1="360" x2="600" y2="360" stroke="#c9b6ec" stroke-width="1.2"/>
  <line x1="150" y1="360" x2="150" y2="110" stroke="#c9b6ec" stroke-width="1.2"/>

  <!-- mapped points (existing "3" images) -->
  <g fill="#7c4fd6">
    <circle cx="230" cy="180" r="6"/>
    <circle cx="285" cy="150" r="6"/>
    <circle cx="330" cy="220" r="6"/>
    <circle cx="410" cy="175" r="6"/>
    <circle cx="470" cy="250" r="6"/>
    <circle cx="360" cy="300" r="6"/>
    <circle cx="250" cy="270" r="6"/>
    <circle cx="510" cy="180" r="6"/>
  </g>
  <text x="230" y="168" text-anchor="middle" font-size="14" fill="#4a2c8a">3</text>
  <text x="470" y="238" text-anchor="middle" font-size="14" fill="#4a2c8a">3</text>
  <text x="250" y="258" text-anchor="middle" font-size="14" fill="#4a2c8a">3</text>

  <!-- new sampled point between two -->
  <circle cx="393" cy="245" r="8" fill="#e2493b"/>
  <text x="393" y="278" text-anchor="middle" font-size="11.5" fill="#e2493b">새로 뽑은 점</text>
  <line x1="360" y1="300" x2="388" y2="252" stroke="#e2493b" stroke-width="1.2" stroke-dasharray="3 3"/>
  <line x1="410" y1="175" x2="396" y2="238" stroke="#e2493b" stroke-width="1.2" stroke-dasharray="3 3"/>

  <text x="370" y="378" text-anchor="middle" font-size="11.5" fill="#8a7fa6">비슷한 이미지는 가까이 모인다</text>

  <!-- decode arrow -->
  <line x1="625" y1="230" x2="700" y2="230" stroke="#7c4fd6" stroke-width="2.5" marker-end="url(#a2)"/>
  <text x="662" y="218" text-anchor="middle" font-size="11.5" fill="#7c4fd6">Decoder</text>

  <!-- generated image -->
  <rect x="710" y="150" width="170" height="170" rx="12" fill="#fdeef0" stroke="#eab6bd" stroke-width="1.5"/>
  <text x="795" y="250" text-anchor="middle" font-size="60" fill="#8a231a" font-weight="700">3</text>
  <text x="795" y="300" text-anchor="middle" font-size="11.5" fill="#5f6470">두 스타일이 섞인 새 이미지</text>

  <text x="500" y="422" text-anchor="middle" font-size="12.5" fill="#5f6470">점과 점 사이를 샘플링하면 그 중간 성격의 새로운 이미지가 나온다</text>
</svg>
