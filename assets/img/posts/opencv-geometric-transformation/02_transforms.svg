<svg width="1000" height="300" viewBox="0 0 1000 300" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, Arial, sans-serif">
  <defs>
    <marker id="rarrow" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#e23b2e"/>
    </marker>
  </defs>
  <rect width="1000" height="300" fill="#ffffff"/>
  <text x="500" y="30" text-anchor="middle" font-size="16" font-weight="600" fill="#1a1a1a">기하학적 변환의 종류 — 점선(원본) → 실선(변환 후)</text>

  <!-- 1. Original -->
  <text x="100" y="70" text-anchor="middle" font-size="13" fill="#333">원본</text>
  <text x="100" y="88" text-anchor="middle" font-size="12" fill="#5f6470">Original</text>
  <rect x="65" y="150" width="70" height="70" fill="#dce6f7" stroke="#2f6fd0" stroke-width="2.5"/>

  <!-- 2. Translation -->
  <text x="300" y="70" text-anchor="middle" font-size="13" fill="#333">이동</text>
  <text x="300" y="88" text-anchor="middle" font-size="12" fill="#5f6470">Translation</text>
  <rect x="255" y="170" width="70" height="70" fill="none" stroke="#9aa1ad" stroke-width="1.5" stroke-dasharray="5 4"/>
  <rect x="285" y="135" width="70" height="70" fill="#dce6f7" stroke="#2f6fd0" stroke-width="2.5"/>
  <line x1="278" y1="212" x2="312" y2="178" stroke="#e23b2e" stroke-width="2" marker-end="url(#rarrow)"/>

  <!-- 3. Rotation -->
  <text x="500" y="70" text-anchor="middle" font-size="13" fill="#333">회전</text>
  <text x="500" y="88" text-anchor="middle" font-size="12" fill="#5f6470">Rotation</text>
  <rect x="465" y="150" width="70" height="70" fill="none" stroke="#9aa1ad" stroke-width="1.5" stroke-dasharray="5 4"/>
  <rect x="465" y="150" width="70" height="70" fill="#dce6f7" stroke="#2f6fd0" stroke-width="2.5" transform="rotate(22 500 185)"/>
  <circle cx="500" cy="185" r="3.5" fill="#e23b2e"/>

  <!-- 4. Scaling -->
  <text x="700" y="70" text-anchor="middle" font-size="13" fill="#333">확대/축소</text>
  <text x="700" y="88" text-anchor="middle" font-size="12" fill="#5f6470">Scaling</text>
  <rect x="665" y="150" width="70" height="70" fill="none" stroke="#9aa1ad" stroke-width="1.5" stroke-dasharray="5 4"/>
  <rect x="650" y="165" width="100" height="45" fill="#dce6f7" stroke="#2f6fd0" stroke-width="2.5"/>

  <!-- 5. Affine (shear) -->
  <text x="900" y="70" text-anchor="middle" font-size="13" fill="#333">아핀</text>
  <text x="900" y="88" text-anchor="middle" font-size="12" fill="#5f6470">Affine (전단)</text>
  <rect x="865" y="150" width="70" height="70" fill="none" stroke="#9aa1ad" stroke-width="1.5" stroke-dasharray="5 4"/>
  <polygon points="885,220 955,220 935,150 865,150" fill="#dce6f7" stroke="#2f6fd0" stroke-width="2.5"/>
</svg>
