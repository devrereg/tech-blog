<svg width="680" height="320" viewBox="0 0 680 320" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="680" height="320" fill="#ffffff"/>

  <!-- Content side -->
  <text x="170" y="35" font-family="sans-serif" font-size="15" fill="#0C447C" text-anchor="middle" font-weight="600">콘텐츠 손실</text>
  <text x="170" y="55" font-family="sans-serif" font-size="11" fill="#5F5E5A" text-anchor="middle">위치별로 직접 비교</text>

  <!-- feature map grid content -->
  <g transform="translate(70,75)">
    <rect x="0" y="0" width="200" height="100" fill="#E6F1FB" stroke="#378ADD"/>
    <line x1="50" y1="0" x2="50" y2="100" stroke="#B5D4F4"/>
    <line x1="100" y1="0" x2="100" y2="100" stroke="#B5D4F4"/>
    <line x1="150" y1="0" x2="150" y2="100" stroke="#B5D4F4"/>
    <line x1="0" y1="33" x2="200" y2="33" stroke="#B5D4F4"/>
    <line x1="0" y1="66" x2="200" y2="66" stroke="#B5D4F4"/>
    <rect x="100" y="33" width="50" height="33" fill="#378ADD" opacity="0.5"/>
    <text x="125" y="55" font-family="sans-serif" font-size="10" fill="#042C53" text-anchor="middle">(i,j)</text>
  </g>
  <text x="170" y="200" font-family="sans-serif" font-size="11" fill="#444441" text-anchor="middle">같은 위치(i,j)끼리 값을 빼서 제곱</text>
  <text x="170" y="218" font-family="sans-serif" font-size="11" fill="#444441" text-anchor="middle">→ 공간 배치(구도)가 보존됨</text>
  <text x="170" y="245" font-family="sans-serif" font-size="12" fill="#185FA5" text-anchor="middle" font-weight="600">사용 층: 1개 (예: conv4_2)</text>

  <!-- divider -->
  <line x1="340" y1="30" x2="340" y2="290" stroke="#D3D1C7" stroke-width="1"/>

  <!-- Style side -->
  <text x="510" y="35" font-family="sans-serif" font-size="15" fill="#633806" text-anchor="middle" font-weight="600">스타일 손실</text>
  <text x="510" y="55" font-family="sans-serif" font-size="11" fill="#5F5E5A" text-anchor="middle">위치를 없애고 채널끼리 비교 (Gram Matrix)</text>

  <!-- feature map -> gram matrix -->
  <g transform="translate(410,75)">
    <rect x="0" y="0" width="200" height="100" fill="#FAEEDA" stroke="#BA7517"/>
    <line x1="50" y1="0" x2="50" y2="100" stroke="#FAC775"/>
    <line x1="100" y1="0" x2="100" y2="100" stroke="#FAC775"/>
    <line x1="150" y1="0" x2="150" y2="100" stroke="#FAC775"/>
    <line x1="0" y1="33" x2="200" y2="33" stroke="#FAC775"/>
    <line x1="0" y1="66" x2="200" y2="66" stroke="#FAC775"/>
    <text x="100" y="120" font-family="sans-serif" font-size="10" fill="#5F5E5A" text-anchor="middle">위치별 활성화 값</text>
  </g>
  <text x="510" y="215" font-family="sans-serif" font-size="16" fill="#854F0B" text-anchor="middle">↓ 공간 축을 합산(sum)</text>
  <g transform="translate(460,225)">
    <rect x="0" y="0" width="100" height="50" fill="#FAC775" stroke="#854F0B"/>
    <line x1="25" y1="0" x2="25" y2="50" stroke="#EF9F27"/>
    <line x1="50" y1="0" x2="50" y2="50" stroke="#EF9F27"/>
    <line x1="75" y1="0" x2="75" y2="50" stroke="#EF9F27"/>
    <line x1="0" y1="16.6" x2="100" y2="16.6" stroke="#EF9F27"/>
    <line x1="0" y1="33.3" x2="100" y2="33.3" stroke="#EF9F27"/>
  </g>
  <text x="510" y="295" font-family="sans-serif" font-size="12" fill="#854F0B" text-anchor="middle" font-weight="600">사용 층: 여러 개 (conv1~conv5 등)</text>
</svg>
