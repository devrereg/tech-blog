<svg width="680" height="440" viewBox="0 0 680 440" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="680" height="440" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Row 1: inputs -->
  <rect x="40" y="30" width="150" height="50" rx="8" fill="#FAEEDA" stroke="#BA7517"/>
  <text x="115" y="60" font-family="sans-serif" font-size="13" fill="#633806" text-anchor="middle" font-weight="600">스타일 이미지 a</text>

  <rect x="265" y="30" width="150" height="50" rx="8" fill="#EEEDFE" stroke="#534AB7"/>
  <text x="340" y="52" font-family="sans-serif" font-size="13" fill="#26215C" text-anchor="middle" font-weight="600">생성 이미지 x</text>
  <text x="340" y="68" font-family="sans-serif" font-size="10" fill="#3C3489" text-anchor="middle">(최적화 대상, 노이즈에서 시작)</text>

  <rect x="490" y="30" width="150" height="50" rx="8" fill="#E6F1FB" stroke="#378ADD"/>
  <text x="565" y="60" font-family="sans-serif" font-size="13" fill="#0C447C" text-anchor="middle" font-weight="600">콘텐츠 이미지 p</text>

  <line x1="115" y1="80" x2="115" y2="110" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="340" y1="80" x2="340" y2="110" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="565" y1="80" x2="565" y2="110" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- Row 2: VGG19 -->
  <rect x="40" y="110" width="600" height="60" rx="8" fill="#F1EFE8" stroke="#888780"/>
  <text x="340" y="135" font-family="sans-serif" font-size="14" fill="#2C2C2A" text-anchor="middle" font-weight="600">VGG19 (가중치 고정, 특징 추출기로만 사용)</text>
  <text x="340" y="155" font-family="sans-serif" font-size="11" fill="#5F5E5A" text-anchor="middle">conv1 → conv2 → conv3 → conv4 → conv5</text>

  <line x1="115" y1="170" x2="115" y2="200" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="565" y1="170" x2="565" y2="200" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="340" y1="170" x2="230" y2="200" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="340" y1="170" x2="450" y2="200" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- Row 3: losses -->
  <rect x="40" y="200" width="230" height="60" rx="8" fill="#FAEEDA" stroke="#BA7517"/>
  <text x="155" y="225" font-family="sans-serif" font-size="13" fill="#633806" text-anchor="middle" font-weight="600">스타일 손실</text>
  <text x="155" y="243" font-family="sans-serif" font-size="10" fill="#854F0B" text-anchor="middle">여러 층 · Gram Matrix 비교</text>

  <rect x="410" y="200" width="230" height="60" rx="8" fill="#E6F1FB" stroke="#378ADD"/>
  <text x="525" y="225" font-family="sans-serif" font-size="13" fill="#0C447C" text-anchor="middle" font-weight="600">콘텐츠 손실</text>
  <text x="525" y="243" font-family="sans-serif" font-size="10" fill="#185FA5" text-anchor="middle">1개 층 · 특징 맵 직접 비교</text>

  <line x1="155" y1="260" x2="300" y2="300" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="525" y1="260" x2="380" y2="300" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- Row 4: total loss -->
  <rect x="230" y="300" width="220" height="55" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.5"/>
  <text x="340" y="323" font-family="sans-serif" font-size="13" fill="#26215C" text-anchor="middle" font-weight="600">총 손실 L_total</text>
  <text x="340" y="341" font-family="sans-serif" font-size="10" fill="#3C3489" text-anchor="middle">α·콘텐츠 손실 + β·스타일 손실</text>

  <line x1="340" y1="355" x2="340" y2="385" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- Row 5: gradient descent, loop back -->
  <rect x="200" y="385" width="280" height="45" rx="8" fill="#EAF3DE" stroke="#639922"/>
  <text x="340" y="412" font-family="sans-serif" font-size="12" fill="#27500A" text-anchor="middle" font-weight="600">경사하강법으로 x의 픽셀값 업데이트</text>

  <path d="M480 407 C 660 407, 660 130, 420 130" fill="none" stroke="#639922" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <text x="600" y="270" font-family="sans-serif" font-size="10" fill="#3B6D11" text-anchor="middle">반복 (수백 번)</text>
</svg>
