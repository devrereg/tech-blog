<svg width="680" height="260" viewBox="0 0 680 260" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="680" height="260" fill="#ffffff"/>

  <!-- Content box -->
  <rect x="30" y="60" width="160" height="120" rx="10" fill="#E6F1FB" stroke="#378ADD" stroke-width="1"/>
  <text x="110" y="115" font-family="sans-serif" font-size="14" fill="#0C447C" text-anchor="middle" font-weight="600">콘텐츠</text>
  <text x="110" y="135" font-family="sans-serif" font-size="12" fill="#185FA5" text-anchor="middle">형태 / 구도</text>
  <text x="110" y="155" font-family="sans-serif" font-size="11" fill="#5F5E5A" text-anchor="middle">(사진)</text>

  <!-- Plus -->
  <text x="215" y="130" font-family="sans-serif" font-size="26" fill="#5F5E5A" text-anchor="middle">+</text>

  <!-- Style box -->
  <rect x="245" y="60" width="160" height="120" rx="10" fill="#FAEEDA" stroke="#BA7517" stroke-width="1"/>
  <text x="325" y="115" font-family="sans-serif" font-size="14" fill="#633806" text-anchor="middle" font-weight="600">스타일</text>
  <text x="325" y="135" font-family="sans-serif" font-size="12" fill="#854F0B" text-anchor="middle">질감 / 색감 / 패턴</text>
  <text x="325" y="155" font-family="sans-serif" font-size="11" fill="#5F5E5A" text-anchor="middle">(그림)</text>

  <!-- Equals -->
  <text x="430" y="130" font-family="sans-serif" font-size="26" fill="#5F5E5A" text-anchor="middle">=</text>

  <!-- Result box -->
  <rect x="460" y="60" width="190" height="120" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.5"/>
  <text x="555" y="105" font-family="sans-serif" font-size="14" fill="#26215C" text-anchor="middle" font-weight="600">결과 이미지</text>
  <text x="555" y="128" font-family="sans-serif" font-size="12" fill="#3C3489" text-anchor="middle">콘텐츠의 형태 +</text>
  <text x="555" y="146" font-family="sans-serif" font-size="12" fill="#3C3489" text-anchor="middle">스타일의 화풍</text>

  <text x="340" y="225" font-family="sans-serif" font-size="13" fill="#444441" text-anchor="middle">Neural Style Transfer = 두 이미지의 서로 다른 정보를 하나로 합성</text>
</svg>
