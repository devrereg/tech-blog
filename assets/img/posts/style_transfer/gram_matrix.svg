<svg width="680" height="300" viewBox="0 0 680 300" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="680" height="300" fill="#ffffff"/>

  <text x="340" y="30" font-family="sans-serif" font-size="15" fill="#26215C" text-anchor="middle" font-weight="600">Gram Matrix: 필터(채널)끼리의 "궁합표"</text>

  <!-- filters -->
  <g transform="translate(60,70)">
    <rect x="0" y="0" width="90" height="40" rx="6" fill="#F0997B" stroke="#D85A30"/>
    <text x="45" y="25" font-family="sans-serif" font-size="11" fill="#4A1B0C" text-anchor="middle">노란색 탐지</text>
    <rect x="0" y="60" width="90" height="40" rx="6" fill="#97C459" stroke="#3B6D11"/>
    <text x="45" y="85" font-family="sans-serif" font-size="11" fill="#173404" text-anchor="middle">소용돌이 탐지</text>
    <rect x="0" y="120" width="90" height="40" rx="6" fill="#85B7EB" stroke="#185FA5"/>
    <text x="45" y="145" font-family="sans-serif" font-size="11" fill="#042C53" text-anchor="middle">직선 탐지</text>
  </g>

  <!-- gram matrix table -->
  <g transform="translate(260,70)">
    <rect x="0" y="0" width="360" height="160" fill="#F1EFE8" stroke="#888780"/>
    <line x1="120" y1="0" x2="120" y2="160" stroke="#B4B2A9"/>
    <line x1="240" y1="0" x2="240" y2="160" stroke="#B4B2A9"/>
    <line x1="0" y1="53.3" x2="360" y2="53.3" stroke="#B4B2A9"/>
    <line x1="0" y1="106.6" x2="360" y2="106.6" stroke="#B4B2A9"/>

    <rect x="0" y="0" width="120" height="53.3" fill="#F0997B" opacity="0.85"/>
    <text x="60" y="31" font-family="sans-serif" font-size="12" fill="#4A1B0C" text-anchor="middle" font-weight="600">높음</text>

    <rect x="120" y="53.3" width="120" height="53.3" fill="#97C459" opacity="0.85"/>
    <text x="180" y="85" font-family="sans-serif" font-size="12" fill="#173404" text-anchor="middle" font-weight="600">높음</text>

    <rect x="240" y="106.6" width="120" height="53.3" fill="#85B7EB" opacity="0.85"/>
    <text x="300" y="138" font-family="sans-serif" font-size="12" fill="#042C53" text-anchor="middle" font-weight="600">보통</text>

    <text x="60" y="85" font-family="sans-serif" font-size="12" fill="#5F5E5A" text-anchor="middle">낮음</text>
    <text x="180" y="138" font-family="sans-serif" font-size="12" fill="#5F5E5A" text-anchor="middle">낮음</text>
    <text x="300" y="31" font-family="sans-serif" font-size="12" fill="#5F5E5A" text-anchor="middle">낮음</text>
    <text x="60" y="138" font-family="sans-serif" font-size="12" fill="#5F5E5A" text-anchor="middle">낮음</text>
    <text x="300" y="85" font-family="sans-serif" font-size="12" fill="#5F5E5A" text-anchor="middle">낮음</text>
    <text x="180" y="31" font-family="sans-serif" font-size="12" fill="#5F5E5A" text-anchor="middle">낮음</text>
  </g>

  <text x="340" y="260" font-family="sans-serif" font-size="12" fill="#444441" text-anchor="middle">노란색 탐지기와 소용돌이 탐지기가 "같이 자주 켜지면" → 그 칸의 값이 커짐</text>
  <text x="340" y="280" font-family="sans-serif" font-size="12" fill="#444441" text-anchor="middle">이 궁합표 전체가 그 그림의 "화풍 지문" 역할을 함</text>
</svg>
