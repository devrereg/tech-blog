<svg width="1000" height="500" viewBox="0 0 1000 500" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, Arial, sans-serif">
  <defs>
    <marker id="karrow" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#2b3a52"/>
    </marker>
    <marker id="loopend" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#1f9e5c"/>
    </marker>
  </defs>
  <rect width="1000" height="500" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="17" font-weight="700" fill="#1a1a1a">RAFT 아키텍처 (Recurrent All-Pairs Field Transforms)</text>

  <!-- Frame boxes -->
  <rect x="30" y="70"  width="140" height="70" rx="8" fill="#eef1f5" stroke="#9aa1ad" stroke-width="1.5"/>
  <text x="100" y="110" text-anchor="middle" font-size="13" font-weight="600" fill="#333">Frame 1</text>
  <rect x="30" y="170" width="140" height="70" rx="8" fill="#eef1f5" stroke="#9aa1ad" stroke-width="1.5"/>
  <text x="100" y="210" text-anchor="middle" font-size="13" font-weight="600" fill="#333">Frame 2</text>

  <line x1="170" y1="105" x2="228" y2="150" stroke="#2b3a52" stroke-width="2" marker-end="url(#karrow)"/>
  <line x1="170" y1="205" x2="228" y2="180" stroke="#2b3a52" stroke-width="2" marker-end="url(#karrow)"/>

  <!-- Feature Encoder -->
  <rect x="230" y="110" width="190" height="110" rx="8" fill="#dce6f7" stroke="#2f6fd0" stroke-width="2"/>
  <text x="325" y="155" text-anchor="middle" font-size="13.5" font-weight="600" fill="#173a70">Feature Encoder</text>
  <text x="325" y="174" text-anchor="middle" font-size="13.5" font-weight="600" fill="#173a70">(CNN)</text>
  <text x="325" y="198" text-anchor="middle" font-size="11" fill="#5f6470">픽셀별 의미 특징 추출</text>

  <line x1="420" y1="165" x2="458" y2="165" stroke="#2b3a52" stroke-width="2" marker-end="url(#karrow)"/>

  <!-- Correlation volume -->
  <rect x="460" y="110" width="190" height="110" rx="8" fill="#e9def7" stroke="#7c4fd6" stroke-width="2"/>
  <text x="555" y="155" text-anchor="middle" font-size="13.5" font-weight="600" fill="#4a2c8a">4D Correlation</text>
  <text x="555" y="174" text-anchor="middle" font-size="13.5" font-weight="600" fill="#4a2c8a">Volume</text>
  <text x="555" y="198" text-anchor="middle" font-size="11" fill="#5f6470">모든 픽셀 쌍의 유사도 계산</text>

  <line x1="650" y1="165" x2="688" y2="165" stroke="#2b3a52" stroke-width="2" marker-end="url(#karrow)"/>

  <!-- GRU Update block -->
  <rect x="690" y="90" width="230" height="150" rx="10" fill="#d7f0e2" stroke="#1f9e5c" stroke-width="2"/>
  <text x="805" y="150" text-anchor="middle" font-size="14" font-weight="700" fill="#146538">GRU</text>
  <text x="805" y="170" text-anchor="middle" font-size="14" font-weight="700" fill="#146538">Update Block</text>
  <text x="805" y="191" text-anchor="middle" font-size="11" fill="#5f6470">반복 정제 (약 12회)</text>

  <path d="M885,95 A 55 35 0 0 1 895,130" fill="none" stroke="#1f9e5c" stroke-width="2" marker-end="url(#loopend)"/>
  <text x="912" y="88" font-size="13" font-weight="700" fill="#1f9e5c">×12</text>

  <!-- Context Encoder -->
  <rect x="460" y="350" width="230" height="90" rx="8" fill="#fbe8cc" stroke="#e08a1f" stroke-width="2"/>
  <text x="575" y="388" text-anchor="middle" font-size="13.5" font-weight="600" fill="#8a520c">Context Encoder</text>
  <text x="575" y="410" text-anchor="middle" font-size="11" fill="#5f6470">Frame 1의 문맥 정보 제공</text>
  <line x1="670" y1="350" x2="745" y2="242" stroke="#2b3a52" stroke-width="2" marker-end="url(#karrow)"/>

  <!-- Optical flow output -->
  <line x1="805" y1="240" x2="805" y2="318" stroke="#2b3a52" stroke-width="2" marker-end="url(#karrow)"/>
  <rect x="690" y="320" width="230" height="100" rx="8" fill="#fbdada" stroke="#e2493b" stroke-width="2"/>
  <text x="805" y="358" text-anchor="middle" font-size="13.5" font-weight="600" fill="#8a231a">Optical Flow (dx, dy)</text>
  <text x="805" y="380" text-anchor="middle" font-size="11" fill="#5f6470">H × W × 2 필드</text>

  <text x="500" y="470" text-anchor="middle" font-size="12.5" font-style="italic" fill="#5f6470">모든 픽셀 쌍의 상관관계를 4D 볼륨에 담고, GRU가 흐름장을 0에서부터 반복적으로 정제한다</text>
</svg>
