<svg width="1000" height="330" viewBox="0 0 1000 330" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, Arial, sans-serif">
  <defs>
    <marker id="karrow" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#2b3a52"/>
    </marker>
  </defs>
  <rect width="1000" height="330" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="17" font-weight="700" fill="#1a1a1a">추적 알고리즘 로드맵</text>

  <!-- 6 boxes -->
  <!-- box width 140, gap 18, start x=25 -->
  <g font-size="13.5" font-weight="600" text-anchor="middle">
    <rect x="25"  y="90" width="140" height="120" rx="10" fill="#dce6f7" stroke="#2f6fd0" stroke-width="2"/>
    <text x="95" y="140" fill="#173a70">템플릿</text>
    <text x="95" y="160" fill="#173a70">매칭</text>

    <rect x="183" y="90" width="140" height="120" rx="10" fill="#e9def7" stroke="#7c4fd6" stroke-width="2"/>
    <text x="253" y="132" fill="#4a2c8a">특징점</text>
    <text x="253" y="152" fill="#4a2c8a">검출 &amp;</text>
    <text x="253" y="172" fill="#4a2c8a">매칭</text>

    <rect x="341" y="90" width="140" height="120" rx="10" fill="#fbe8cc" stroke="#e08a1f" stroke-width="2"/>
    <text x="411" y="140" fill="#8a520c">MeanShift</text>
    <text x="411" y="160" fill="#8a520c">/ CamShift</text>

    <rect x="499" y="90" width="140" height="120" rx="10" fill="#d7f0e2" stroke="#1f9e5c" stroke-width="2"/>
    <text x="569" y="132" fill="#146538">Lucas-Kanade</text>
    <text x="569" y="152" fill="#146538">(Sparse</text>
    <text x="569" y="172" fill="#146538">Optical Flow)</text>

    <rect x="657" y="90" width="140" height="120" rx="10" fill="#d7ecf7" stroke="#1f8fc9" stroke-width="2"/>
    <text x="727" y="140" fill="#0f5a80">Dense</text>
    <text x="727" y="160" fill="#0f5a80">Optical Flow</text>

    <rect x="815" y="90" width="140" height="120" rx="10" fill="#fbdada" stroke="#e2493b" stroke-width="2"/>
    <text x="885" y="140" fill="#8a231a">RAFT</text>
    <text x="885" y="160" fill="#8a231a">(딥러닝)</text>
  </g>

  <line x1="165" y1="150" x2="181" y2="150" stroke="#2b3a52" stroke-width="2.5" marker-end="url(#karrow)"/>
  <line x1="323" y1="150" x2="339" y2="150" stroke="#2b3a52" stroke-width="2.5" marker-end="url(#karrow)"/>
  <line x1="481" y1="150" x2="497" y2="150" stroke="#2b3a52" stroke-width="2.5" marker-end="url(#karrow)"/>
  <line x1="639" y1="150" x2="655" y2="150" stroke="#2b3a52" stroke-width="2.5" marker-end="url(#karrow)"/>
  <line x1="797" y1="150" x2="813" y2="150" stroke="#2b3a52" stroke-width="2.5" marker-end="url(#karrow)"/>

  <text x="500" y="266" text-anchor="middle" font-size="12.5" font-style="italic" fill="#5f6470">픽셀 기반  →  특징 기반  →  분포 기반  →  모션 벡터 기반  →  딥러닝 기반</text>
</svg>
