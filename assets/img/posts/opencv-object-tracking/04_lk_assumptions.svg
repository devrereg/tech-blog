<svg width="1000" height="360" viewBox="0 0 1000 360" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, Arial, sans-serif">
  <defs>
    <marker id="narrow" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#2b3a52"/>
    </marker>
    <marker id="rarrow" markerWidth="8" markerHeight="8" refX="5" refY="2.5" orient="auto">
      <path d="M0,0 L5,2.5 L0,5 Z" fill="#e2493b"/>
    </marker>
    <marker id="garrow3" markerWidth="8" markerHeight="8" refX="5" refY="2.5" orient="auto">
      <path d="M0,0 L5,2.5 L0,5 Z" fill="#1f9e5c"/>
    </marker>
  </defs>
  <rect width="1000" height="360" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="17" font-weight="700" fill="#1a1a1a">Lucas-Kanade Optical Flow의 3가지 핵심 가정</text>

  <!-- divider lines -->
  <line x1="335" y1="60" x2="335" y2="310" stroke="#e2e5eb" stroke-width="1"/>
  <line x1="670" y1="60" x2="670" y2="310" stroke="#e2e5eb" stroke-width="1"/>

  <!-- 1. Brightness constancy -->
  <text x="167" y="80" text-anchor="middle" font-size="14.5" font-weight="600" fill="#173a70">1. 밝기 보존 가정</text>
  <rect x="65"  y="150" width="80" height="80" fill="#2b3245"/>
  <rect x="222" y="150" width="80" height="80" fill="#2b3245"/>
  <line x1="150" y1="190" x2="217" y2="190" stroke="#2f6fd0" stroke-width="2.5" marker-end="url(#narrow)"/>
  <text x="183" y="178" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1f9e5c">동일한 밝기</text>
  <text x="105" y="248" text-anchor="middle" font-size="12" fill="#5f6470">t</text>
  <text x="262" y="248" text-anchor="middle" font-size="12" fill="#5f6470">t + dt</text>
  <text x="167" y="284" text-anchor="middle" font-size="12" fill="#333">한 점의 밝기값은</text>
  <text x="167" y="302" text-anchor="middle" font-size="12" fill="#333">시간이 지나도 변하지 않는다</text>

  <!-- 2. Small motion -->
  <text x="502" y="80" text-anchor="middle" font-size="14.5" font-weight="600" fill="#173a70">2. 미소 이동 가정</text>
  <text x="502" y="150" text-anchor="middle" font-size="13" font-weight="600" fill="#e2493b">Δx ≈ 0</text>
  <circle cx="470" cy="195" r="16" fill="#e08a1f"/>
  <circle cx="510" cy="195" r="16" fill="#f6cf9c"/>
  <line x1="486" y1="195" x2="502" y2="195" stroke="#e2493b" stroke-width="2.5" marker-end="url(#rarrow)"/>
  <g stroke="#9aa1ad" stroke-width="1.5">
    <line x1="415" y1="240" x2="415" y2="250"/>
    <line x1="453" y1="240" x2="453" y2="250"/>
    <line x1="491" y1="240" x2="491" y2="250"/>
    <line x1="529" y1="240" x2="529" y2="250"/>
    <line x1="567" y1="240" x2="567" y2="250"/>
    <line x1="415" y1="245" x2="567" y2="245"/>
  </g>
  <text x="502" y="272" text-anchor="middle" font-size="11" fill="#5f6470">매우 짧은 프레임 간격 (~1/30초)</text>
  <text x="502" y="296" text-anchor="middle" font-size="12" fill="#333">프레임 사이의 변위는</text>
  <text x="502" y="314" text-anchor="middle" font-size="12" fill="#333">매우 작다고 가정한다</text>

  <!-- 3. Spatial coherence -->
  <text x="837" y="80" text-anchor="middle" font-size="14.5" font-weight="600" fill="#173a70">3. 공간적 일관성 가정</text>
  <text x="837" y="106" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1f9e5c">이웃 픽셀들은 함께 움직인다</text>
  <g stroke="#1f9e5c" stroke-width="2.5">
    <line x1="757" y1="185" x2="782" y2="160" marker-end="url(#garrow3)"/>
    <line x1="827" y1="185" x2="852" y2="160" marker-end="url(#garrow3)"/>
    <line x1="897" y1="185" x2="922" y2="160" marker-end="url(#garrow3)"/>
    <line x1="757" y1="225" x2="782" y2="200" marker-end="url(#garrow3)"/>
    <line x1="827" y1="225" x2="852" y2="200" marker-end="url(#garrow3)"/>
    <line x1="897" y1="225" x2="922" y2="200" marker-end="url(#garrow3)"/>
    <line x1="757" y1="265" x2="782" y2="240" marker-end="url(#garrow3)"/>
    <line x1="827" y1="265" x2="852" y2="240" marker-end="url(#garrow3)"/>
    <line x1="897" y1="265" x2="922" y2="240" marker-end="url(#garrow3)"/>
  </g>
  <text x="837" y="296" text-anchor="middle" font-size="12" fill="#333">인접한 픽셀은 서로</text>
  <text x="837" y="314" text-anchor="middle" font-size="12" fill="#333">유사한 움직임을 가진다</text>
</svg>
