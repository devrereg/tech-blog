<svg width="900" height="320" viewBox="0 0 900 320" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, Arial, sans-serif">
  <rect width="900" height="320" fill="#ffffff"/>
  <text x="450" y="34" text-anchor="middle" font-size="18" font-weight="600" fill="#1a1a1a">최적화 함수별 손실 표면 위 이동 경로 (개념도)</text>

  <!-- SGD panel -->
  <g>
    <rect x="30" y="70" width="260" height="220" rx="10" fill="#fbeee7" stroke="#d9c9bd" stroke-width="1"/>
    <text x="160" y="96" text-anchor="middle" font-size="13" font-weight="600" fill="#993c1d">SGD — 지그재그로 느리게 이동</text>
    <circle cx="60" cy="115" r="5" fill="#2c2c2a"/>
    <text x="60" y="104" text-anchor="middle" font-size="10" fill="#5f5e5a">시작</text>
    <path d="M60 115 L100 150 L80 175 L110 195 L95 215 L118 228 L112 240 L130 248 L150 252 L170 254 L190 255 L210 255.5"
          fill="none" stroke="#d85a30" stroke-width="2" stroke-linecap="round"/>
    <path d="M210 255.5 L226 256 L242 256.3 L258 256.5" fill="none" stroke="#d85a30" stroke-width="2" stroke-dasharray="2 4" stroke-linecap="round"/>
    <path d="M220 240 l24 -8 l4 24 z" fill="#f2c14e" stroke="#993c1d" stroke-width="1"/>
  </g>

  <!-- Momentum panel -->
  <g>
    <rect x="320" y="70" width="260" height="220" rx="10" fill="#fff6e6" stroke="#e6d3a3" stroke-width="1"/>
    <text x="450" y="96" text-anchor="middle" font-size="13" font-weight="600" fill="#854f0b">Momentum — 관성으로 가속·진동 완화</text>
    <circle cx="350" cy="115" r="5" fill="#2c2c2a"/>
    <text x="350" y="104" text-anchor="middle" font-size="10" fill="#5f5e5a">시작</text>
    <path d="M350 115 C 360 160, 380 200, 400 218 C 420 236, 440 190, 460 172 C 480 154, 500 200, 505 214 C 508 222, 500 226, 495 220"
          fill="none" stroke="#fac775" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M510 232 l24 -8 l4 24 z" fill="#f2c14e" stroke="#854f0b" stroke-width="1"/>
  </g>

  <!-- Adam panel -->
  <g>
    <rect x="610" y="70" width="260" height="220" rx="10" fill="#eaf3de" stroke="#c3dba0" stroke-width="1"/>
    <text x="740" y="96" text-anchor="middle" font-size="13" font-weight="600" fill="#27500a">Adam — 자동 조정으로 빠르고 안정적</text>
    <circle cx="640" cy="115" r="5" fill="#2c2c2a"/>
    <text x="640" y="104" text-anchor="middle" font-size="10" fill="#5f5e5a">시작</text>
    <path d="M640 115 C 655 165, 700 220, 750 225 C 790 229, 810 215, 815 210"
          fill="none" stroke="#639922" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M800 224 l24 -8 l4 24 z" fill="#f2c14e" stroke="#27500a" stroke-width="1"/>
  </g>
</svg>
