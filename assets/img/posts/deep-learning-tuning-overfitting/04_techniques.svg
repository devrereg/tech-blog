<svg width="900" height="300" viewBox="0 0 900 300" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, Arial, sans-serif">
  <rect width="900" height="300" fill="#ffffff"/>
  <text x="450" y="34" text-anchor="middle" font-size="18" font-weight="600" fill="#1a1a1a">과적합을 막는 세 가지 접근: 드롭아웃 · 배치 정규화 · 데이터 증강</text>

  <!-- Dropout -->
  <g>
    <text x="150" y="70" text-anchor="middle" font-size="13" font-weight="600" fill="#0c447c">① Dropout — 뉴런 무작위 비활성화</text>
    <g stroke="#c7c5bb" stroke-width="1">
      <line x1="90" y1="110" x2="150" y2="110"/><line x1="90" y1="110" x2="150" y2="150"/><line x1="90" y1="110" x2="150" y2="190"/>
      <line x1="90" y1="150" x2="150" y2="110"/><line x1="90" y1="150" x2="150" y2="150"/><line x1="90" y1="150" x2="150" y2="190"/>
      <line x1="90" y1="190" x2="150" y2="110"/><line x1="90" y1="190" x2="150" y2="150"/><line x1="90" y1="190" x2="150" y2="190"/>
      <line x1="150" y1="110" x2="210" y2="110"/><line x1="150" y1="110" x2="210" y2="150"/><line x1="150" y1="110" x2="210" y2="190"/>
      <line x1="150" y1="150" x2="210" y2="110"/><line x1="150" y1="150" x2="210" y2="150"/><line x1="150" y1="150" x2="210" y2="190"/>
      <line x1="150" y1="190" x2="210" y2="110"/><line x1="150" y1="190" x2="210" y2="150"/><line x1="150" y1="190" x2="210" y2="190"/>
    </g>
    <circle cx="90" cy="110" r="10" fill="#378add"/>
    <circle cx="90" cy="150" r="10" fill="#378add"/>
    <circle cx="90" cy="190" r="10" fill="#378add"/>
    <circle cx="150" cy="110" r="10" fill="#378add"/>
    <circle cx="150" cy="150" r="10" fill="#ffffff" stroke="#d85a30" stroke-width="2"/>
    <path d="M143 143 l14 14 M157 143 l-14 14" stroke="#d85a30" stroke-width="2"/>
    <circle cx="150" cy="190" r="10" fill="#378add"/>
    <circle cx="210" cy="110" r="10" fill="#378add"/>
    <circle cx="210" cy="150" r="10" fill="#378add"/>
    <circle cx="210" cy="190" r="10" fill="#ffffff" stroke="#d85a30" stroke-width="2"/>
    <path d="M203 183 l14 14 M217 183 l-14 14" stroke="#d85a30" stroke-width="2"/>
    <text x="150" y="230" text-anchor="middle" font-size="11" fill="#5f5e5a">매번 다른 뉴런을 랜덤하게 끔</text>
    <text x="150" y="248" text-anchor="middle" font-size="11" fill="#5f5e5a">train() / eval() 동작이 다름</text>
  </g>

  <!-- BatchNorm -->
  <g>
    <text x="450" y="70" text-anchor="middle" font-size="13" font-weight="600" fill="#27500a">② BatchNorm — Conv → BN → ReLU</text>
    <text x="450" y="108" text-anchor="middle" font-size="15" fill="#2c2c2a">y = (x − E[x]) / √(Var[x] + ε) · γ + β</text>

    <rect x="340" y="130" width="80" height="50" rx="8" fill="#e6f1fb" stroke="#378add" stroke-width="1"/>
    <text x="380" y="160" text-anchor="middle" font-size="12" font-weight="600" fill="#0c447c">Conv</text>
    <line x1="420" y1="155" x2="440" y2="155" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow4)"/>

    <rect x="444" y="130" width="90" height="50" rx="8" fill="#eaf3de" stroke="#639922" stroke-width="1"/>
    <text x="489" y="152" text-anchor="middle" font-size="12" font-weight="600" fill="#27500a">BatchNorm</text>
    <text x="489" y="168" text-anchor="middle" font-size="10" fill="#3b6d11">평균0·분산1</text>
    <line x1="534" y1="155" x2="554" y2="155" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow4)"/>

    <rect x="558" y="130" width="80" height="50" rx="8" fill="#faeeda" stroke="#ba7517" stroke-width="1"/>
    <text x="598" y="160" text-anchor="middle" font-size="12" font-weight="600" fill="#633806">ReLU</text>

    <text x="450" y="212" text-anchor="middle" font-size="11" fill="#5f5e5a">값이 크게 흔들리는 Conv 출력을 BN이 안정화한 뒤</text>
    <text x="450" y="230" text-anchor="middle" font-size="11" fill="#5f5e5a">ReLU로 비선형성을 더한다</text>
    <text x="450" y="248" text-anchor="middle" font-size="11" fill="#5f5e5a">채널 수가 같아도 레이어마다 별도 인스턴스 필요</text>
  </g>

  <!-- Data Augmentation -->
  <g>
    <text x="750" y="70" text-anchor="middle" font-size="13" font-weight="600" fill="#633806">③ Data Augmentation — 데이터 다양화</text>

    <g transform="translate(700,100)">
      <path d="M20 8 L8 -8 L16 12 Z" fill="#fac775"/>
      <path d="M20 8 L32 -8 L24 12 Z" fill="#fac775"/>
      <circle cx="20" cy="24" r="20" fill="#fac775"/>
      <circle cx="13" cy="20" r="2" fill="#412402"/>
      <circle cx="27" cy="20" r="2" fill="#412402"/>
    </g>
    <text x="720" y="160" text-anchor="middle" font-size="10" fill="#854f0b">원본</text>

    <text x="758" y="122" text-anchor="middle" font-size="14" fill="#888780">→</text>

    <g transform="translate(770,100)">
      <path d="M20 8 L8 -8 L16 12 Z" fill="#fac775"/>
      <path d="M20 8 L32 -8 L24 12 Z" fill="#fac775"/>
      <circle cx="20" cy="24" r="20" fill="#fac775"/>
      <circle cx="27" cy="20" r="2" fill="#412402"/>
      <circle cx="13" cy="20" r="2" fill="#412402"/>
    </g>
    <text x="790" y="160" text-anchor="middle" font-size="10" fill="#854f0b">좌우 반전</text>

    <g transform="translate(700,175)">
      <path d="M20 8 L8 -8 L16 12 Z" fill="#fac775"/>
      <path d="M20 8 L32 -8 L24 12 Z" fill="#fac775"/>
      <circle cx="20" cy="24" r="20" fill="#fac775"/>
      <rect x="10" y="14" width="16" height="16" fill="#7a7568"/>
    </g>
    <text x="720" y="235" text-anchor="middle" font-size="10" fill="#854f0b">일부 가림</text>

    <text x="758" y="197" text-anchor="middle" font-size="14" fill="#888780">→</text>

    <g transform="translate(770,175)">
      <path d="M20 8 L8 -8 L16 12 Z" fill="#fac775"/>
      <path d="M20 8 L32 -8 L24 12 Z" fill="#fac775"/>
      <circle cx="20" cy="24" r="20" fill="#fac775"/>
      <circle cx="27" cy="20" r="2" fill="#412402"/>
      <rect x="6" y="14" width="16" height="16" fill="#7a7568"/>
    </g>
    <text x="790" y="235" text-anchor="middle" font-size="10" fill="#854f0b">반전+가림 동시</text>
  </g>

  <defs>
    <marker id="arrow4" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
</svg>
