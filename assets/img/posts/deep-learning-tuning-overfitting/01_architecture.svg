<svg width="900" height="330" viewBox="0 0 900 330" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, Arial, sans-serif">
  <rect width="900" height="330" fill="#ffffff"/>
  <text x="450" y="34" text-anchor="middle" font-size="18" font-weight="600" fill="#1a1a1a">6개 Conv + 3개 Pool로 구성된 CNN 아키텍처</text>
  <text x="450" y="56" text-anchor="middle" font-size="12" fill="#5f5e5a">풀링으로 이미지 크기가 절반이 될 때마다, 채널 수를 2배로 늘려 정보 손실을 보완한다</text>

  <!-- input -->
  <rect x="20" y="120" width="90" height="70" rx="8" fill="#f1efe8" stroke="#b4b2a9" stroke-width="1"/>
  <text x="65" y="150" text-anchor="middle" font-size="12" font-weight="600" fill="#2c2c2a">입력</text>
  <text x="65" y="166" text-anchor="middle" font-size="11" fill="#5f5e5a">32×32</text>

  <line x1="110" y1="155" x2="136" y2="155" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- stage 1 -->
  <g>
    <rect x="140" y="110" width="130" height="90" rx="8" fill="#e6f1fb" stroke="#378add" stroke-width="1"/>
    <text x="205" y="136" text-anchor="middle" font-size="12" font-weight="600" fill="#0c447c">conv1 · conv2</text>
    <text x="205" y="154" text-anchor="middle" font-size="11" fill="#185fa5">32채널</text>
    <rect x="155" y="164" width="100" height="24" rx="5" fill="#b5d4f4"/>
    <text x="205" y="180" text-anchor="middle" font-size="10" fill="#0c447c">pool1 → 16×16</text>
  </g>

  <line x1="270" y1="155" x2="296" y2="155" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- stage 2 -->
  <g>
    <rect x="300" y="110" width="130" height="90" rx="8" fill="#eaf3de" stroke="#639922" stroke-width="1"/>
    <text x="365" y="136" text-anchor="middle" font-size="12" font-weight="600" fill="#27500a">conv3 · conv4</text>
    <text x="365" y="154" text-anchor="middle" font-size="11" fill="#3b6d11">64채널</text>
    <rect x="315" y="164" width="100" height="24" rx="5" fill="#cfe5b3"/>
    <text x="365" y="180" text-anchor="middle" font-size="10" fill="#27500a">pool2 → 8×8</text>
  </g>

  <line x1="430" y1="155" x2="456" y2="155" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- stage 3 -->
  <g>
    <rect x="460" y="110" width="130" height="90" rx="8" fill="#faeeda" stroke="#ba7517" stroke-width="1"/>
    <text x="525" y="136" text-anchor="middle" font-size="12" font-weight="600" fill="#633806">conv5 · conv6</text>
    <text x="525" y="154" text-anchor="middle" font-size="11" fill="#854f0b">128채널</text>
    <rect x="475" y="164" width="100" height="24" rx="5" fill="#fac775"/>
    <text x="525" y="180" text-anchor="middle" font-size="10" fill="#633806">pool3 → 4×4</text>
  </g>

  <line x1="590" y1="155" x2="616" y2="155" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- classifier -->
  <g>
    <rect x="620" y="120" width="110" height="70" rx="8" fill="#eeedfe" stroke="#7f77dd" stroke-width="1"/>
    <text x="675" y="150" text-anchor="middle" font-size="12" font-weight="600" fill="#26215c">분류부</text>
    <text x="675" y="166" text-anchor="middle" font-size="11" fill="#3c3489">Classifier</text>
  </g>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- stage brackets -->
  <path d="M140 224 L270 224" stroke="#888780" stroke-width="1" fill="none"/>
  <path d="M140 224 L140 219" stroke="#888780" stroke-width="1"/>
  <path d="M270 224 L270 219" stroke="#888780" stroke-width="1"/>
  <text x="205" y="242" text-anchor="middle" font-size="11" fill="#5f5e5a">1단계: 저수준 특징</text>

  <path d="M300 224 L430 224" stroke="#888780" stroke-width="1" fill="none"/>
  <path d="M300 224 L300 219" stroke="#888780" stroke-width="1"/>
  <path d="M430 224 L430 219" stroke="#888780" stroke-width="1"/>
  <text x="365" y="242" text-anchor="middle" font-size="11" fill="#5f5e5a">2단계: 중간 수준 특징</text>

  <path d="M460 224 L590 224" stroke="#888780" stroke-width="1" fill="none"/>
  <path d="M460 224 L460 219" stroke="#888780" stroke-width="1"/>
  <path d="M590 224 L590 219" stroke="#888780" stroke-width="1"/>
  <text x="525" y="242" text-anchor="middle" font-size="11" fill="#5f5e5a">3단계: 고차원 특징</text>

  <rect x="20" y="270" width="860" height="42" rx="8" fill="#f6f5f0"/>
  <text x="450" y="296" text-anchor="middle" font-size="12" fill="#2c2c2a">"합성곱 2개(특징 추출) → 풀링 1개(크기 축소)" 패턴을 3번 반복하며, 크기는 줄이고 채널(특징의 깊이)은 늘려간다</text>
</svg>
