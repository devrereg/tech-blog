<svg width="900" height="440" viewBox="0 0 900 440" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, Arial, sans-serif">
  <rect width="900" height="440" fill="#ffffff"/>
  <text x="450" y="34" text-anchor="middle" font-size="18" font-weight="600" fill="#1a1a1a">과적합(Overfitting)의 전형적인 학습 곡선</text>

  <!-- axes -->
  <line x1="100" y1="360" x2="820" y2="360" stroke="#888780" stroke-width="1"/>
  <line x1="100" y1="70" x2="100" y2="360" stroke="#888780" stroke-width="1"/>
  <text x="70" y="75" text-anchor="end" font-size="11" fill="#5f5e5a">1.0</text>
  <text x="70" y="215" text-anchor="end" font-size="11" fill="#5f5e5a">0.5</text>
  <text x="70" y="365" text-anchor="end" font-size="11" fill="#5f5e5a">0.0</text>
  <line x1="100" y1="70" x2="820" y2="70" stroke="#eee" stroke-width="1"/>
  <line x1="100" y1="215" x2="820" y2="215" stroke="#eee" stroke-width="1"/>
  <text x="460" y="392" text-anchor="middle" font-size="12" fill="#5f5e5a">Epoch (학습 반복 횟수)</text>
  <text x="40" y="220" text-anchor="middle" font-size="12" fill="#5f5e5a" transform="rotate(-90 40 220)">Loss (손실)</text>

  <!-- optimal point line -->
  <line x1="470" y1="70" x2="470" y2="360" stroke="#b4b2a9" stroke-width="1" stroke-dasharray="4 3"/>

  <!-- shaded overfitting gap -->
  <path d="M470 231 C 560 224, 650 224, 820 233 L 820 253 C 650 240, 560 240, 470 250 Z" fill="#fbe2d9" opacity="0.7"/>

  <!-- train loss curve -->
  <path d="M110 90 C 200 190, 280 250, 360 285 C 420 305, 470 320, 560 335 C 650 345, 740 351, 810 354"
        fill="none" stroke="#378add" stroke-width="2.5" stroke-linecap="round"/>

  <!-- val loss curve -->
  <path d="M110 100 C 200 200, 280 258, 360 292 C 420 308, 460 313, 470 313 C 560 308, 650 295, 740 274 C 770 267, 795 260, 810 253"
        fill="none" stroke="#d85a30" stroke-width="2.5" stroke-linecap="round"/>

  <circle cx="470" cy="313" r="5" fill="#0c447c"/>
  <text x="470" y="330" text-anchor="middle" font-size="11" fill="#0c447c" transform="translate(0,15)"></text>

  <!-- annotations -->
  <text x="220" y="115" text-anchor="middle" font-size="12" font-weight="600" fill="#27500a">① 초기 단계</text>
  <text x="220" y="131" text-anchor="middle" font-size="11" fill="#3b6d11">훈련·검증 손실 모두 감소</text>

  <text x="470" y="55" text-anchor="middle" font-size="12" font-weight="600" fill="#0c447c">최적점 (검증 손실 최소)</text>

  <text x="690" y="115" text-anchor="middle" font-size="12" font-weight="600" fill="#993c1d">③ 과학습(과적합) 구간</text>
  <text x="690" y="131" text-anchor="middle" font-size="11" fill="#993c1d">훈련↓ 검증↑ 간격 벌어짐</text>

  <!-- legend -->
  <line x1="620" y1="395" x2="650" y2="395" stroke="#378add" stroke-width="3"/>
  <text x="656" y="399" font-size="12" fill="#2c2c2a">훈련 손실 (Train Loss)</text>
  <line x1="620" y1="415" x2="650" y2="415" stroke="#d85a30" stroke-width="3"/>
  <text x="656" y="419" font-size="12" fill="#2c2c2a">검증 손실 (Validation Loss)</text>
</svg>
