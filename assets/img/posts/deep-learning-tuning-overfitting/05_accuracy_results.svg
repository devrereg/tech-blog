<svg width="900" height="420" viewBox="0 0 900 420" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, Arial, sans-serif">
  <rect width="900" height="420" fill="#ffffff"/>
  <text x="450" y="34" text-anchor="middle" font-size="18" font-weight="600" fill="#1a1a1a">과적합 대응 기법 적용에 따른 검증 정확도 변화</text>

  <!-- axis -->
  <line x1="100" y1="340" x2="800" y2="340" stroke="#888780" stroke-width="1"/>
  <line x1="100" y1="80" x2="100" y2="340" stroke="#888780" stroke-width="1"/>
  <text x="70" y="90" text-anchor="end" font-size="11" fill="#5f5e5a">100%</text>
  <text x="70" y="215" text-anchor="end" font-size="11" fill="#5f5e5a">50%</text>
  <text x="70" y="345" text-anchor="end" font-size="11" fill="#5f5e5a">0%</text>
  <line x1="100" y1="86" x2="800" y2="86" stroke="#eee" stroke-width="1"/>
  <line x1="100" y1="213" x2="800" y2="213" stroke="#eee" stroke-width="1"/>

  <!-- baseline dashed line at 70% -->
  <line x1="100" y1="158" x2="800" y2="158" stroke="#c7c5bb" stroke-width="1" stroke-dasharray="3 3"/>

  <!-- bar 1: 기본 CNN 70% -->
  <rect x="150" y="158" width="150" height="182" fill="#b4b2a9"/>
  <text x="225" y="146" text-anchor="middle" font-size="16" font-weight="600" fill="#5f5e5a">70%</text>
  <text x="225" y="365" text-anchor="middle" font-size="13" fill="#2c2c2a">기본 CNN</text>
  <text x="225" y="384" text-anchor="middle" font-size="11" fill="#5f5e5a">(SGD only)</text>

  <!-- bar 2: +Dropout+BatchNorm 87% -->
  <rect x="375" y="106" width="150" height="234" fill="#378add"/>
  <text x="450" y="94" text-anchor="middle" font-size="16" font-weight="600" fill="#0c447c">87%</text>
  <text x="450" y="365" text-anchor="middle" font-size="13" fill="#2c2c2a">+ Dropout</text>
  <text x="450" y="384" text-anchor="middle" font-size="11" fill="#5f5e5a">+ BatchNorm</text>

  <!-- bar 3: +Augmentation 89% -->
  <rect x="600" y="93" width="150" height="247" fill="#1d9e75"/>
  <text x="675" y="81" text-anchor="middle" font-size="16" font-weight="600" fill="#085041">89%</text>
  <text x="675" y="365" text-anchor="middle" font-size="13" fill="#2c2c2a">+ Data</text>
  <text x="675" y="384" text-anchor="middle" font-size="11" fill="#5f5e5a">Augmentation</text>

  <!-- callouts -->
  <path d="M300 145 C 330 110, 350 110, 375 106" fill="none" stroke="#993c1d" stroke-width="1.5" stroke-dasharray="3 3"/>
  <text x="337" y="95" text-anchor="middle" font-size="13" font-weight="600" fill="#993c1d">+17%p</text>

  <path d="M525 100 C 555 75, 575 75, 600 93" fill="none" stroke="#085041" stroke-width="1.5" stroke-dasharray="3 3"/>
  <text x="562" y="65" text-anchor="middle" font-size="13" font-weight="600" fill="#085041">+2%p</text>
</svg>
