    <text x="360" y="292" text-anchor="middle" font-size="11" fill="#334155">예측 클래스에 대한 레이어별 기울기 추출 (역전파)</text>
  </g>
  <line x1="360" y1="316" x2="360" y2="350" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow-gc2)"/>

