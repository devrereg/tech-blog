    <text x="360" y="182" text-anchor="middle" font-size="11" fill="#334155">NORMAL 또는 PNEUMONIA로 분류</text>
  </g>
  <line x1="360" y1="206" x2="360" y2="240" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow-gc2)"/>

