    </marker>
  </defs>

  <g>
    <rect x="120" y="20" width="480" height="76" rx="10" fill="#f1f5f9" stroke="#94a3b8"/>
    <text x="360" y="50" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">① 입력 이미지</text>
    <text x="360" y="72" text-anchor="middle" font-size="11" fill="#64748b">흉부 X-ray를 모델에 입력</text>
  </g>
  <line x1="360" y1="96" x2="360" y2="130" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow-gc2)"/>

