<svg width="640" height="440" viewBox="0 0 640 440" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', 'Apple SD Gothic Neo', sans-serif">
  <rect width="640" height="440" fill="#ffffff"/>

  <text x="320" y="26" text-anchor="middle" font-size="13" font-weight="700" fill="#1e293b">혼동 행렬 (Confusion Matrix)</text>

  <!-- column headers -->
  <text x="330" y="58" text-anchor="middle" font-size="11" font-weight="700" fill="#475569">예측: 폐렴</text>
  <text x="530" y="58" text-anchor="middle" font-size="11" font-weight="700" fill="#475569">예측: 정상</text>

  <!-- row headers -->
  <text x="70" y="145" text-anchor="middle" font-size="11" font-weight="700" fill="#475569">실제: 폐렴</text>
  <text x="70" y="300" text-anchor="middle" font-size="11" font-weight="700" fill="#475569">실제: 정상</text>

  <!-- TP -->
  <rect x="230" y="70" width="200" height="140" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="330" y="130" text-anchor="middle" font-size="18" font-weight="700" fill="#1e3a8a">TP</text>
  <text x="330" y="150" text-anchor="middle" font-size="10.5" fill="#1e40af">폐렴을 폐렴으로</text>
  <text x="330" y="164" text-anchor="middle" font-size="10.5" fill="#1e40af">정확히 진단</text>

  <!-- FN (danger) -->
  <rect x="430" y="70" width="200" height="140" rx="8" fill="#fef3c7" stroke="#dc2626" stroke-width="2.5"/>
  <text x="530" y="122" text-anchor="middle" font-size="18" font-weight="700" fill="#92400e">FN ⚠</text>
  <text x="530" y="142" text-anchor="middle" font-size="10.5" fill="#92400e">폐렴인데 정상으로 오진</text>
  <text x="530" y="156" text-anchor="middle" font-size="10.5" font-weight="700" fill="#b91c1c">→ 치료 시기 놓쳐 가장 위험</text>

  <!-- FP -->
  <rect x="230" y="220" width="200" height="140" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="330" y="280" text-anchor="middle" font-size="18" font-weight="700" fill="#92400e">FP</text>
  <text x="330" y="300" text-anchor="middle" font-size="10.5" fill="#92400e">정상인데 폐렴으로 오진</text>
  <text x="330" y="314" text-anchor="middle" font-size="10.5" fill="#92400e">→ 불필요한 추가 검사</text>

  <!-- TN -->
  <rect x="430" y="220" width="200" height="140" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="530" y="280" text-anchor="middle" font-size="18" font-weight="700" fill="#1e3a8a">TN</text>
  <text x="530" y="300" text-anchor="middle" font-size="10.5" fill="#1e40af">정상을 정상으로</text>
  <text x="530" y="314" text-anchor="middle" font-size="10.5" fill="#1e40af">정확히 진단</text>

  <text x="320" y="400" text-anchor="middle" font-size="10.5" fill="#64748b">파란색 = 정확한 진단(TP·TN)  ·  주황색 = 오진(FP·FN)  ·  붉은 테두리 = 가장 위험한 오류</text>
</svg>
