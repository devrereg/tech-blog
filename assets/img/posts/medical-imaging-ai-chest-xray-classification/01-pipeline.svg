<svg width="720" height="480" viewBox="0 0 720 480" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', 'Apple SD Gothic Neo', sans-serif">
  <rect width="720" height="480" fill="#ffffff"/>
  <defs>
    <marker id="arrow-pipe" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <g>
    <rect x="120" y="20" width="480" height="76" rx="10" fill="#f1f5f9" stroke="#94a3b8"/>
    <text x="360" y="50" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">① 데이터 수집</text>
    <text x="360" y="72" text-anchor="middle" font-size="11" fill="#64748b">병원에서 X-ray, CT, MRI 영상을 모음</text>
  </g>
  <line x1="360" y1="96" x2="360" y2="130" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow-pipe)"/>

  <g>
    <rect x="120" y="130" width="480" height="76" rx="10" fill="#dbeafe" stroke="#3b82f6"/>
    <text x="360" y="160" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">② 전처리</text>
    <text x="360" y="182" text-anchor="middle" font-size="11" fill="#334155">화질을 다듬고, 전문의가 확인한 정답 라벨을 붙임</text>
  </g>
  <line x1="360" y1="206" x2="360" y2="240" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow-pipe)"/>

  <g>
    <rect x="120" y="240" width="480" height="76" rx="10" fill="#ccfbf1" stroke="#14b8a6"/>
    <text x="360" y="270" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">③ AI 모델 학습</text>
    <text x="360" y="292" text-anchor="middle" font-size="11" fill="#334155">CNN이 수만 장의 영상을 보며 병변 패턴을 학습</text>
  </g>
  <line x1="360" y1="316" x2="360" y2="350" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow-pipe)"/>

  <g>
    <rect x="120" y="350" width="480" height="76" rx="10" fill="#ede9fe" stroke="#8b5cf6"/>
    <text x="360" y="380" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">④ 진단 지원</text>
    <text x="360" y="402" text-anchor="middle" font-size="11" fill="#334155">AI가 의심 부위를 표시 → 의사가 최종 판단</text>
  </g>

  <rect x="120" y="446" width="480" height="26" rx="6" fill="#fff7ed" stroke="#f59e0b" stroke-dasharray="3,3"/>
  <text x="360" y="463" text-anchor="middle" font-size="10.5" fill="#92400e">핵심 원칙 — AI는 대체가 아니라 "보조": 최종 판단·책임은 의사에게 있음</text>
</svg>
