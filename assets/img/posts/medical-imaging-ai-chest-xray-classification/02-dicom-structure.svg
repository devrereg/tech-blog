<svg width="720" height="480" viewBox="0 0 720 480" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', 'Apple SD Gothic Neo', sans-serif">
  <rect width="720" height="480" fill="#ffffff"/>

  <text x="360" y="28" text-anchor="middle" font-size="13" font-weight="700" fill="#1e293b">DICOM 파일 하나의 구조</text>

  <g>
    <rect x="140" y="50" width="440" height="60" rx="8" fill="#f1f5f9" stroke="#94a3b8"/>
    <text x="360" y="76" text-anchor="middle" font-size="13" font-weight="700" fill="#1e293b">Header</text>
    <text x="360" y="96" text-anchor="middle" font-size="10.5" fill="#64748b">파일 식별자, 버전 정보 — 파일의 "신분증"</text>
  </g>

  <g>
    <rect x="140" y="122" width="440" height="150" rx="8" fill="#dbeafe" stroke="#3b82f6"/>
    <text x="360" y="146" text-anchor="middle" font-size="13" font-weight="700" fill="#1e293b">Meta Data</text>
    <text x="360" y="164" text-anchor="middle" font-size="10.5" fill="#334155">환자·촬영 정보 (개인정보 포함)</text>

    <g font-size="10" fill="#1e3a8a">
      <rect x="160" y="176" width="88" height="24" rx="12" fill="#eff6ff" stroke="#93c5fd"/>
      <text x="204" y="192" text-anchor="middle">환자명</text>
      <rect x="256" y="176" width="60" height="24" rx="12" fill="#eff6ff" stroke="#93c5fd"/>
      <text x="286" y="192" text-anchor="middle">나이</text>
      <rect x="324" y="176" width="60" height="24" rx="12" fill="#eff6ff" stroke="#93c5fd"/>
      <text x="354" y="192" text-anchor="middle">성별</text>
      <rect x="392" y="176" width="96" height="24" rx="12" fill="#eff6ff" stroke="#93c5fd"/>
      <text x="440" y="192" text-anchor="middle">촬영 날짜</text>
      <rect x="496" y="176" width="64" height="24" rx="12" fill="#eff6ff" stroke="#93c5fd"/>
      <text x="528" y="192" text-anchor="middle">병원명</text>

      <rect x="160" y="208" width="96" height="24" rx="12" fill="#eff6ff" stroke="#93c5fd"/>
      <text x="208" y="224" text-anchor="middle">장비 모델</text>
    </g>
    <text x="360" y="256" text-anchor="middle" font-size="10.5" fill="#1e40af">→ "60대 여성의 흉부 X-ray만 필터링" 같은 작업 가능</text>
  </g>

  <g>
    <rect x="140" y="284" width="440" height="76" rx="8" fill="#ccfbf1" stroke="#14b8a6"/>
    <text x="360" y="308" text-anchor="middle" font-size="13" font-weight="700" fill="#1e293b">Pixel Data</text>
    <g transform="translate(300,318)">
      <rect x="0" y="0" width="12" height="12" fill="#94a3b8"/>
      <rect x="13" y="0" width="12" height="12" fill="#475569"/>
      <rect x="26" y="0" width="12" height="12" fill="#cbd5e1"/>
      <rect x="0" y="13" width="12" height="12" fill="#334155"/>
      <rect x="13" y="13" width="12" height="12" fill="#94a3b8"/>
      <rect x="26" y="13" width="12" height="12" fill="#64748b"/>
    </g>
    <text x="360" y="352" text-anchor="middle" font-size="10.5" fill="#0f766e">실제 영상 픽셀 값 (그레이스케일 또는 컬러)</text>
  </g>

  <g>
    <rect x="140" y="392" width="440" height="60" rx="8" fill="#fef3c7" stroke="#f59e0b"/>
    <text x="360" y="416" text-anchor="middle" font-size="12" font-weight="700" fill="#92400e">⚠ 비식별화(익명화) 필수</text>
    <text x="360" y="436" text-anchor="middle" font-size="10.5" fill="#92400e">개인정보가 담겨 있어 AI 학습 전 반드시 처리 필요</text>
  </g>
</svg>
