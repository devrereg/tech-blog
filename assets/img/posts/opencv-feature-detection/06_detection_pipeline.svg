<svg width="1000" height="280" viewBox="0 0 1000 280" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, Arial, sans-serif">
  <defs>
    <marker id="karrow" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#2b3a52"/>
    </marker>
  </defs>
  <rect width="1000" height="280" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="16" font-weight="600" fill="#1a1a1a">영상 객체 검출 파이프라인 (Detection Process Flow)</text>

  <!-- 4 boxes width 210, gap 30, start x=35 -->
  <rect x="35"  y="80" width="210" height="120" rx="10" fill="#eef1f5" stroke="#9aa1ad" stroke-width="1.5"/>
  <rect x="275" y="80" width="210" height="120" rx="10" fill="#dce6f7" stroke="#2f6fd0" stroke-width="1.5"/>
  <rect x="515" y="80" width="210" height="120" rx="10" fill="#bcd2f2" stroke="#2f6fd0" stroke-width="1.8"/>
  <rect x="755" y="80" width="210" height="120" rx="10" fill="#c6ead5" stroke="#37a86a" stroke-width="1.8"/>

  <g text-anchor="middle">
    <circle cx="140" cy="108" r="13" fill="#2b3a52"/><text x="140" y="113" font-size="13" font-weight="700" fill="#fff">1</text>
    <circle cx="380" cy="108" r="13" fill="#2b3a52"/><text x="380" y="113" font-size="13" font-weight="700" fill="#fff">2</text>
    <circle cx="620" cy="108" r="13" fill="#2b3a52"/><text x="620" y="113" font-size="13" font-weight="700" fill="#fff">3</text>
    <circle cx="860" cy="108" r="13" fill="#2b3a52"/><text x="860" y="113" font-size="13" font-weight="700" fill="#fff">4</text>
  </g>
  <g text-anchor="middle" font-size="13" font-weight="600" fill="#1a1a1a">
    <text x="140" y="150">엣지 추출</text>
    <text x="380" y="150">공간 변환</text>
    <text x="620" y="150">피크 탐색</text>
    <text x="860" y="150">객체 판정</text>
  </g>
  <g text-anchor="middle" font-size="11" fill="#5f6470">
    <text x="140" y="176">Canny / Sobel</text>
    <text x="380" y="176">Image → Parameter Space</text>
    <text x="620" y="176">Accumulator Peak</text>
    <text x="860" y="176">도형 존재 확인</text>
  </g>

  <g stroke="#2b3a52" stroke-width="2.5">
    <line x1="246" y1="140" x2="274" y2="140" marker-end="url(#karrow)"/>
    <line x1="486" y1="140" x2="514" y2="140" marker-end="url(#karrow)"/>
    <line x1="726" y1="140" x2="754" y2="140" marker-end="url(#karrow)"/>
  </g>

  <text x="500" y="238" text-anchor="middle" font-size="12" fill="#5f6470">영상 → 엣지 찾기 → 도형으로 변환 → 투표로 검증 → 객체 확정</text>
</svg>
