<svg width="1000" height="300" viewBox="0 0 1000 300" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, Arial, sans-serif">
  <defs>
    <marker id="karrow" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#2b3a52"/>
    </marker>
  </defs>
  <rect width="1000" height="300" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="16" font-weight="600" fill="#1a1a1a">캐니(Canny) 엣지 검출 알고리즘 — 5단계</text>

  <!-- 5 boxes, width 168, gap 20, start x=40 -->
  <g>
    <rect x="40"  y="80" width="168" height="120" rx="10" fill="#eef1f5" stroke="#9aa1ad" stroke-width="1.5"/>
    <rect x="228" y="80" width="168" height="120" rx="10" fill="#e3ecfb" stroke="#2f6fd0" stroke-width="1.5"/>
    <rect x="416" y="80" width="168" height="120" rx="10" fill="#d0e0f7" stroke="#2f6fd0" stroke-width="1.5"/>
    <rect x="604" y="80" width="168" height="120" rx="10" fill="#bcd2f2" stroke="#2f6fd0" stroke-width="1.8"/>
    <rect x="792" y="80" width="168" height="120" rx="10" fill="#9dbdec" stroke="#2f6fd0" stroke-width="2"/>
  </g>
  <g text-anchor="middle">
    <circle cx="124" cy="108" r="13" fill="#2b3a52"/><text x="124" y="113" font-size="13" font-weight="700" fill="#fff">1</text>
    <circle cx="312" cy="108" r="13" fill="#2b3a52"/><text x="312" y="113" font-size="13" font-weight="700" fill="#fff">2</text>
    <circle cx="500" cy="108" r="13" fill="#2b3a52"/><text x="500" y="113" font-size="13" font-weight="700" fill="#fff">3</text>
    <circle cx="688" cy="108" r="13" fill="#2b3a52"/><text x="688" y="113" font-size="13" font-weight="700" fill="#fff">4</text>
    <circle cx="876" cy="108" r="13" fill="#2b3a52"/><text x="876" y="113" font-size="13" font-weight="700" fill="#fff">5</text>
  </g>
  <g text-anchor="middle" font-size="13" font-weight="600" fill="#1a1a1a">
    <text x="124" y="150">노이즈 제거</text>
    <text x="312" y="150">그래디언트 계산</text>
    <text x="500" y="150">비최대 억제</text>
    <text x="688" y="150">이중 임계값</text>
    <text x="876" y="150">Edge Tracking</text>
  </g>
  <g text-anchor="middle" font-size="11" fill="#5f6470">
    <text x="124" y="176">Gaussian Blur</text>
    <text x="312" y="176">Sobel Filter</text>
    <text x="500" y="176">Non-Max Suppression</text>
    <text x="688" y="176">Double Threshold</text>
    <text x="876" y="176">약한 엣지 연결 판정</text>
  </g>

  <g stroke="#2b3a52" stroke-width="2.5">
    <line x1="209" y1="140" x2="227" y2="140" marker-end="url(#karrow)"/>
    <line x1="397" y1="140" x2="415" y2="140" marker-end="url(#karrow)"/>
    <line x1="585" y1="140" x2="603" y2="140" marker-end="url(#karrow)"/>
    <line x1="773" y1="140" x2="791" y2="140" marker-end="url(#karrow)"/>
  </g>

  <text x="500" y="248" text-anchor="middle" font-size="12" fill="#5f6470">목표: 노이즈 억제 + 정확한 엣지 검출 + 단일 엣지 응답(One Pixel Width)</text>
</svg>
