<svg xmlns="http://www.w3.org/2000/svg" width="920" height="700" viewBox="0 0 920 700" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Segoe UI', sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666666"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6c8ebf"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="920" height="700" fill="#ffffff"/>

  <text x="460" y="28" text-anchor="middle" font-size="20" font-weight="700" fill="#222222">MAUM Read/Write DB 분리 구조와 복제 지연(Replication Lag) 장애</text>
  <text x="460" y="50" text-anchor="middle" font-size="12" font-weight="600" fill="#666666">기술 스택: Spring Boot3(Kotlin) · AbstractRoutingDataSource · MySQL (Primary-Replica) · Slack Bot</text>

  <!-- Client -->
  <rect x="380" y="70" width="160" height="46" rx="8" fill="#f5f5f5" stroke="#666666"/>
  <text x="460" y="98" text-anchor="middle" font-size="13" fill="#333333">Client 요청</text>

  <!-- API Server -->
  <rect x="380" y="140" width="160" height="56" rx="8" fill="#d5e8d4" stroke="#82b366"/>
  <text x="460" y="163" text-anchor="middle" font-size="13" fill="#333333">API 서버</text>
  <text x="460" y="180" text-anchor="middle" font-size="12" fill="#333333">Spring Boot3 (Kotlin)</text>

  <line x1="460" y1="116" x2="460" y2="140" stroke="#666666" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Router -->
  <rect x="285" y="222" width="350" height="44" rx="8" fill="#e1d5e7" stroke="#9673a6"/>
  <text x="460" y="240" text-anchor="middle" font-size="12.5" font-weight="700" fill="#333333">AbstractRoutingDataSource</text>
  <text x="460" y="256" text-anchor="middle" font-size="11.5" fill="#333333">@Transactional(readOnly) 여부로 커넥션 분기</text>

  <line x1="460" y1="196" x2="460" y2="222" stroke="#666666" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Write DB -->
  <rect x="130" y="330" width="220" height="68" rx="8" fill="#dae8fc" stroke="#6c8ebf"/>
  <text x="240" y="356" text-anchor="middle" font-size="13" font-weight="700" fill="#333333">Write DB (Primary)</text>
  <text x="240" y="374" text-anchor="middle" font-size="12" fill="#333333">INSERT · UPDATE · DELETE</text>
  <text x="240" y="390" text-anchor="middle" font-size="11" fill="#777777">readOnly = false</text>

  <!-- Read DB -->
  <rect x="570" y="330" width="220" height="68" rx="8" fill="#dae8fc" stroke="#6c8ebf"/>
  <text x="680" y="356" text-anchor="middle" font-size="13" font-weight="700" fill="#333333">Read DB (Replica)</text>
  <text x="680" y="374" text-anchor="middle" font-size="12" fill="#333333">SELECT</text>
  <text x="680" y="390" text-anchor="middle" font-size="11" fill="#777777">readOnly = true</text>

  <path d="M 345 244 Q 240 244 240 330" fill="none" stroke="#666666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 575 244 Q 680 244 680 330" fill="none" stroke="#666666" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Replication -->
  <line x1="350" y1="420" x2="570" y2="420" stroke="#6c8ebf" stroke-width="1.5" marker-end="url(#arrowBlue)"/>
  <text x="460" y="413" text-anchor="middle" font-size="11.5" fill="#6c8ebf">비동기 복제</text>
  <text x="460" y="437" text-anchor="middle" font-size="11.5" fill="#6c8ebf">(지연 수백 ms ~ 1초)</text>

  <!-- Problem path -->
  <path d="M 240 398 C 240 470 560 490 650 460" fill="none" stroke="#b85450" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrowRed)"/>
  <rect x="470" y="470" width="320" height="86" rx="8" fill="#f8cecc" stroke="#b85450" stroke-dasharray="4,3"/>
  <text x="630" y="492" text-anchor="middle" font-size="12.5" font-weight="700" fill="#8a2e2a">문제: 쓰기 직후 즉시 재조회</text>
  <text x="630" y="510" text-anchor="middle" font-size="11.5" fill="#8a2e2a">→ 복제 반영 전 Replica 조회</text>
  <text x="630" y="528" text-anchor="middle" font-size="11.5" fill="#8a2e2a">→ 데이터 없음 (요청 간헐적 실패)</text>
  <text x="630" y="546" text-anchor="middle" font-size="10.5" fill="#a85450">* readOnly=true 트랜잭션은 그대로 Replica로 라우팅</text>

  <!-- Slack bug alert bot: how this incident was noticed and handled -->
  <rect x="700" y="70" width="170" height="52" rx="8" fill="#fff2cc" stroke="#d6b656"/>
  <text x="785" y="92" text-anchor="middle" font-size="12.5" font-weight="700" fill="#333333">Slack 버그 알림봇</text>
  <text x="785" y="109" text-anchor="middle" font-size="10.5" fill="#777777">에러 로그 실시간 알림</text>
  <path d="M 540 168 L 700 168 L 700 122" fill="none" stroke="#d6b656" stroke-width="1.3" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <text x="620" y="161" text-anchor="middle" font-size="10.5" fill="#8a7020">에러 로그 전송</text>

  <!-- RCA / response box -->
  <rect x="60" y="600" width="800" height="80" rx="8" fill="#ffe6cc" stroke="#d79b00"/>
  <text x="460" y="624" text-anchor="middle" font-size="12.5" font-weight="700" fill="#333333">대응: 알림 수신 시각 ↔ 애플리케이션 로그 시각 대조로 에러 메세지 특정</text>
  <text x="460" y="644" text-anchor="middle" font-size="12.5" fill="#333333">→ 복제 지연 확인 → 해당 구간 읽기를 Write DB(Primary)로 전환</text>
  <text x="460" y="664" text-anchor="middle" font-size="11.5" fill="#8a5a00">→ 동일 유형 장애는 복제 지연부터 확인하는 대응 절차로 정립</text>

  <line x1="785" y1="122" x2="785" y2="560" stroke="#d6b656" stroke-width="1.3" stroke-dasharray="4,3"/>
  <line x1="785" y1="560" x2="700" y2="600" stroke="#d6b656" stroke-width="1.3" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <line x1="630" y1="556" x2="460" y2="600" stroke="#b85450" stroke-width="1.3" stroke-dasharray="4,3" marker-end="url(#arrowRed)"/>
</svg>
