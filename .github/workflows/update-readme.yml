name: Update README with Latest Posts

on:
  schedule:
    - cron: "0 0 * * *" # 매일 00:00 UTC (한국 시간 오전 9시)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: gautamkrishnar/blog-post-workflow@v1
        with:
          feed_list: "https://devrereg.github.io/tech-blog/feed.xml"
          max_post_count: 5
